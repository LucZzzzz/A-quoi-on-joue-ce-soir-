<style id="theme-flat">
  :root {
    color-scheme: light dark;
    --bg: #F5F5F2;
    --surface: #FFFFFF;
    --surface-2: #ECECE7;
    --line: #E1E1DB;
    --text: #1B1B1A;
    --dim: #6B6B65;
    --primary: #1B1B1A;
    --on-primary: #FFFFFF;
    --accent: #2B6CB0;
    --green: #2E9E6B;
    --red: #D64545;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --ic-deck: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'><rect x='6.5' y='4' width='11' height='16' rx='2.5'/><path d='M3 7.5v9M21 7.5v9'/></svg>");
    --ic-library: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><rect x='4' y='4' width='6.5' height='6.5' rx='1.5'/><rect x='13.5' y='4' width='6.5' height='6.5' rx='1.5'/><rect x='4' y='13.5' width='6.5' height='6.5' rx='1.5'/><rect x='13.5' y='13.5' width='6.5' height='6.5' rx='1.5'/></svg>");
    --ic-matches: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><path d='M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z'/></svg>");
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --surface: #1E1E1E; --surface-2: #2A2A2A; --line: #303030;
      --text: #EDEDEB; --dim: #9B9B95; --primary: #EDEDEB; --on-primary: #141414;
      --accent: #6EA8FE; --green: #3DBB84; --red: #F06B6B;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15.5px; font-weight: 400; line-height: 1.35; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- En-tête ---------- */
  header.top { padding: 18px 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { min-width: 0; }
  .brand-sub { font-size: 12.5px; color: var(--dim); line-height: 1.2; margin-bottom: 2px; white-space: nowrap; }
  .brand h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.015em; margin: 0; line-height: 1.15; white-space: nowrap; color: var(--text); }
  .head-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .theme-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--dim); font-size: 15px; line-height: 1; cursor: pointer; }
  .room-pill { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--dim); font-size: 13px; white-space: nowrap; cursor: pointer; }
  .room-pill b { color: var(--text); font-weight: 650; letter-spacing: 0.08em; }
  .rule, .hazard { display: none; }

  .players-row { padding: 6px 20px 8px; display: flex; align-items: center; gap: 6px; overflow-x: auto; }
  .player { display: flex; align-items: center; gap: 6px; flex: none; padding: 3px 11px 3px 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .player svg { width: 24px; height: 24px; display: block; }
  .player span { font-size: 13px; font-weight: 500; color: var(--text); max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player.off { opacity: 0.45; }
  .toggle-playing { margin-left: auto; font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px; flex: none; cursor: pointer; user-select: none; align-self: center; padding-left: 8px; }
  .switch { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-2); position: relative; transition: background .15s ease; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); transition: transform .15s ease; }
  .switch.on { background: var(--green); }
  .switch.on::after { transform: translateX(14px); }

  main { flex: 1; padding: 0 20px 8px; display: flex; flex-direction: column; min-height: 0; }

  .info-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 14.5px; color: var(--dim); line-height: 1.45; }
  .info-box strong { font-weight: 650; font-size: 15px; color: var(--text); }
  .info-box em { font-style: normal; font-weight: 600; color: var(--text); }
  .hint { font-size: 13.5px; color: var(--dim); line-height: 1.45; }
  .hint b { color: var(--text); font-weight: 600; }

  /* ---------- Paquet de cartes ---------- */
  .deck-progress { width: 100%; max-width: 320px; align-self: center; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--dim); }
  .deck-progress .bar { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
  .deck-progress .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); border-radius: 99px; }
  .deck-progress span { flex: none; }

  .deck-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; position: relative; }
  .deck-stack { position: relative; width: min(100%, 320px, max(150px, calc((100vh - 385px) * 0.75))); width: min(100%, 320px, max(150px, calc((100dvh - 385px) * 0.75))); aspect-ratio: 3 / 4; }
  .swipe-card { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: none; will-change: transform; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .swipe-card:active { cursor: grabbing; }
  @keyframes cardPopIn { from { transform: scale(.96) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .swipe-card.card-enter { animation: cardPopIn .28s ease-out backwards; }
  .bk, .orn, .hud { display: none; }

  .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--surface-2) !important; }
  .cover-blob { display: none; }
  .cover-emoji { font-size: 56px; filter: grayscale(1); opacity: 0.5; }
  .cover-emoji.sm { font-size: 18px; }
  .grid-cover .cover-emoji.sm { font-size: 28px; }
  .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface-2); pointer-events: none; -webkit-user-drag: none; user-select: none; }

  @keyframes stampPunchYes { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes stampPunchNo { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .stamp.yes.punch { animation: stampPunchYes .3s ease-out both; }
  .stamp.no.punch { animation: stampPunchNo .3s ease-out both; }
  .swipe-card .stamp { position: absolute; top: 16px; z-index: 6; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; padding: 6px 14px; border-radius: 999px; color: #fff; opacity: 0; pointer-events: none; }
  .swipe-card .stamp.yes { right: 16px; background: var(--green); }
  .swipe-card .stamp.no { left: 16px; background: var(--red); }

  .card-caption { width: 100%; max-width: 320px; margin-top: 18px; text-align: left; }
  .card-caption .name { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; color: var(--text); }
  .card-caption .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; min-width: 0; }
  .card-caption .tag { flex: none; font-size: 11.5px; font-weight: 600; color: var(--dim); background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }
  .card-caption .added-by { font-size: 13.5px; color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .deck-actions { display: flex; gap: 20px; align-items: center; justify-content: center; margin-top: 16px; padding-bottom: 6px; }
  .round-btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--red); font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .1s ease; }
  .round-btn:active { transform: scale(0.93); }
  .round-btn.yes { width: 64px; height: 64px; border-color: transparent; background: var(--green); color: #fff; font-size: 26px; }

  /* ---------- Boutons, titres, formulaires ---------- */
  .section-title { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin: 0; color: var(--dim); }
  .section-title.ornate { margin: 20px 0 10px; }
  .btn { font-family: var(--font); font-weight: 600; font-size: 14px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; line-height: 1.15; }
  .btn:active { opacity: 0.8; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
  .link-btn { background: none; border: none; padding: 8px 0 2px; font-family: var(--font); font-size: 13.5px; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }

  .view-toggle { display: flex; gap: 4px; flex: none; padding: 3px; background: var(--surface-2); border-radius: 9px; }
  .view-toggle button { background: transparent; border: none; color: var(--dim); border-radius: 7px; padding: 3px 9px; font-size: 15px; line-height: 1.3; cursor: pointer; }
  .view-toggle button.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .icon-btn { background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px; display: flex; align-items: center; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.danger { color: var(--red); }

  .inline-form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .inline-form input[type=text], .inline-form textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: var(--font); font-size: 15px; outline: none; width: 100%; }
  .inline-form textarea { min-height: 110px; resize: vertical; }
  .inline-form input::placeholder, .inline-form textarea::placeholder { color: var(--dim); opacity: 0.7; }
  .inline-form input:focus, .inline-form textarea:focus { border-color: var(--accent); }

  .import-preview { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  .import-row { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14.5px; }
  .import-row input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .import-row .ir-name { flex: 1; line-height: 1.25; min-width: 0; }
  .import-row .ir-meta { font-size: 12px; color: var(--dim); flex: none; }
  .import-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Bibliothèque ---------- */
  .game-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .game-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 12px; }
  .g-cover { width: 40px; height: 40px; flex: none; position: relative; overflow: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .g-main { flex: 1; min-width: 0; }
  .g-name { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .g-by { font-size: 13px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-tag { font-size: 11.5px; font-weight: 600; color: var(--dim); background: var(--surface-2); padding: 2px 8px; border-radius: 6px; flex: none; }

  .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; margin-top: 12px; }
  .grid-item { display: flex; flex-direction: column; gap: 5px; }
  .grid-cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); }
  .grid-del { position: absolute; top: 5px; right: 5px; z-index: 6; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .grid-name { font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .grid-by { font-size: 12.5px; color: var(--dim); text-align: center; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Matchs ---------- */
  .match-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .match-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
  .match-row.full { border-color: var(--green); background: color-mix(in srgb, var(--green) 9%, var(--surface)); }
  .match-row .m-body { flex: 1; min-width: 0; }
  .match-row .m-name { font-weight: 650; font-size: 15px; line-height: 1.2; }
  .match-row .m-score { font-size: 13.5px; color: var(--dim); margin-top: 2px; line-height: 1.25; }
  .match-row .m-badge { flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: #fff; background: var(--green); padding: 3px 8px; border-radius: 6px; }

  /* ---------- Navigation ---------- */
  nav.tabbar { position: sticky; bottom: 0; display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
  nav.tabbar .tab { flex: 1; text-align: center; padding: 6px 4px 4px; color: var(--dim); cursor: pointer; }
  nav.tabbar .tab.active { color: var(--text); }
  nav.tabbar .tab .ic { display: block; height: 24px; }
  nav.tabbar .tab .ic::before { content: ''; display: block; width: 24px; height: 24px; margin: 0 auto; background: currentColor; -webkit-mask: var(--ic) center / contain no-repeat; mask: var(--ic) center / contain no-repeat; }
  nav.tabbar .tab[data-tab=deck] .ic::before { --ic: var(--ic-deck); }
  nav.tabbar .tab[data-tab=library] .ic::before { --ic: var(--ic-library); }
  nav.tabbar .tab[data-tab=matches] .ic::before { --ic: var(--ic-matches); }
  nav.tabbar .tab .lb { font-size: 11.5px; font-weight: 600; display: block; margin-top: 2px; }

  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) translateY(-8px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; line-height: 1.3; opacity: 0; transition: opacity .18s ease, transform .18s ease; pointer-events: none; z-index: 50; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
  .gate .box { max-width: 340px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px 22px 22px; }
  .gate .brand-sub { margin-bottom: 6px; }
  .gate h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 8px; }
  .gate p { color: var(--dim); font-size: 14.5px; line-height: 1.45; margin: 0 0 16px; }
  .gate input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; font-size: 15px; margin-bottom: 10px; color: var(--text); font-family: var(--font); outline: none; }
  .gate input:focus { border-color: var(--accent); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.42); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
  .modal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; max-width: 330px; width: 100%; }
  .modal-box p { font-size: 15.5px; line-height: 1.4; margin: 0 0 16px; }

  @media (prefers-reduced-motion: reduce) { .swipe-card.card-enter { animation: none; } }
</style>
<style id="theme-mh" media="not all">
  :root {
    color-scheme: dark;
    --leather: #3A291D;
    --leather-2: #4D3727;
    --bronze: #8B5E2B;
    --gold: #C99A3B;
    --gold-hi: #F2CB69;
    --parch: #E8D6AA;
    --ink: #3B2814;
    --ink-dim: #7B5F3A;
    --cream: #F3E6C4;
    --cream-dim: #C2A87E;
    --wax: #9B2A22;
    --font-display: 'Metamorphous', 'Palatino Linotype', Georgia, serif;
    --font-body: 'Alegreya', Georgia, serif;
    --font-caps: 'Alegreya SC', 'Alegreya', Georgia, serif;
    --wood-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='w' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.006 0.11' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0 0.02  0 0 0 0.9 -0.2'/></filter><rect width='100%25' height='100%25' filter='url(%23w)'/></svg>");
    --paper-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.12  0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>");
    --parchment: var(--paper-grain), linear-gradient(180deg, #EEDDB2, #D8BE89);
    --parch-shadow: inset 0 0 26px rgba(120, 80, 30, 0.38), 0 4px 0 rgba(0, 0, 0, 0.42);
    --gold-frame: linear-gradient(135deg, #F2CB69, #8B5E2B 32%, #F2CB69 52%, #6B4520 78%, #C99A3B);
    --wood-bg:
      radial-gradient(75% 40% at 50% -6%, rgba(255, 176, 70, 0.30), transparent 72%),
      radial-gradient(130% 90% at 50% 45%, transparent 38%, rgba(0, 0, 0, 0.62) 100%),
      var(--wood-grain),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.32) 0 2px, rgba(255,220,160,0.05) 2px 3px, transparent 3px 104px),
      #3A2617;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; height: 100%; background: var(--wood-bg); background-attachment: fixed; color: var(--cream);
    font-family: var(--font-body); font-size: 18px; font-weight: 500; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- En-tête ---------- */
  header.top { padding: 14px 18px 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { min-width: 0; }
  .brand-sub { font-family: var(--font-caps); font-weight: 500; font-size: 14px; letter-spacing: 0.1em; color: var(--gold); line-height: 1; margin-bottom: 5px; white-space: nowrap; }
  .brand h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(18px, 5.3vw, 24px); margin: 0; line-height: 1.1; white-space: nowrap; display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #9A6B22); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.65)); }
  .brand h1::before { content: ''; flex: none; width: 26px; height: 26px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 L28 7 V16 C28 23 22 28 16 30 C10 28 4 23 4 16 V7 Z' fill='%23C99A3B' stroke='%232A1B12' stroke-width='2'/><path d='M16 7 L22 12 L16 25 L10 12 Z' fill='%232A1B12'/><path d='M16 10 L19 13 L16 20 L13 13 Z' fill='%23F2CB69'/></svg>") center / contain no-repeat; }
  .head-right { display: flex; align-items: stretch; flex: none; }
  .theme-btn { width: 32px; background: linear-gradient(180deg, var(--leather-2), var(--leather)); border: 2px solid var(--gold); border-right: none; border-radius: 3px 0 0 3px; color: var(--gold-hi); font-size: 15px; line-height: 1; cursor: pointer; padding: 0; }
  .room-pill { font-family: var(--font-caps); font-weight: 700; font-size: 14px; letter-spacing: 0.08em; color: var(--cream-dim); display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: linear-gradient(180deg, var(--leather-2), var(--leather)); border: 2px solid var(--gold); border-radius: 0 3px 3px 0; box-shadow: 0 3px 0 rgba(0,0,0,0.45); white-space: nowrap; cursor: pointer; }
  .room-pill b { color: var(--gold-hi); font-weight: 700; letter-spacing: 0.14em; }
  .rule { display: flex; align-items: center; gap: 10px; padding: 0 18px; color: var(--gold); font-size: 9px; }
  .rule::before, .rule::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule::after { background: linear-gradient(270deg, transparent, var(--gold)); }
  .hazard { display: none; }

  .players-row { padding: 8px 18px 4px; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
  .player { display: flex; align-items: center; gap: 5px; flex: none; padding-right: 8px; }
  .player svg { width: 32px; height: 32px; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.5)); }
  .player span { font-family: var(--font-caps); font-weight: 500; font-size: 15px; letter-spacing: 0.04em; color: var(--cream-dim); max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player.off { opacity: 0.5; filter: grayscale(0.5); }
  .toggle-playing { margin-left: auto; font-family: var(--font-caps); font-weight: 500; font-size: 14px; letter-spacing: 0.06em; color: var(--cream-dim); display: flex; align-items: center; gap: 8px; flex: none; cursor: pointer; user-select: none; align-self: center; }
  .switch { width: 38px; height: 20px; border-radius: 999px; background: #241710; border: 2px solid var(--bronze); position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--cream-dim); transition: transform .15s ease; }
  .switch.on { border-color: var(--gold); background: #2F4A22; }
  .switch.on::after { transform: translateX(18px); background: var(--gold-hi); }

  main { flex: 1; padding: 0 18px 8px; display: flex; flex-direction: column; min-height: 0; }

  .info-box { background: var(--parchment); border: 2px solid var(--bronze); border-radius: 3px; padding: 14px 16px; font-size: 19px; color: var(--ink); line-height: 1.25; box-shadow: var(--parch-shadow); }
  .info-box strong { font-family: var(--font-display); font-weight: 400; font-size: 15px; letter-spacing: 0.03em; color: var(--wax); }
  .info-box em { font-style: normal; font-weight: 700; color: var(--wax); }
  .hint { font-size: 17px; color: var(--ink-dim); line-height: 1.25; font-style: italic; }
  .hint b { color: var(--wax); font-style: normal; font-weight: 700; }

  /* ---------- Paquet de cartes ---------- */
  .deck-progress { width: 100%; max-width: 320px; align-self: center; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-family: var(--font-caps); font-weight: 500; font-size: 15px; letter-spacing: 0.05em; color: var(--cream-dim); }
  .deck-progress .bar { flex: 1; height: 12px; border: 2px solid var(--gold); background: #1B110A; border-radius: 2px; position: relative; box-shadow: inset 0 2px 3px rgba(0,0,0,0.7); }
  .deck-progress .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #B7E27E, #5E9B3D 55%, #3F7028); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25); }
  .deck-progress span { flex: none; }

  .deck-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; position: relative; }
  .deck-stack { position: relative; width: min(100%, 320px, max(150px, calc((100vh - 425px) * 0.75))); width: min(100%, 320px, max(150px, calc((100dvh - 425px) * 0.75))); aspect-ratio: 3 / 4; }
  .swipe-card { position: absolute; inset: 0; background: #1A110A; border: 7px solid transparent; border-image: var(--gold-frame) 1;
    box-shadow: 0 8px 0 -1px rgba(0,0,0,0.5), 0 18px 34px rgba(0,0,0,0.55);
    overflow: hidden; touch-action: none; will-change: transform; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .swipe-card:active { cursor: grabbing; }
  .swipe-card::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3; box-shadow: inset 0 0 0 2px rgba(20,10,4,0.85), inset 0 0 44px rgba(30,15,5,0.5); }
  @keyframes cardPopIn { from { transform: scale(.94) translateY(18px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .swipe-card.card-enter { animation: cardPopIn .45s cubic-bezier(.22,.9,.3,1.2) backwards; }

  .orn { position: absolute; width: 11px; height: 11px; border-radius: 50%; z-index: 4; pointer-events: none; background: radial-gradient(circle at 35% 30%, #FFF1C4, #C99A3B 55%, #6B4520); box-shadow: 0 1px 2px rgba(0,0,0,0.7); }
  .orn.tl { top: 8px; left: 8px; } .orn.tr { top: 8px; right: 8px; } .orn.bl { bottom: 8px; left: 8px; } .orn.br { bottom: 8px; right: 8px; }
  .bk { display: none; }
  .hud { position: absolute; z-index: 4; pointer-events: none; }
  .hud.tl { top: 16px; left: 26px; font-family: var(--font-caps); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; color: var(--ink); background: var(--parchment); padding: 2px 16px 2px 10px; white-space: nowrap;
    clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%); box-shadow: 0 2px 0 rgba(0,0,0,0.5); }
  .hud.tl::before { content: 'Quête '; font-weight: 500; }
  .hud.tr { display: none; }

  .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cover::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(20,10,4,0.55), transparent 32%), radial-gradient(ellipse at center, transparent 58%, rgba(20,10,4,0.42)), linear-gradient(rgba(140,80,20,0.10), rgba(140,80,20,0.10)); }
  .cover-blob { position: absolute; width: 75%; padding-top: 75%; border-radius: 50%; background: rgba(255, 235, 190, 0.13); }
  .cover-emoji { font-size: 64px; text-shadow: 0 4px 0 rgba(0,0,0,0.4); filter: sepia(0.35) saturate(1.1); }
  .cover-emoji.sm { font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  .grid-cover .cover-emoji.sm { font-size: 30px; }
  .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #1A110A; pointer-events: none; -webkit-user-drag: none; user-select: none; }

  @keyframes stampPunchYes { 0% { transform: rotate(-8deg) scale(.5); opacity: 0; } 55% { transform: rotate(-8deg) scale(1.2); opacity: 1; } 100% { transform: rotate(-8deg) scale(1); opacity: 1; } }
  @keyframes stampPunchNo { 0% { transform: rotate(8deg) scale(.5); opacity: 0; } 55% { transform: rotate(8deg) scale(1.2); opacity: 1; } 100% { transform: rotate(8deg) scale(1); opacity: 1; } }
  .stamp.yes.punch { animation: stampPunchYes .45s cubic-bezier(.3,1.4,.5,1) both; }
  .stamp.no.punch { animation: stampPunchNo .45s cubic-bezier(.3,1.4,.5,1) both; }
  .swipe-card .stamp { position: absolute; top: 56px; z-index: 6; font-family: var(--font-display); font-size: 28px; letter-spacing: 0.06em; padding: 3px 14px; border: 4px double currentColor; border-radius: 3px; background: rgba(240, 226, 187, 0.93); opacity: 0; pointer-events: none; }
  .swipe-card .stamp.yes { right: 20px; color: #2F6A22; transform: rotate(-8deg); }
  .swipe-card .stamp.no { left: 20px; color: var(--wax); transform: rotate(8deg); }

  .card-caption { position: relative; width: 100%; max-width: 320px; margin-top: 14px; text-align: left; background: var(--parchment); border: 2px solid var(--bronze); border-radius: 3px; padding: 10px 14px 10px; color: var(--ink); box-shadow: var(--parch-shadow); }
  .card-caption::before { content: ''; position: absolute; top: -8px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF1C4, #C99A3B 55%, #6B4520); box-shadow: 0 2px 2px rgba(0,0,0,0.6); }
  .card-caption .name { font-family: var(--font-display); font-weight: 400; font-size: 18px; line-height: 1.15; color: var(--ink); margin-top: 2px; }
  .card-caption .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; min-width: 0; }
  .card-caption .tag { flex: none; font-family: var(--font-caps); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; color: var(--parch); background: var(--bronze); padding: 1px 8px; border-radius: 2px; }
  .card-caption .added-by { font-style: italic; font-size: 16.5px; color: var(--ink-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .deck-actions { display: flex; gap: 28px; align-items: center; justify-content: center; margin-top: 10px; padding-bottom: 6px; }
  .round-btn { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--gold); background: radial-gradient(circle at 32% 26%, #D9573F, #7A1C14 70%); color: #FFE9C4; font-size: 22px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -3px 0 rgba(0,0,0,0.3), 0 5px 0 rgba(0,0,0,0.5); }
  .round-btn:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), 0 2px 0 rgba(0,0,0,0.5); }
  .round-btn.yes { width: 62px; height: 62px; font-size: 27px; background: radial-gradient(circle at 32% 26%, #8FD16A, #2F6A22 72%); color: #F4FFE9; }

  /* ---------- Boutons, titres, formulaires ---------- */
  .section-title { font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0.04em; margin: 0; color: var(--gold-hi); text-shadow: 0 2px 0 rgba(0,0,0,0.6); }
  .section-title::before { content: '◆ '; color: var(--gold); font-size: 11px; }
  .section-title.ornate { margin: 18px 0 10px; padding-bottom: 8px; border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, transparent, var(--gold), transparent) 1; }
  .btn { font-family: var(--font-caps); font-weight: 700; font-size: 15px; letter-spacing: 0.07em; padding: 11px 12px; border: 2px solid var(--gold); border-radius: 3px; background: linear-gradient(180deg, var(--leather-2), var(--leather)); color: var(--cream); cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 0 rgba(0,0,0,0.5); line-height: 1.1; }
  .btn:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 1px 0 rgba(0,0,0,0.5); }
  .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
  .btn-primary { background: linear-gradient(180deg, #F2CB69, #C99A3B 60%, #A97A25); color: #2B1A08; border-color: #7A5217; text-shadow: 0 1px 0 rgba(255,240,200,0.5); }
  .btn-row { display: flex; gap: 12px; }
  .btn-row .btn { flex: 1; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .link-btn { background: none; border: none; padding: 8px 0 2px; font-family: var(--font-body); font-style: italic; font-size: 17px; color: var(--cream-dim); text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; cursor: pointer; text-align: left; }

  .view-toggle { display: flex; gap: 6px; flex: none; }
  .view-toggle button { background: linear-gradient(180deg, var(--leather-2), var(--leather)); border: 2px solid var(--bronze); color: var(--cream-dim); border-radius: 3px; padding: 2px 9px; font-size: 16px; line-height: 1.25; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.5); }
  .view-toggle button.active { background: linear-gradient(180deg, #F2CB69, #C99A3B); color: #2B1A08; border-color: #7A5217; }
  .icon-btn { background: none; border: none; color: var(--cream-dim); cursor: pointer; padding: 4px; display: flex; align-items: center; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.danger { color: #E0684F; }

  .inline-form { background: var(--parchment); border: 2px solid var(--bronze); border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 12px; color: var(--ink); box-shadow: var(--parch-shadow); }
  .inline-form input[type=text], .inline-form textarea { background: rgba(255, 248, 225, 0.72); border: 2px solid var(--bronze); border-radius: 2px; padding: 9px 11px; color: var(--ink); font-family: var(--font-body); font-size: 18px; font-weight: 500; outline: none; width: 100%; box-shadow: inset 0 2px 4px rgba(90,60,20,0.3); caret-color: var(--wax); }
  .inline-form textarea { min-height: 110px; resize: vertical; }
  .inline-form input::placeholder, .inline-form textarea::placeholder { color: #9A8058; font-style: italic; }
  .inline-form input:focus, .inline-form textarea:focus { border-color: var(--wax); }

  .import-preview { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
  .import-row { display: flex; align-items: center; gap: 10px; background: rgba(255, 248, 225, 0.55); border: 1px solid rgba(139, 94, 43, 0.5); padding: 6px 10px; font-size: 17px; color: var(--ink); }
  .import-row input[type=checkbox] { accent-color: var(--wax); width: 16px; height: 16px; flex: none; }
  .import-row .ir-name { flex: 1; line-height: 1.15; min-width: 0; }
  .import-row .ir-meta { font-family: var(--font-caps); font-weight: 700; font-size: 13px; letter-spacing: 0.05em; color: var(--wax); flex: none; }
  .import-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Bibliothèque ---------- */
  .game-list { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .game-row { background: linear-gradient(180deg, rgba(77, 55, 39, 0.96), rgba(52, 36, 25, 0.96)); border: 1px solid rgba(201, 154, 59, 0.55); border-radius: 3px; padding: 7px 10px; display: flex; align-items: center; gap: 12px; box-shadow: 0 3px 0 rgba(0,0,0,0.42); }
  .g-cover { width: 42px; height: 42px; flex: none; position: relative; overflow: hidden; border: 2px solid var(--gold); border-radius: 2px; display: flex; align-items: center; justify-content: center; }
  .g-main { flex: 1; min-width: 0; }
  .g-name { font-weight: 700; font-size: 17px; line-height: 1.1; color: var(--cream); }
  .g-by { font-style: italic; font-size: 15px; line-height: 1.1; color: var(--cream-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-tag { font-family: var(--font-caps); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; color: var(--parch); background: var(--bronze); padding: 1px 7px; border-radius: 2px; flex: none; }

  .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; margin-top: 12px; }
  .grid-item { display: flex; flex-direction: column; gap: 5px; }
  .grid-cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border: 4px solid transparent; border-image: var(--gold-frame) 1; box-shadow: 0 5px 0 rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; background: #1A110A; }
  .grid-del { position: absolute; top: 3px; right: 3px; z-index: 6; width: 22px; height: 22px; border-radius: 50%; background: rgba(26, 17, 10, 0.85); color: var(--cream); border: 1px solid var(--gold); font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .grid-name { font-weight: 700; font-size: 15px; line-height: 1.08; text-align: center; color: var(--cream); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }
  .grid-by { font-style: italic; font-size: 14px; color: var(--cream-dim); text-align: center; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Matchs ---------- */
  .match-list { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .match-row { background: var(--parchment); border: 2px solid var(--bronze); border-radius: 3px; color: var(--ink); padding: 10px 12px; display: flex; gap: 12px; align-items: center; box-shadow: var(--parch-shadow); }
  .match-row.full { border-color: var(--gold); box-shadow: inset 0 0 26px rgba(120, 80, 30, 0.38), 0 0 0 2px #000, 0 0 18px rgba(242, 203, 105, 0.4); }
  .match-row .m-body { flex: 1; min-width: 0; }
  .match-row .m-name { font-family: var(--font-display); font-size: 16px; line-height: 1.15; color: var(--ink); }
  .match-row .m-score { font-style: italic; font-size: 16.5px; color: var(--ink-dim); margin-top: 3px; line-height: 1.1; }
  .match-row .m-badge { flex: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(-8deg);
    font-family: var(--font-caps); font-weight: 700; font-size: 11px; letter-spacing: 0.04em; color: #FFE3A6;
    background: radial-gradient(circle at 35% 30%, #D9573F, #7A1C14 72%); box-shadow: 0 3px 0 rgba(0,0,0,0.4), inset 0 0 0 3px rgba(255,255,255,0.08); }

  /* ---------- Navigation ---------- */
  nav.tabbar { position: sticky; bottom: 0; display: flex; gap: 6px; padding: 10px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, #1E130B 84%, transparent); border-top: 2px solid var(--gold); }
  nav.tabbar .tab { flex: 1; text-align: center; padding: 4px 4px 4px; color: var(--cream-dim); cursor: pointer; background: linear-gradient(180deg, var(--leather-2), var(--leather)); border: 2px solid var(--bronze); border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 3px 0 rgba(0,0,0,0.5); }
  nav.tabbar .tab.active { background: linear-gradient(180deg, #F2CB69, #C99A3B 65%, #A97A25); color: #2B1A08; border-color: #7A5217; }
  nav.tabbar .tab .ic { font-size: 16px; display: block; line-height: 1.1; }
  nav.tabbar .tab[data-tab=deck] .ic::before { content: '\2694\FE0E'; }
  nav.tabbar .tab[data-tab=library] .ic::before { content: '\2756'; }
  nav.tabbar .tab[data-tab=matches] .ic::before { content: '\272A'; }
  nav.tabbar .tab .lb { font-family: var(--font-caps); font-weight: 700; font-size: 13.5px; letter-spacing: 0.07em; display: block; margin-top: 1px; }

  /* Bannière façon « quête accomplie » */
  .toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) translateY(-10px); width: 100%; max-width: 520px;
    background: linear-gradient(90deg, transparent, rgba(24,14,8,0.95) 12%, rgba(24,14,8,0.95) 88%, transparent); border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold);
    color: var(--gold-hi); padding: 9px 34px; font-family: var(--font-display); font-size: 15.5px; line-height: 1.25; text-align: center; opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 50; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--wood-bg); }
  .gate .box { max-width: 340px; width: 100%; text-align: center; background: var(--parchment); border: 3px solid var(--bronze); border-radius: 3px; padding: 26px 22px 24px; box-shadow: var(--parch-shadow), 0 0 0 3px rgba(0,0,0,0.5); color: var(--ink); }
  .gate .brand-sub { color: var(--wax); margin-bottom: 8px; }
  .gate h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 8px; color: var(--ink); }
  .gate p { color: var(--ink-dim); font-style: italic; font-size: 18px; line-height: 1.25; margin: 0 0 16px; }

// Noms : comparaison tolérante (casse, accents, ™ ®, ponctuation)

function normName(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[™®©]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function ownersOf(g) {
  const out = [];
  [g.addedBy].concat(Array.isArray(g.addedByList) ? g.addedByList : []).forEach(n => {
    if (n && !out.some(o => normName(o) === normName(n))) out.push(n);
  });
  return out;
}
function findExisting(name, appid) {
  const n = normName(name);
  return State.games.find(g =>
    (appid && g.appid && String(g.appid) === String(appid)) || normName(g.name) === n
  );
}

const HASH_FAMILIES = [
  { emoji: '🎮', c1: '#5B8DEF', c2: '#16264F' },
  { emoji: '🎲', c1: '#E5484D', c2: '#4A1215' },

];
function hashNum(str) { let h=0; for (let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function coverFamilyFor(game) {
  const tag = (game.tag || '').toLowerCase();
  const found = COVER_FAMILIES.find(f => f.match.test(tag));
  if (found) return found;
  return HASH_FAMILIES[hashNum(game.name || 'x') % HASH_FAMILIES.length];
}
function coverHtml(game, opts) {
  opts = opts || {};
  const fam = coverFamilyFor(game);
  const seed = hashNum(game.name || 'x');
  const p1 = 15 + (seed % 55), p2 = 15 + ((seed >> 5) % 55);
  const base = '<div class="cover" style="background:linear-gradient(155deg,'+fam.c1+','+fam.c2+');">' +
    '<div class="cover-blob" style="left:'+p1+'%; top:-25%;"></div>' +
    '<div class="cover-blob" style="right:'+p2+'%; bottom:-30%;"></div>' +
    '<span class="cover-emoji'+(opts.small ? ' sm' : '')+'">'+fam.emoji+'</span>';
  if (game.coverUrl) {
    // Image par-dessus le visuel de secours ; si elle ne charge pas, on essaie
    // l'image de repli, puis on la retire pour laisser voir le dégradé + l'icône.
    const fallback = game.coverFallback || '';
    return base +
      '<img class="cover-img" src="'+escapeHtml(game.coverUrl)+'" alt="" loading="lazy" draggable="false" ' +
      'data-fallback="'+escapeHtml(fallback)+'" ' +
      'onerror="if(this.dataset.fallback && this.src!==this.dataset.fallback){this.src=this.dataset.fallback;}else{this.remove();}">' +
      '</div>';
  }
  return base + '</div>';
}
async function fetchSteamCover(name) {
  try {
    const r = await fetch('/api/steam-cover?name=' + encodeURIComponent(name));
    if (!r.ok) return null;
    const data = await r.json();
    if (data && data.found) return { image: data.image, fallbackImage: data.fallbackImage, appid: data.appid };
    return null;
  } catch (e) { return null; }
}
async function fetchSteamLibrary(profile) {
  let data = null, ok = false;
  try {
    const r = await fetch('/api/steam-library?profile=' + encodeURIComponent(profile));
    ok = r.ok;
    data = await r.json();
  } catch (e) { throw { code: 'network' }; }
  if (!ok || !data || data.error) throw { code: (data && data.error) || 'network' };
  return data;
}
function steamErrorMessage(code) {

    case 'private': return 'Steam ne renvoie aucun jeu : ton profil (ou « Détails du jeu ») est probablement en privé. Passe-le en Public, puis réessaie.';

    default: return 'Impossible de joindre Steam pour le moment. Réessaie dans un instant.';
  }
}
async function runPool(tasks, n) {
  let i = 0;
  const workers = Array.from({ length: Math.min(n, tasks.length) }, async () => {
    while (i < tasks.length) { const t = tasks[i++]; try { await t(); } catch (e) {} }
  });
  await Promise.all(workers);
}

const State = { games: [], swipes: [], players: [] };

// Ajout de jeux (manuel, collé ou Steam) avec fusion des doublons :
// si le jeu existe déjà, on ajoute simplement la personne à ceux qui le présentent.
async function importGames(items) {
  const FV = firebase.firestore.FieldValue;
  const seen = new Set();
  const pendingCovers = [];
  let added = 0, merged = 0, already = 0;
  let batch = db.batch(), ops = 0;
  const flush = async () => { if (ops) { await batch.commit(); batch = db.batch(); ops = 0; } };

  for (const it of items) {
    const key = normName(it.name);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    const existing = findExisting(it.name, it.appid);
    if (existing) {
      if (ownersOf(existing).some(o => normName(o) === normName(myName))) { already++; continue; }
      const upd = { addedByList: FV.arrayUnion(myName) };
      if (!existing.coverUrl && it.image) { upd.coverUrl = it.image; upd.coverFallback = it.fallbackImage || null; }
      if (!existing.appid && it.appid) upd.appid = it.appid;
      batch.update(gamesCol().doc(existing.id), upd);
      merged++;
    } else {
      const ref = gamesCol().doc();
      batch.set(ref, {
        name: it.name.trim(), tag: (it.tag || 'Autre').trim() || 'Autre',
        addedBy: myName, addedByList: [myName],
        ts: Date.now() + added,
        coverUrl: it.image || null, coverFallback: it.fallbackImage || null, appid: it.appid || null,
      });
      if (!it.image) pendingCovers.push({ ref, name: it.name });
      added++;
    }
    ops++;
    if (ops >= 400) await flush();
  }
  await flush();

  // Jeux sans jaquette (ajout manuel / liste collée) : on la cherche en arrière-plan.
  if (pendingCovers.length) {
    runPool(pendingCovers.map(p => async () => {
      const found = await fetchSteamCover(p.name);
      if (found) await p.ref.update({ coverUrl: found.image, coverFallback: found.fallbackImage, appid: found.appid || null });
    }), 4);
  }
  return { added, merged, already };
}
function summarizeImport(r) {
  const parts = [];
  if (r.added) parts.push(r.added + ' nouveau' + (r.added > 1 ? 'x' : ''));
  if (r.merged) parts.push(r.merged + ' déjà présent' + (r.merged > 1 ? 's' : '') + ' (tu es ajouté·e comme co-présentateur·rice)');
  if (r.already) parts.push(r.already + ' déjà à ton nom');
  return parts.length ? 'Import terminé : ' + parts.join(', ') + '.' : 'Rien à ajouter.';
}

async function addGame(name, tag) {
  if (!name.trim()) return;
  const r = await importGames([{ name, tag }]);
  if (r.added) toast('« ' + name.trim() + ' » ajouté.');
  else if (r.merged) toast('« ' + name.trim() + ' » existait déjà : tu apparais maintenant parmi ceux qui le présentent.');
  else toast('« ' + name.trim() + ' » est déjà à ton nom.');
}

function activePlayers() { return State.players.filter(p => p.playing !== false); }
function myUnswiped() {
  const mine = new Set(State.swipes.filter(s => s.playerId === myId).map(s => s.gameId));
  return State.games.filter(g => !mine.has(g.id) && !locallySwiped.has(g.id));
}
function matchStats() {
  const denom = Math.max(activePlayers().length, 1);
  return State.games.map(g => {
    const likers = State.swipes.filter(s => s.gameId === g.id && s.liked);
    return { game: g, likers, count: likers.length, denom, full: likers.length >= denom && denom >= 2 };
  }).filter(m => m.count > 0).sort((a,b) => (b.count/b.denom) - (a.count/a.denom) || b.count - a.count);
}

const MONTHS = 'janv|f[ée]vr|mars|avr|mai|juin|juil|ao[uû]t|sept|oct|nov|d[ée]c|jan|feb|mar|apr|jun|jul|aug|sep|nov|dec';

  /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/,

const STEAM_UI_EXACT = new Set(['jeux','nom','evaluation','evaluations','categorie','categories','recherche','filtrer','trier par','played','mes stats de jeu','mon contenu de jeu','succes','temps de jeu','temps de jeu total','dernier lancement']);
const STEAM_UI_SUBSTRINGS = ['trouver un jeu','jeux suivis','tous les jeux','termines a 100','lances recemment','recemment lances','jeux termines','followed games','recently played','all games','find a game','temps de jeu','mes stats de jeu','mon contenu de jeu','dernier lancement'];
function normalizeForMatch(str) { return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[()\[\]]/g,' ').replace(/\d+/g,' ').replace(/[▲▼△▽:▶►]/g,' ').replace(/\s+/g,' ').trim(); }
function isSteamUiNoise(t) { const n = normalizeForMatch(t); if (!n) return true; if (STEAM_UI_EXACT.has(n)) return true; return STEAM_UI_SUBSTRINGS.some(s => n.includes(s)); }
function cleanupPastedList(raw) {
  const seen = new Set(); const out = []; let skippedHeader = false;
  raw.split('\n').forEach(line => {
    let t = line.replace(/\s+/g, ' ').trim();
    if (!t) return;
    if (!skippedHeader) { skippedHeader = true; return; }
    if (t.length < 2 || t.length > 60) return;
    if (isSteamUiNoise(t)) return;
    if (JUNK_PATTERNS.some(rx => rx.test(t))) return;
    const key = t.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key); out.push(t);
  });
  return out;
}

function renderDeck(main) {

  const wrap = document.createElement('div'); wrap.className = 'deck-wrap';
  const stack = document.createElement('div'); stack.className = 'deck-stack';
  wrap.appendChild(stack);

  const visible = cards.slice(0, 3);
  // Construit de la plus lointaine à la plus proche : la dernière carte ajoutée
  // (celle du dessus) est visible[0], le même jeu que le titre et les boutons.
  for (let depth = visible.length - 1; depth >= 0; depth--) {

      '<div class="stamp yes">OUI</div><div class="stamp no">NON</div>';
    if (depth === 0) {
      attachSwipeGestures(card, g.id);
      card.addEventListener('animationend', () => card.classList.remove('card-enter'), { once: true });

  const top = cards[0];

function animateDecision(topCard, gameId, liked) {
  if (!topCard) { swipeGame(gameId, liked); return; }
  deckAnimating = true;
  topCard.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1), opacity .55s ease';
  topCard.style.transform = 'translateX(' + (liked ? '150%' : '-150%') + ') translateY(-10px) rotate(' + (liked ? 22 : -22) + 'deg) scale(0.94)';
  topCard.style.opacity = '0';
  const stampEl = topCard.querySelector(liked ? '.stamp.yes' : '.stamp.no');
  if (stampEl) { stampEl.style.opacity = '1'; stampEl.classList.add('punch'); }
  swipeGame(gameId, liked);
  setTimeout(() => { deckAnimating = false; if (currentTab === 'deck') renderMain(); }, 560);
}

function attachSwipeGestures(card, gameId) {
  let startX=0, startY=0, dx=0, dragging=false;
  const stampYes = card.querySelector('.stamp.yes'), stampNo = card.querySelector('.stamp.no');
  function onDown(e) {
    dragging = true; startX = e.clientX; startY = e.clientY; dx = 0; card.style.transition = 'none';
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!dragging) return;
    dx = e.clientX - startX; const dy = e.clientY - startY; const rot = dx/18;
    card.style.transform = 'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)';
    const t = Math.min(Math.abs(dx)/90, 1);
    if (dx > 0) { stampYes.style.opacity=t; stampNo.style.opacity=0; } else { stampNo.style.opacity=t; stampYes.style.opacity=0; }
    e.preventDefault && e.cancelable && e.preventDefault();
  }
  function onUp() {
    if (!dragging) return; dragging = false;
    if (Math.abs(dx) > 90) {
      const liked = dx > 0; deckAnimating = true;
      card.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1), opacity .55s ease';
      card.style.transform = 'translateX('+(liked?'150%':'-150%')+') translateY(-10px) rotate('+(liked?22:-22)+'deg) scale(0.94)';
      card.style.opacity = '0';
      const stampEl = liked ? stampYes : stampNo; stampEl.style.opacity='1'; stampEl.classList.add('punch');
      swipeGame(gameId, liked);
      setTimeout(() => { deckAnimating = false; if (currentTab === 'deck') renderMain(); }, 560);
    } else {
      card.style.transition = 'transform .32s cubic-bezier(.34,1.56,.64,1)';
      card.style.transform = 'translate(0,0) rotate(0)';
      stampYes.style.opacity=0; stampNo.style.opacity=0;
    }
    dx = 0;
  }
  card.addEventListener('pointerdown', onDown);
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerup', onUp);
  card.addEventListener('pointercancel', onUp);
  card.addEventListener('dragstart', e => e.preventDefault());
}

function showImportPreview(zone, raw) {
  const candidates = cleanupPastedList(raw);
  zone.innerHTML = '';
  if (!candidates.length) { zone.appendChild(infoBox('Rien trouvé', 'Essaie de coller un bloc plus large de la page Steam.')); return; }
  const box = document.createElement('div'); box.className = 'inline-form';
  const preview = document.createElement('div'); preview.className = 'import-preview';
  candidates.forEach((name, i) => {
    const row = document.createElement('label'); row.className = 'import-row';
    row.innerHTML = '<input type="checkbox" checked data-i="'+i+'"><span class="ir-name">'+escapeHtml(name)+'</span>';
    preview.appendChild(row);
  });
  box.appendChild(preview);
  const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary'; confirmBtn.textContent = 'Ajouter la sélection ('+candidates.length+')';
  confirmBtn.onclick = async () => {
    const checked = Array.from(preview.querySelectorAll('input:checked')).map(cb => ({ name: candidates[+cb.dataset.i], tag: 'Steam' }));
    if (!checked.length) { toast('Coche au moins un jeu.'); return; }
    confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…';
    const r = await importGames(checked);
    toast(summarizeImport(r)); zone.innerHTML = '';
  };
  box.appendChild(confirmBtn);
  zone.appendChild(box);
}

function renderMatches(main) {
  main.innerHTML = '';
  const title = document.createElement('div'); title.className = 'section-title ornate'; title.textContent = 'Matchs de ce soir';
  main.appendChild(title);
  const stats = matchStats();
  if (!stats.length) { main.appendChild(infoBox('Pas encore de match', 'Dès que plusieurs d\'entre vous auront aimé le même jeu, il apparaîtra ici.')); return; }
  const list = document.createElement('div'); list.className = 'match-list';
  stats.forEach(m => {
    const row = document.createElement('div'); row.className = 'match-row' + (m.full ? ' full' : '');
    const names = m.likers.map(l => l.playerName).filter(Boolean).join(', ');
    row.innerHTML = '<div class="g-cover" style="width:44px;height:44px;">'+coverHtml(m.game,{small:true})+'</div>' +
      '<div class="m-body"><div class="m-name">'+escapeHtml(m.game.name)+'</div><div class="m-score">'+m.count+' sur '+m.denom+' — '+escapeHtml(names)+'</div></div>' +
      (m.full ? '<span class="m-badge">MATCH</span>' : '');
    list.appendChild(row);
  });
  main.appendChild(list);
}

document.querySelectorAll('nav.tabbar .tab').forEach(tab => {
  tab.addEventListener('click', () => { currentTab = tab.dataset.tab; renderAll(); });
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const keys = Object.keys(THEMES);
  applyTheme(keys[(keys.indexOf(theme) + 1) % keys.length], true);
  renderHeader(); renderMain(true);
});
document.getElementById('roomPill').addEventListener('click', () => {
  if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(() => toast('Code copié : ' + roomCode));
});

// ---------------------------------------------------------------
// Porte d'entrée : rejoindre ou créer une salle
// ---------------------------------------------------------------
function showGate() {
  const gate = document.createElement('div'); gate.className = 'gate'; gate.id = 'gate';
  gate.innerHTML =
    '<div class="box">' +
    '<div class="brand-sub">' + THEMES[theme].sub + '</div>' +
    '<h2>' + THEMES[theme].gate + '</h2>' +
    '<p>Entre le code de salle de tes amis pour les rejoindre, ou laisse vide pour ouvrir une nouvelle salle.</p>' +
    '<input type="text" id="gateCode" placeholder="Code de salle (ex : AB12C)" maxlength="8" style="text-transform:uppercase;" autocapitalize="characters">' +
    '<input type="text" id="gateName" placeholder="Ton prénom">' +
    '<button class="btn btn-primary" id="gateGo" style="width:100%;">Entrer</button>' +
    '</div>';
  document.body.appendChild(gate);
  document.getElementById('gateGo').onclick = () => {
    const name = document.getElementById('gateName').value.trim();
    let code = document.getElementById('gateCode').value.trim();
    if (!name) { toast('Donne ton prénom.'); return; }
    if (!code) code = randomRoomCode();
    joinRoom(code, name);
  };
}

applyTheme(theme);
if (roomCode && myName) {
  startListening();
  playersCol().doc(myId).set({ name: myName, color: colorFor(myId), playing: true, ts: Date.now() }, { merge: true });
} else {
  showGate();
}
</script>
</body>
