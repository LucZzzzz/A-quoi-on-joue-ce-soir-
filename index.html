<style>
  :root {

  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }

  body {

  }
  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- En-tête ---------- */
  header.top { padding: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-sub { font-family: var(--font-display); font-size: 9.5px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }

  .cover::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(8, 6, 10, 0.5), transparent 38%), radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.35)); }
  .cover-blob { position: absolute; width: 75%; padding-top: 75%; border-radius: 50%; background: rgba(230, 203, 134, 0.10); }
  .cover-emoji { font-size: 62px; opacity: 0.92;
    filter: grayscale(1) sepia(0.9) saturate(2.4) brightness(1.2) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6)); }
  .cover-emoji.sm { font-size: 18px; filter: grayscale(1) sepia(0.9) saturate(2.4) brightness(1.2); }
  .grid-cover .cover-emoji.sm { font-size: 30px; }
  .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0C0A0E; pointer-events: none; -webkit-user-drag: none; user-select: none; }

  @keyframes stampPunchYes { 0% { transform: rotate(8deg) scale(.6); opacity: 0; } 55% { transform: rotate(8deg) scale(1.16); opacity: 1; } 100% { transform: rotate(8deg) scale(1); opacity: 1; } }
  @keyframes stampPunchNo { 0% { transform: rotate(-8deg) scale(.6); opacity: 0; } 55% { transform: rotate(-8deg) scale(1.16); opacity: 1; } 100% { transform: rotate(-8deg) scale(1); opacity: 1; } }
  .stamp.yes.punch { animation: stampPunchYes .45s cubic-bezier(.34, 1.4, .64, 1) both; }
  .stamp.no.punch { animation: stampPunchNo .45s cubic-bezier(.34, 1.4, .64, 1) both; }
  .swipe-card .stamp {
    position: absolute; top: 28px; z-index: 5; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: 0.22em;
    padding: 7px 14px 7px 18px; border: 3px double currentColor; background: rgba(10, 8, 12, 0.6); opacity: 0; pointer-events: none;
  }
  .swipe-card .stamp.yes { right: 26px; color: var(--gold-hi); transform: rotate(8deg); }
  .swipe-card .stamp.no { left: 26px; color: var(--crimson-hi); transform: rotate(-8deg); }

  .card-caption { text-align: center; padding: 20px 6px 0; max-width: 340px; }

  .card-caption .name { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: 0.06em; line-height: 1.25; color: var(--text); }
  .card-caption .added-by { font-style: italic; font-size: 16px; color: var(--text-dim); margin-top: 6px; }

  .deck-actions { display: flex; gap: 26px; align-items: center; justify-content: center; margin-top: 24px; }
  .round-btn {
    width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--gold);
    background: radial-gradient(circle at 30% 25%, #2A2230, #100D13); color: var(--crimson-hi);
    display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;
    box-shadow: 0 0 0 4px rgba(201, 166, 91, 0.08), 0 12px 26px rgba(0, 0, 0, 0.6); transition: transform .12s ease;
  }
  .round-btn:active { transform: scale(0.92); }
  .round-btn.yes { width: 74px; height: 74px; font-size: 28px; color: #1A1208; border-color: #F0D999; background: radial-gradient(circle at 30% 25%, #F0D999, #B48F45); }
  .deck-progress { text-align: center; font-family: var(--font-display); font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }

  /* ---------- Boutons, titres, formulaires ---------- */
  .section-title { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; margin: 0; color: var(--gold-hi); }
  .section-title.ornate { display: flex; align-items: center; gap: 12px; margin: 20px 0 10px; }
  .section-title.ornate::before, .section-title.ornate::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
  .section-title.ornate::after { background: linear-gradient(270deg, transparent, var(--gold-dim)); }
  .btn { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; padding: 13px 14px; border-radius: 2px; border: 1px solid var(--gold); background: transparent; color: var(--gold-hi); cursor: pointer; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: linear-gradient(180deg, #DDBC70, #B08C44); color: #1A1208; border-color: #EBD08D; box-shadow: 0 0 0 3px rgba(201, 166, 91, 0.10); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: rgba(23, 19, 27, 0.8); }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .btn-sm { padding: 8px 10px; font-size: 9.5px; }
  .link-btn { background: none; border: none; padding: 6px 0; font-family: var(--font-body); font-style: italic; font-size: 15.5px; color: var(--text-dim); text-decoration: underline; text-decoration-color: var(--gold-dim); cursor: pointer; text-align: left; }

  .view-toggle { display: flex; gap: 6px; flex: none; }
  .view-toggle button { background: transparent; border: 1px solid var(--gold-dim); color: var(--text-dim); border-radius: 2px; padding: 5px 9px; font-size: 14px; line-height: 1; cursor: pointer; }
  .view-toggle button.active { background: var(--gold); color: #1A1208; border-color: var(--gold); }
  .icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; display: flex; align-items: center; flex: none; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.danger { color: var(--crimson-hi); }

  .inline-form { background: rgba(23, 19, 27, 0.85); border: 1px solid var(--border); border-radius: 2px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .inline-form input[type=text], .inline-form textarea {
    background: var(--bg); border: 1px solid var(--gold-dim); border-radius: 2px; padding: 11px 12px; color: var(--text);
    font-family: var(--font-body); font-size: 17px; font-weight: 500; outline: none; width: 100%;
  }
  .inline-form textarea { min-height: 110px; resize: vertical; }
  .inline-form input::placeholder, .inline-form textarea::placeholder { color: rgba(167, 157, 139, 0.6); font-style: italic; }
  .inline-form input:focus, .inline-form textarea:focus { border-color: var(--gold-hi); }

  .import-preview { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
  .import-row { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--gold-faint); padding: 8px 10px; font-size: 16px; }
  .import-row input[type=checkbox] { accent-color: var(--gold); width: 16px; height: 16px; flex: none; }
  .import-row .ir-name { flex: 1; line-height: 1.2; }
  .import-row .ir-meta { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.1em; color: var(--text-dim); flex: none; }
  .import-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Bibliothèque ---------- */
  .game-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .game-row { background: rgba(23, 19, 27, 0.7); border: 1px solid var(--gold-faint); padding: 8px 10px; display: flex; align-items: center; gap: 12px; }
  .g-cover { width: 40px; height: 40px; flex: none; position: relative; overflow: hidden; border: 1px solid var(--gold-dim); display: flex; align-items: center; justify-content: center; }
  .g-main { flex: 1; min-width: 0; }
  .g-name { font-weight: 600; font-size: 17px; line-height: 1.15; }
  .g-by { font-style: italic; font-size: 14.5px; color: var(--text-dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-tag { font-family: var(--font-display); font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold-faint); padding: 3px 7px; flex: none; }

  .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; margin-top: 12px; }
  .grid-item { display: flex; flex-direction: column; gap: 6px; }
  .grid-cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border: 1px solid var(--gold-dim); outline: 1px solid var(--gold-faint); outline-offset: 2px; display: flex; align-items: center; justify-content: center; }
  .grid-del { position: absolute; top: 5px; right: 5px; z-index: 6; width: 22px; height: 22px; border-radius: 50%; background: rgba(10, 8, 12, 0.72); color: var(--text); border: 1px solid var(--gold-dim); font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .grid-by { font-style: italic; font-size: 13px; color: var(--text-dim); text-align: center; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Matchs ---------- */
  .match-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .match-row { background: rgba(23, 19, 27, 0.75); border: 1px solid var(--gold-faint); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  .match-row.full { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 166, 91, 0.08), 0 10px 28px rgba(0, 0, 0, 0.45); background: linear-gradient(135deg, rgba(201, 166, 91, 0.10), rgba(23, 19, 27, 0.85)); }
  .match-row .m-body { flex: 1; min-width: 0; }
  .match-row .m-name { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.05em; line-height: 1.25; }
  .match-row .m-score { font-size: 15.5px; color: var(--text-dim); margin-top: 3px; font-style: italic; }
  .match-row .m-badge { font-family: var(--font-display); font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em; color: #1A1208; background: linear-gradient(180deg, #E6CB86, #B48F45); padding: 5px 8px; flex: none; }

  /* ---------- Navigation ---------- */
  nav.tabbar { position: sticky; bottom: 0; display: flex; padding: 0 12px calc(6px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 72%, transparent); border-top: 1px solid var(--border); }
  nav.tabbar .tab { flex: 1; text-align: center; padding: 12px 6px 6px; color: var(--text-dim); cursor: pointer; position: relative; }
  nav.tabbar .tab.active { color: var(--gold-hi); }
  nav.tabbar .tab.active::before { content: ''; position: absolute; top: -1px; left: 24%; right: 24%; height: 2px; background: var(--gold); }
  nav.tabbar .tab .ic { font-size: 17px; display: block; line-height: 1.2; }
  nav.tabbar .tab .lb { font-family: var(--font-display); font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 3px; display: block; }

  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) translateY(-10px); background: var(--bg-elevated); border: 1px solid var(--gold); color: var(--text); padding: 10px 18px; font-size: 16px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 50; max-width: 88%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(120% 55% at 50% -12%, rgba(168, 50, 43, 0.34), transparent 62%), radial-gradient(110% 50% at 50% 112%, rgba(58, 82, 122, 0.30), transparent 62%), var(--bg); }
  .gate .box { max-width: 340px; width: 100%; text-align: center; border: 1px solid var(--gold-dim); outline: 1px solid var(--gold-faint); outline-offset: 5px; padding: 30px 22px; background: rgba(13, 11, 15, 0.7); }
  .gate .brand-sub { margin-bottom: 8px; }
  .gate h2 { font-family: var(--font-title); font-weight: 700; font-size: 22px; margin: 0 0 12px; }
  .gate p { color: var(--text-dim); font-size: 16.5px; line-height: 1.4; margin: 0 0 18px; font-style: italic; }
  .gate input { width: 100%; background: var(--bg); border: 1px solid var(--gold-dim); border-radius: 2px; padding: 12px 14px; font-size: 17px; margin-bottom: 12px; color: var(--text); font-family: var(--font-body); font-weight: 500; text-align: center; outline: none; }
  .gate input:focus { border-color: var(--gold-hi); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(5, 3, 8, 0.72); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
  .modal-box { background: var(--bg-elevated); border: 1px solid var(--gold); outline: 1px solid var(--gold-faint); outline-offset: 4px; padding: 22px; max-width: 330px; width: 100%; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7); }
  .modal-box p { font-size: 17.5px; line-height: 1.4; margin: 0 0 18px; }
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="brand-sub">Ce soir · entre amis</div>
      <h1>À quoi jouer ?</h1>
    </div>
    <div class="room-pill" id="roomPill" title="Copier le code de la salle">Salle <b id="roomCodeLabel">----</b></div>
  </header>
  <div class="rule">◆</div>
  <div class="players-row" id="playersRow"></div>
  <main id="main"></main>
  <nav class="tabbar">
    <div class="tab active" data-tab="deck"><span class="ic">✦</span><span class="lb">Swiper</span></div>
    <div class="tab" data-tab="library"><span class="ic">❖</span><span class="lb">Bibliothèque</span></div>
    <div class="tab" data-tab="matches"><span class="ic">⚜&#xFE0E;</span><span class="lb">Matchs</span></div>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

// =================================================================
// ⚠️ CONFIGURATION — config de ton projet Firebase.
// =================================================================

// ---------------------------------------------------------------
// Noms : comparaison tolérante (casse, accents, ™ ®, ponctuation)
// pour reconnaître le même jeu ajouté par deux personnes.
// ---------------------------------------------------------------
function normName(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[™®©]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function ownersOf(g) {
  const out = [];
  [g.addedBy].concat(Array.isArray(g.addedByList) ? g.addedByList : []).forEach(n => {
    if (n && !out.some(o => normName(o) === normName(n))) out.push(n);
  });
  return out;
}
function findExisting(name, appid) {
  const n = normName(name);
  return State.games.find(g =>
    (appid && g.appid && String(g.appid) === String(appid)) || normName(g.name) === n
  );
}

  { match: /puzzle|r[ée]flexion/, emoji: '🧩', c1: '#5B8A86', c2: '#122624' },
];
const HASH_FAMILIES = [
  { emoji: '🎮', c1: '#3E5C86', c2: '#131C31' },
  { emoji: '🎲', c1: '#7A2E2A', c2: '#26100F' },
  { emoji: '🕹️', c1: '#6E4E86', c2: '#20132A' },
  { emoji: '🎯', c1: '#4E7A6B', c2: '#11231E' },
  { emoji: '⚔️', c1: '#9A6A3E', c2: '#2D1C0F' },
  { emoji: '🧭', c1: '#5B8A86', c2: '#122624' },
];
function hashNum(str) { let h=0; for (let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function coverFamilyFor(game) {
  const tag = (game.tag || '').toLowerCase();
  const found = COVER_FAMILIES.find(f => f.match.test(tag));
  if (found) return found;
  return HASH_FAMILIES[hashNum(game.name || 'x') % HASH_FAMILIES.length];
}
function coverHtml(game, opts) {
  opts = opts || {};
  const fam = coverFamilyFor(game);
  const seed = hashNum(game.name || 'x');
  const p1 = 15 + (seed % 55), p2 = 15 + ((seed >> 5) % 55);
  const base = '<div class="cover" style="background:linear-gradient(155deg,'+fam.c1+','+fam.c2+');">' +
    '<div class="cover-blob" style="left:'+p1+'%; top:-25%;"></div>' +
    '<div class="cover-blob" style="right:'+p2+'%; bottom:-30%;"></div>' +
    '<span class="cover-emoji'+(opts.small ? ' sm' : '')+'">'+fam.emoji+'</span>';
  if (game.coverUrl) {
    // Image par-dessus le visuel de secours ; si elle ne charge pas, on essaie
    // l'image de repli, puis on la retire pour laisser voir le dégradé + l'icône.
    const fallback = game.coverFallback || '';
    return base +
      '<img class="cover-img" src="'+escapeHtml(game.coverUrl)+'" alt="" loading="lazy" draggable="false" ' +
      'data-fallback="'+escapeHtml(fallback)+'" ' +
      'onerror="if(this.dataset.fallback && this.src!==this.dataset.fallback){this.src=this.dataset.fallback;}else{this.remove();}">' +
      '</div>';
  }
  return base + '</div>';
}
async function fetchSteamCover(name) {
  try {
    const r = await fetch('/api/steam-cover?name=' + encodeURIComponent(name));
    if (!r.ok) return null;
    const data = await r.json();
    if (data && data.found) return { image: data.image, fallbackImage: data.fallbackImage, appid: data.appid };
    return null;
  } catch (e) { return null; }
}
async function fetchSteamLibrary(profile) {
  let data = null, ok = false;
  try {
    const r = await fetch('/api/steam-library?profile=' + encodeURIComponent(profile));
    ok = r.ok;
    data = await r.json();
  } catch (e) { throw { code: 'network' }; }
  if (!ok || !data || data.error) throw { code: (data && data.error) || 'network' };
  return data;
}
function steamErrorMessage(code) {
  switch (code) {
    case 'no_key': return 'Le site n\'a pas encore de clé Steam : ajoute la variable STEAM_API_KEY sur Vercel (voir le guide), puis redéploie.';
    case 'bad_key': return 'La clé Steam configurée sur le site est refusée. Vérifie-la sur Vercel.';
    case 'private': return 'Steam ne renvoie aucun jeu : ton profil (ou « Détails du jeu ») est probablement en privé. Passe-le en Public, puis réessaie.';
    case 'not_found': return 'Profil introuvable. Vérifie le lien, le pseudo ou l\'ID.';
    default: return 'Impossible de joindre Steam pour le moment. Réessaie dans un instant.';
  }
}
async function runPool(tasks, n) {
  let i = 0;
  const workers = Array.from({ length: Math.min(n, tasks.length) }, async () => {
    while (i < tasks.length) { const t = tasks[i++]; try { await t(); } catch (e) {} }
  });
  await Promise.all(workers);
}

// Ajout de jeux (manuel, collé ou Steam) avec fusion des doublons :
// si le jeu existe déjà, on ajoute simplement la personne à ceux qui le présentent.
async function importGames(items) {
  const FV = firebase.firestore.FieldValue;
  const seen = new Set();
  const pendingCovers = [];
  let added = 0, merged = 0, already = 0;
  let batch = db.batch(), ops = 0;
  const flush = async () => { if (ops) { await batch.commit(); batch = db.batch(); ops = 0; } };

  for (const it of items) {
    const key = normName(it.name);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    const existing = findExisting(it.name, it.appid);
    if (existing) {
      if (ownersOf(existing).some(o => normName(o) === normName(myName))) { already++; continue; }
      const upd = { addedByList: FV.arrayUnion(myName) };
      if (!existing.coverUrl && it.image) { upd.coverUrl = it.image; upd.coverFallback = it.fallbackImage || null; }
      if (!existing.appid && it.appid) upd.appid = it.appid;
      batch.update(gamesCol().doc(existing.id), upd);
      merged++;
    } else {
      const ref = gamesCol().doc();
      batch.set(ref, {
        name: it.name.trim(), tag: (it.tag || 'Autre').trim() || 'Autre',
        addedBy: myName, addedByList: [myName],
        ts: Date.now() + added,
        coverUrl: it.image || null, coverFallback: it.fallbackImage || null, appid: it.appid || null,
      });
      if (!it.image) pendingCovers.push({ ref, name: it.name });
      added++;
    }
    ops++;
    if (ops >= 400) await flush();
  }
  await flush();

  // Jeux sans jaquette (ajout manuel / liste collée) : on la cherche en arrière-plan.
  if (pendingCovers.length) {
    runPool(pendingCovers.map(p => async () => {
      const found = await fetchSteamCover(p.name);
      if (found) await p.ref.update({ coverUrl: found.image, coverFallback: found.fallbackImage, appid: found.appid || null });
    }), 4);
  }
  return { added, merged, already };
}
function summarizeImport(r) {
  const parts = [];
  if (r.added) parts.push(r.added + ' nouveau' + (r.added > 1 ? 'x' : ''));
  if (r.merged) parts.push(r.merged + ' déjà présent' + (r.merged > 1 ? 's' : '') + ' (tu es ajouté·e comme co-présentateur·rice)');
  if (r.already) parts.push(r.already + ' déjà à ton nom');
  return parts.length ? 'Import terminé : ' + parts.join(', ') + '.' : 'Rien à ajouter.';
}

async function addGame(name, tag) {
  if (!name.trim()) return;
  const r = await importGames([{ name, tag }]);
  if (r.added) toast('« ' + name.trim() + ' » ajouté.');
  else if (r.merged) toast('« ' + name.trim() + ' » existait déjà : tu apparais maintenant parmi ceux qui le présentent.');
  else toast('« ' + name.trim() + ' » est déjà à ton nom.');
}

function activePlayers() { return State.players.filter(p => p.playing !== false); }
function myUnswiped() {
  const mine = new Set(State.swipes.filter(s => s.playerId === myId).map(s => s.gameId));
  return State.games.filter(g => !mine.has(g.id) && !locallySwiped.has(g.id));
}
function matchStats() {
  const denom = Math.max(activePlayers().length, 1);
  return State.games.map(g => {
    const likers = State.swipes.filter(s => s.gameId === g.id && s.liked);
    return { game: g, likers, count: likers.length, denom, full: likers.length >= denom && denom >= 2 };
  }).filter(m => m.count > 0).sort((a,b) => (b.count/b.denom) - (a.count/a.denom) || b.count - a.count);
}

const MONTHS = 'janv|f[ée]vr|mars|avr|mai|juin|juil|ao[uû]t|sept|oct|nov|d[ée]c|jan|feb|mar|apr|jun|jul|aug|sep|nov|dec';
const JUNK_PATTERNS = [
  /^\d[\d.,\s]*\s*(hrs?|heures?|h|min(ute)?s?)\s*(on record|de jeu)?$/i,
  /^(aujourd.?hui|hier|demain)$/i,
  /(jouer|play game|installer|install|acheter|buy|voir|view|d[ée]tails|details|statistiques|stats|community hub|dlc|dans la biblioth[èe]que|in library|wishlist|liste de souhaits)/i,
  /(succ[èe]s|achievements?|trophées?|trophies|d[ée]bloqu[ée]|unlocked|obtenu(e|s)?|progression|compl[ée]t[ée])/i,
  /^\d{1,4}\s*\/\s*\d{1,4}$/,
  /^\d{1,3}\s*%$/,
  /(derni[èe]re? (partie|session|fois|lancement)|last (played|launched|session)|lanc[ée] pour la derni[èe]re fois|temps de jeu|playtime|il y a\s+\d|jours?\s+ago|\bago\b)/i,
  new RegExp('\\b\\d{1,2}\\s*(' + MONTHS + ')[a-zéû.]*\\s*\\d{0,4}\\b', 'i'),
  new RegExp('\\b(' + MONTHS + ')[a-zéû.]*\\s+\\d{4}\\b', 'i'),
  /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/,
  /^\d+$/, /^[-–—•·]+$/,
];
const STEAM_UI_EXACT = new Set(['jeux','nom','evaluation','evaluations','categorie','categories','recherche','filtrer','trier par','played','mes stats de jeu','mon contenu de jeu','succes','temps de jeu','temps de jeu total','dernier lancement']);
const STEAM_UI_SUBSTRINGS = ['trouver un jeu','jeux suivis','tous les jeux','termines a 100','lances recemment','recemment lances','jeux termines','followed games','recently played','all games','find a game','temps de jeu','mes stats de jeu','mon contenu de jeu','dernier lancement'];
function normalizeForMatch(str) { return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[()\[\]]/g,' ').replace(/\d+/g,' ').replace(/[▲▼△▽:▶►]/g,' ').replace(/\s+/g,' ').trim(); }
function isSteamUiNoise(t) { const n = normalizeForMatch(t); if (!n) return true; if (STEAM_UI_EXACT.has(n)) return true; return STEAM_UI_SUBSTRINGS.some(s => n.includes(s)); }
function cleanupPastedList(raw) {
  const seen = new Set(); const out = []; let skippedHeader = false;
  raw.split('\n').forEach(line => {
    let t = line.replace(/\s+/g, ' ').trim();
    if (!t) return;
    if (!skippedHeader) { skippedHeader = true; return; }
    if (t.length < 2 || t.length > 60) return;
    if (isSteamUiNoise(t)) return;
    if (JUNK_PATTERNS.some(rx => rx.test(t))) return;
    const key = t.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key); out.push(t);
  });
  return out;
}

function presentedBy(g) { const o = ownersOf(g); return o.length ? o.join(', ') : 'quelqu\'un'; }

function renderDeck(main) {
  const cards = myUnswiped();
  // Évite de reconstruire (et de rejouer l'animation / couper un glissement en cours)
  // quand une mise à jour Firestore ne change rien aux cartes affichées.
  const sig = cards.slice(0, 3).map(g => [g.id, g.name, g.tag, g.coverUrl ? 1 : 0, presentedBy(g)].join(':')).join('|') + '#' + State.games.length + '/' + cards.length + '/' + State.swipes.length;
  if (main.dataset.view === 'deck' && main.dataset.sig === sig && main.children.length) return;
  main.dataset.sig = sig;
  main.innerHTML = '';
  if (!State.games.length) { main.appendChild(infoBox('Bibliothèque vide', 'Ajoute vos jeux dans l\'onglet <em>Bibliothèque</em> pour commencer à swiper.')); return; }
  if (!cards.length) { main.appendChild(infoBox('Tout est swipé', (myName ? myName + ', t' : 'T') + 'u as donné ton avis sur tous les jeux. Va voir l\'onglet <em>Matchs</em>, ou ajoute d\'autres jeux.')); return; }

  const progress = document.createElement('div'); progress.className = 'deck-progress';
  progress.textContent = (State.games.length - cards.length) + ' / ' + State.games.length + ' jeux vus';
  main.appendChild(progress);

  const wrap = document.createElement('div'); wrap.className = 'deck-wrap';
  const stack = document.createElement('div'); stack.className = 'deck-stack';
  wrap.appendChild(stack);

  const visible = cards.slice(0, 3);
  // Construit de la plus lointaine à la plus proche : la dernière carte ajoutée
  // (celle du dessus) est visible[0], le même jeu que le titre et les boutons.
  for (let depth = visible.length - 1; depth >= 0; depth--) {
    const g = visible[depth];
    const card = document.createElement('div');
    card.className = 'swipe-card' + (depth === 0 ? ' card-enter' : '');
    card.style.transform = 'scale(' + (1 - depth * 0.045) + ') translateY(' + (depth * 10) + 'px)';
    card.style.zIndex = String(10 - depth);
    card.innerHTML = coverHtml(g) +
      '<i class="orn tl"></i><i class="orn tr"></i><i class="orn bl"></i><i class="orn br"></i>' +
      '<div class="stamp yes">OUI</div><div class="stamp no">NON</div>';
    if (depth === 0) {
      attachSwipeGestures(card, g.id);
      card.addEventListener('animationend', () => card.classList.remove('card-enter'), { once: true });
    }
    stack.appendChild(card);
  }

  const top = cards[0];
  const caption = document.createElement('div'); caption.className = 'card-caption';
  caption.innerHTML = '<div class="tag">' + escapeHtml(top.tag || 'Jeu') + '</div><div class="name">' + escapeHtml(top.name) + '</div><div class="added-by">Présenté par : ' + escapeHtml(presentedBy(top)) + '</div>';
  wrap.appendChild(caption);

  const actions = document.createElement('div'); actions.className = 'deck-actions';
  const noBtn = document.createElement('button'); noBtn.className = 'round-btn no'; noBtn.textContent = '✕'; noBtn.setAttribute('aria-label', 'Non');
  noBtn.onclick = () => animateDecision(stack.lastElementChild, cards[0].id, false);
  const yesBtn = document.createElement('button'); yesBtn.className = 'round-btn yes'; yesBtn.textContent = '♥'; yesBtn.setAttribute('aria-label', 'Oui');
  yesBtn.onclick = () => animateDecision(stack.lastElementChild, cards[0].id, true);
  actions.appendChild(noBtn); actions.appendChild(yesBtn);
  main.appendChild(wrap); main.appendChild(actions);
}

function animateDecision(topCard, gameId, liked) {
  if (!topCard) { swipeGame(gameId, liked); return; }
  deckAnimating = true;
  topCard.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1), opacity .55s ease';
  topCard.style.transform = 'translateX(' + (liked ? '150%' : '-150%') + ') translateY(-10px) rotate(' + (liked ? 22 : -22) + 'deg) scale(0.94)';
  topCard.style.opacity = '0';
  const stampEl = topCard.querySelector(liked ? '.stamp.yes' : '.stamp.no');
  if (stampEl) { stampEl.style.opacity = '1'; stampEl.classList.add('punch'); }
  swipeGame(gameId, liked);
  setTimeout(() => { deckAnimating = false; if (currentTab === 'deck') renderMain(); }, 560);
}

function attachSwipeGestures(card, gameId) {
  let startX=0, startY=0, dx=0, dragging=false;
  const stampYes = card.querySelector('.stamp.yes'), stampNo = card.querySelector('.stamp.no');
  function onDown(e) {
    dragging = true; startX = e.clientX; startY = e.clientY; dx = 0; card.style.transition = 'none';
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!dragging) return;
    dx = e.clientX - startX; const dy = e.clientY - startY; const rot = dx/18;
    card.style.transform = 'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)';
    const t = Math.min(Math.abs(dx)/90, 1);
    if (dx > 0) { stampYes.style.opacity=t; stampNo.style.opacity=0; } else { stampNo.style.opacity=t; stampYes.style.opacity=0; }
    e.preventDefault && e.cancelable && e.preventDefault();
  }
  function onUp() {
    if (!dragging) return; dragging = false;
    if (Math.abs(dx) > 90) {
      const liked = dx > 0; deckAnimating = true;
      card.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1), opacity .55s ease';
      card.style.transform = 'translateX('+(liked?'150%':'-150%')+') translateY(-10px) rotate('+(liked?22:-22)+'deg) scale(0.94)';
      card.style.opacity = '0';
      const stampEl = liked ? stampYes : stampNo; stampEl.style.opacity='1'; stampEl.classList.add('punch');
      swipeGame(gameId, liked);
      setTimeout(() => { deckAnimating = false; if (currentTab === 'deck') renderMain(); }, 560);
    } else {
      card.style.transition = 'transform .32s cubic-bezier(.34,1.56,.64,1)';
      card.style.transform = 'translate(0,0) rotate(0)';
      stampYes.style.opacity=0; stampNo.style.opacity=0;
    }
    dx = 0;
  }
  card.addEventListener('pointerdown', onDown);
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerup', onUp);
  card.addEventListener('pointercancel', onUp);
  card.addEventListener('dragstart', e => e.preventDefault());
}

// Le formulaire (ajout, lien Steam, collage) vit dans un élément persistant : il survit
// aux mises à jour Firestore, donc ce qu'on est en train de saisir n'est jamais effacé.
const libraryFormZone = document.createElement('div');
libraryFormZone.style.marginTop = '8px';

function setLibraryView(v) { libraryView = v; localStorage.setItem('gn_library_view', v); renderMain(true); }

function renderLibrary(main) {
  // Déjà affichée : on ne rafraîchit que le compteur et la liste (garde le focus et le formulaire).
  if (main.dataset.view === 'library' && main.querySelector('#libList')) { refreshLibraryList(main); return; }

  const btnRow = document.createElement('div'); btnRow.className = 'btn-row';
  const addBtn = document.createElement('button'); addBtn.className = 'btn btn-ghost'; addBtn.textContent = '+ Ajouter un jeu';
  const steamBtn = document.createElement('button'); steamBtn.className = 'btn btn-primary'; steamBtn.textContent = 'Lier mon compte Steam';
  btnRow.appendChild(addBtn); btnRow.appendChild(steamBtn); main.appendChild(btnRow);

  const pasteLink = document.createElement('button'); pasteLink.className = 'link-btn'; pasteLink.textContent = 'ou coller une liste copiée depuis Steam';
  pasteLink.style.marginTop = '4px';
  main.appendChild(pasteLink);

  const formZone = libraryFormZone;
  main.appendChild(formZone);

  addBtn.onclick = () => {
    formZone.innerHTML = '';
    const f = document.createElement('div'); f.className = 'inline-form';
    f.innerHTML = '<input type="text" id="gnName" placeholder="Nom du jeu"><input type="text" id="gnTag" placeholder="Genre (FPS, Coop, Party game…)"><div class="btn-row"><button class="btn btn-ghost" id="gnCancel">Annuler</button><button class="btn btn-primary" id="gnSave">Ajouter</button></div>';
    formZone.appendChild(f);
    document.getElementById('gnCancel').onclick = () => { formZone.innerHTML = ''; };
    document.getElementById('gnSave').onclick = () => {
      const name = document.getElementById('gnName').value, tag = document.getElementById('gnTag').value;
      if (!name.trim()) { toast('Donne un nom au jeu.'); return; }
      addGame(name, tag); formZone.innerHTML = '';
    };
  };
  steamBtn.onclick = () => showSteamLink(formZone);
  pasteLink.onclick = () => showPasteImport(formZone);

  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:10px;';
  const title = document.createElement('div'); title.className = 'section-title'; title.id = 'libTitle';
  titleRow.appendChild(title);
  const rightSide = document.createElement('div'); rightSide.style.cssText = 'display:flex;align-items:center;gap:10px;';
  const toggle = document.createElement('div'); toggle.className = 'view-toggle';
  toggle.innerHTML = '<button data-v="list" title="Vue liste" aria-label="Vue liste">☰</button><button data-v="grid" title="Vue grille" aria-label="Vue grille">⊞</button>';
  toggle.querySelectorAll('button').forEach(b => { b.classList.toggle('active', b.dataset.v === libraryView); b.onclick = () => setLibraryView(b.dataset.v); });
  rightSide.appendChild(toggle);
  const clearAllBtn = document.createElement('button'); clearAllBtn.className = 'icon-btn danger'; clearAllBtn.id = 'libClear'; clearAllBtn.innerHTML = ICON_TRASH; clearAllBtn.title = 'Tout supprimer'; clearAllBtn.setAttribute('aria-label', 'Tout supprimer');
  clearAllBtn.onclick = () => showConfirm('Supprimer les ' + State.games.length + ' jeux de la bibliothèque ? Action irréversible.', 'Tout supprimer', clearAllGames);
  rightSide.appendChild(clearAllBtn);
  titleRow.appendChild(rightSide); main.appendChild(titleRow);

  const listHolder = document.createElement('div'); listHolder.id = 'libList'; main.appendChild(listHolder);
  refreshLibraryList(main);
}

function refreshLibraryList(main) {
  main.querySelector('#libTitle').textContent = 'Bibliothèque · ' + State.games.length;
  main.querySelector('#libClear').style.display = State.games.length ? '' : 'none';
  const holder = main.querySelector('#libList');
  holder.innerHTML = '';
  if (!State.games.length) { const b = infoBox('Aucun jeu pour l\'instant', 'Ajoute-en un, lie ton compte Steam ou colle une liste.'); b.style.marginTop = '12px'; holder.appendChild(b); return; }
  const sorted = State.games.slice().sort((a,b) => a.name.localeCompare(b.name));
  holder.appendChild(libraryView === 'grid' ? buildGameGrid(sorted) : buildGameList(sorted));
}

function buildGameList(games) {
  const list = document.createElement('div'); list.className = 'game-list';
  games.forEach(g => {
    const row = document.createElement('div'); row.className = 'game-row';
    row.innerHTML = '<div class="g-cover">'+coverHtml(g,{small:true})+'</div>' +
      '<div class="g-main"><div class="g-name">'+escapeHtml(g.name)+'</div><div class="g-by">Par '+escapeHtml(presentedBy(g))+'</div></div>' +
      '<span class="g-tag">'+escapeHtml(g.tag||'Autre')+'</span>' +
      '<button class="icon-btn" title="Retirer" aria-label="Retirer">'+ICON_TRASH+'</button>';
    row.querySelector('.icon-btn').onclick = () => showConfirm('Retirer « '+g.name+' » de la bibliothèque ?', 'Retirer', () => removeGame(g.id));
    list.appendChild(row);
  });
  return list;
}
function buildGameGrid(games) {
  const grid = document.createElement('div'); grid.className = 'game-grid';
  games.forEach(g => {
    const item = document.createElement('div'); item.className = 'grid-item';
    item.innerHTML = '<div class="grid-cover">'+coverHtml(g,{small:true})+'<button class="grid-del" title="Retirer" aria-label="Retirer">✕</button></div>' +
      '<div class="grid-name">'+escapeHtml(g.name)+'</div><div class="grid-by">'+escapeHtml(presentedBy(g))+'</div>';
    item.querySelector('.grid-del').onclick = e => { e.stopPropagation(); showConfirm('Retirer « '+g.name+' » de la bibliothèque ?', 'Retirer', () => removeGame(g.id)); };
    grid.appendChild(item);
  });
  return grid;
}

// --- Lien direct avec Steam ---
function showSteamLink(zone) {
  zone.innerHTML = '';
  const f = document.createElement('div'); f.className = 'inline-form';
  f.innerHTML =
    '<div class="hint">Colle le lien de ton profil Steam (ou ton pseudo, ou ton ID à 17 chiffres). Ton profil doit avoir <b>« Détails du jeu »</b> réglé sur <b>Public</b> : Steam › Profil › Modifier le profil › Paramètres de confidentialité.</div>' +
    '<input type="text" id="steamInput" placeholder="steamcommunity.com/id/ton-pseudo" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div class="btn-row"><button class="btn btn-ghost" id="steamCancel">Annuler</button><button class="btn btn-primary" id="steamGo">Récupérer mes jeux</button></div>' +
    '<div class="hint" id="steamStatus"></div>';
  zone.appendChild(f);
  const input = f.querySelector('#steamInput'), go = f.querySelector('#steamGo'), status = f.querySelector('#steamStatus');
  input.value = mySteam;
  f.querySelector('#steamCancel').onclick = () => { zone.innerHTML = ''; };
  const run = async () => {
    const val = input.value.trim();
    if (!val) { toast('Colle le lien de ton profil Steam.'); return; }
    go.disabled = true; status.textContent = 'Connexion à Steam…';
    try {
      const data = await fetchSteamLibrary(val);
      mySteam = val; localStorage.setItem('gn_steam', val);
      playersCol().doc(myId).set({ steamId: data.steamid }, { merge: true }).catch(() => {});
      showSteamPreview(zone, data.games);
    } catch (e) {
      status.textContent = steamErrorMessage(e && e.code);
      go.disabled = false;
    }
  };
  go.onclick = run;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
}

function hoursLabel(min) {
  if (!min) return '';
  if (min < 60) return min + ' min';
  return Math.round(min / 60) + ' h';
}
function showSteamPreview(zone, games) {
  zone.innerHTML = '';
  const box = document.createElement('div'); box.className = 'inline-form';
  const head = document.createElement('div'); head.className = 'hint';
  head.innerHTML = '<b>' + games.length + '</b> jeux trouvés sur ton compte, triés par temps de jeu. Les démos, playtests et outils sont décochés.';
  box.appendChild(head);

  const tools = document.createElement('div'); tools.className = 'import-tools';
  tools.innerHTML = '<button class="btn btn-ghost btn-sm" data-a="all">Tout</button><button class="btn btn-ghost btn-sm" data-a="none">Aucun</button><button class="btn btn-ghost btn-sm" data-a="top50">Top 50</button>';
  box.appendChild(tools);

  const preview = document.createElement('div'); preview.className = 'import-preview';
  games.forEach((g, i) => {
    const row = document.createElement('label'); row.className = 'import-row';
    const checked = !NOISE_GAME_RX.test(g.name);
    row.innerHTML = '<input type="checkbox" data-i="'+i+'"'+(checked ? ' checked' : '')+'><span class="ir-name">'+escapeHtml(g.name)+'</span><span class="ir-meta">'+hoursLabel(g.playtime)+'</span>';
    preview.appendChild(row);
  });
  box.appendChild(preview);

  const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary';
  box.appendChild(confirmBtn);
  zone.appendChild(box);

  const boxes = () => Array.from(preview.querySelectorAll('input[type=checkbox]'));
  const refresh = () => { const n = boxes().filter(b => b.checked).length; confirmBtn.textContent = 'Ajouter la sélection (' + n + ')'; confirmBtn.disabled = !n; };
  preview.addEventListener('change', refresh);
  tools.addEventListener('click', e => {
    const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    boxes().forEach((b, i) => { b.checked = a === 'all' ? true : a === 'none' ? false : (i < 50 && !NOISE_GAME_RX.test(games[i].name)); });
    refresh();
  });
  refresh();

  confirmBtn.onclick = async () => {
    const chosen = boxes().filter(b => b.checked).map(b => games[+b.dataset.i]);
    confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…';
    try {
      const r = await importGames(chosen.map(g => ({ name: g.name, tag: 'Steam', appid: g.appid, image: g.image, fallbackImage: g.fallbackImage })));
      toast(summarizeImport(r));
      zone.innerHTML = '';
    } catch (e) { toast('L\'import a échoué. Réessaie.'); confirmBtn.disabled = false; refresh(); }
  };
}

// --- Import par copier-coller (solution de secours) ---
function showPasteImport(zone) {
  zone.innerHTML = '';
  const f = document.createElement('div'); f.className = 'inline-form';
  f.innerHTML = '<textarea id="pasteBox" placeholder="Colle ici la liste copiée depuis ta page Steam."></textarea><div class="btn-row"><button class="btn btn-ghost" id="pasteCancel">Annuler</button><button class="btn btn-primary" id="pasteGo">Analyser</button></div>';
  zone.appendChild(f);
  document.getElementById('pasteCancel').onclick = () => { zone.innerHTML = ''; };
  document.getElementById('pasteGo').onclick = () => showImportPreview(zone, document.getElementById('pasteBox').value);
}
function showImportPreview(zone, raw) {
  const candidates = cleanupPastedList(raw);
  zone.innerHTML = '';
  if (!candidates.length) { zone.appendChild(infoBox('Rien trouvé', 'Essaie de coller un bloc plus large de la page Steam.')); return; }
  const box = document.createElement('div'); box.className = 'inline-form';
  const preview = document.createElement('div'); preview.className = 'import-preview';
  candidates.forEach((name, i) => {
    const row = document.createElement('label'); row.className = 'import-row';
    row.innerHTML = '<input type="checkbox" checked data-i="'+i+'"><span class="ir-name">'+escapeHtml(name)+'</span>';
    preview.appendChild(row);
  });
  box.appendChild(preview);
  const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary'; confirmBtn.textContent = 'Ajouter la sélection ('+candidates.length+')';
  confirmBtn.onclick = async () => {
    const checked = Array.from(preview.querySelectorAll('input:checked')).map(cb => ({ name: candidates[+cb.dataset.i], tag: 'Steam' }));
    if (!checked.length) { toast('Coche au moins un jeu.'); return; }
    confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…';
    const r = await importGames(checked);
    toast(summarizeImport(r)); zone.innerHTML = '';
  };
  box.appendChild(confirmBtn);
  zone.appendChild(box);
}

function renderMatches(main) {
  main.innerHTML = '';
  const title = document.createElement('div'); title.className = 'section-title ornate'; title.textContent = 'Matchs de ce soir';
  main.appendChild(title);
  const stats = matchStats();
  if (!stats.length) { main.appendChild(infoBox('Pas encore de match', 'Dès que plusieurs d\'entre vous auront aimé le même jeu, il apparaîtra ici.')); return; }
  const list = document.createElement('div'); list.className = 'match-list';
  stats.forEach(m => {
    const row = document.createElement('div'); row.className = 'match-row' + (m.full ? ' full' : '');
    const names = m.likers.map(l => l.playerName).filter(Boolean).join(', ');
    row.innerHTML = '<div class="g-cover" style="width:44px;height:44px;">'+coverHtml(m.game,{small:true})+'</div>' +
      '<div class="m-body"><div class="m-name">'+escapeHtml(m.game.name)+'</div><div class="m-score">'+m.count+' sur '+m.denom+' — '+escapeHtml(names)+'</div></div>' +
      (m.full ? '<span class="m-badge">MATCH</span>' : '');
    list.appendChild(row);
  });
  main.appendChild(list);
}

document.querySelectorAll('nav.tabbar .tab').forEach(tab => {
  tab.addEventListener('click', () => { currentTab = tab.dataset.tab; renderAll(); });
});
document.getElementById('roomPill').addEventListener('click', () => {
  if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(() => toast('Code copié : ' + roomCode));
});

// ---------------------------------------------------------------
// Porte d'entrée : rejoindre ou créer une salle
// ---------------------------------------------------------------
function showGate() {
  const gate = document.createElement('div'); gate.className = 'gate'; gate.id = 'gate';
  gate.innerHTML =
    '<div class="box">' +
    '<div class="brand-sub">Ce soir · entre amis</div>' +
    '<h2>Rejoindre la salle</h2>' +
    '<p>Entre le code de tes amis pour les rejoindre, ou laisse vide pour ouvrir une nouvelle salle.</p>' +
    '<input type="text" id="gateCode" placeholder="Code de salle (ex : AB12C)" maxlength="8" style="text-transform:uppercase;" autocapitalize="characters">' +
    '<input type="text" id="gateName" placeholder="Ton prénom">' +
    '<button class="btn btn-primary" id="gateGo" style="width:100%;">Entrer</button>' +
    '</div>';
  document.body.appendChild(gate);
  document.getElementById('gateGo').onclick = () => {
    const name = document.getElementById('gateName').value.trim();
    let code = document.getElementById('gateCode').value.trim();
    if (!name) { toast('Donne ton prénom.'); return; }
    if (!code) code = randomRoomCode();
    joinRoom(code, name);
  };
}

if (roomCode && myName) {
  startListening();
  playersCol().doc(myId).set({ name: myName, color: colorFor(myId), playing: true, ts: Date.now() }, { merge: true });
} else {
  showGate();
}
