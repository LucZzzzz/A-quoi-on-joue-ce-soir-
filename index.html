const infoCache = {};
const priceCache = {};
let focusGameId = null;
let infoModalGid = null;
const isWide = () => window.matchMedia && matchMedia('(min-width: 1100px)').matches;

function priceHtml(g) {
  const p = priceCache[g.id] || { state: 'idle' };
  if (p.state === 'idle') return '<button class="price-btn" type="button" data-gid="' + g.id + '">💰 Voir le prix le plus bas</button>';
  if (p.state === 'loading') return '<div class="price-loading">Recherche du meilleur prix…</div>';
  if (p.state === 'none') return '<div class="price-none">Aucun prix trouvé pour ce jeu.</div>';
  const off = p.savings ? ' <span class="price-off">-' + p.savings + '%</span>' : '';
  return '<a class="price-result" href="' + p.url + '" target="_blank" rel="noopener noreferrer">💰 ' + p.price.toFixed(2) + ' € chez ' + escapeHtml(p.store) + off + '</a>' +
    (p.approx ? '<div class="price-approx">Correspondance approximative — vérifie le titre avant d\'acheter.</div>' : '');
}
async function ensurePrice(gid) {
  const g = gameById(gid);
  if (!g || (priceCache[gid] && priceCache[gid].state !== 'idle')) return;
  priceCache[gid] = { state: 'loading' };
  refreshInfo();
  let result = { state: 'none' };
  try {
    const r = await fetch('/api/game-price?name=' + encodeURIComponent(g.name));
    if (r.ok) {
      const d = await r.json();
      if (d && d.found) result = { state: 'ok', price: d.price, store: d.store, url: d.url, savings: d.savings, approx: d.approx };
    }
  } catch (e) {}
  priceCache[gid] = result;
  refreshInfo();
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.price-btn');
  if (btn) ensurePrice(btn.dataset.gid);
});

function infoOf(g) {
  if (g.desc) return { state: 'ok', desc: g.desc, genres: g.genres || [], dev: g.dev || '', released: g.released || '', mp: g.multiplayer };
  if (g.infoTs) return { state: 'none', mp: g.multiplayer };
  return infoCache[g.id] || { state: 'loading' };
}
function mpBadge(mp) {
  if (mp === true) return '<div class="info-mp yes">🎮 Multijoueur</div>';
  if (mp === false) return '<div class="info-mp no">🚫 Solo uniquement</div>';
  return '';
}
function infoHtml(g) {
  const i = infoOf(g);
  const head = '<div class="info-kicker"></div><h3 class="info-title">' + escapeHtml(g.name) + '</h3>';
  if (i.state === 'loading') return head + '<div class="info-skel"><i></i><i></i><i></i></div>';
  if (i.state === 'none') return head + mpBadge(i.mp) + '<p class="info-desc dim">Pas de description disponible pour ce jeu.</p>' + priceHtml(g);
  const genres = i.genres.length ? '<div class="info-genres">' + i.genres.map(x => '<span>' + escapeHtml(x) + '</span>').join('') + '</div>' : '';
  const meta = [i.dev, i.released ? 'Sortie : ' + i.released : ''].filter(Boolean).join(' · ');
  return head + mpBadge(i.mp) + '<p class="info-desc">' + escapeHtml(i.desc) + '</p>' + genres +
    (meta ? '<div class="info-meta">' + escapeHtml(meta) + '</div>' : '') + priceHtml(g) + '<div class="info-src">Source : page Steam</div>';
}
async function ensureInfo(g) {
  if (!g || infoCache[g.id]) return;
  const mpKnown = g.multiplayer === true || g.multiplayer === false;
  if (g.desc && mpKnown) return; // description ET statut multijoueur déjà acquis : rien à refaire
  if (!g.desc && g.infoTs && mpKnown) return; // "pas de description" déjà constaté, et multijoueur connu
  infoCache[g.id] = { state: 'loading' };
  let appid = g.appid || null, found = null, mp, failed = false;
  try {
    if (!appid) {
      const r0 = await fetch('/api/steam-cover?name=' + encodeURIComponent(g.name));
      if (!r0.ok) failed = true;
      else { const c = await r0.json(); if (c && c.found && c.appid) appid = c.appid; }
    }
    if (appid && !failed) {
      const d = await fetchSteamInfo(appid);
      if (d) { mp = d.multiplayer; if (d.found && d.description) found = d; else if (d.error) failed = true; }
      else failed = true;
    }
  } catch (e) { failed = true; }
  if (found) {
    infoCache[g.id] = { state: 'ok', desc: found.description, genres: found.genres || [], dev: found.developer || '', released: found.released || '', mp };
    gamesCol().doc(g.id).update({ desc: found.description, genres: found.genres || [], dev: found.developer || '', released: found.released || '', appid: appid || null, multiplayer: mp === undefined ? null : mp, infoTs: Date.now() }).catch(() => {});
  } else if (!failed) {
    infoCache[g.id] = { state: 'none', mp };
    gamesCol().doc(g.id).update({ desc: '', multiplayer: mp === undefined ? null : mp, infoTs: Date.now() }).catch(() => {});
  } else {
    // Échec (réseau, Steam indisponible…) : on ne mémorise rien de définitif,
    // pour qu'un prochain passage (import, filtre, ouverture de la fiche) réessaie.
    infoCache[g.id] = g.desc ? { state: 'ok', desc: g.desc, genres: g.genres || [], dev: g.dev || '', released: g.released || '', mp: g.multiplayer }
      : { state: g.infoTs ? 'none' : 'loading', mp: g.multiplayer };
  }
  refreshInfo();
}

// Trie et, pour « genre » et « provenance », regroupe les jeux sous des en-têtes.
// La provenance retenue pour le regroupement est la personne qui a présenté le
// jeu en premier ; la ligne du jeu continue d'afficher tous ses possesseurs.
function groupGames(games, mode) {
  const byName = (a, b) => a.name.localeCompare(b.name);
  if (mode === 'recent') return [{ label: null, games: games.slice().sort((a, b) => b.ts - a.ts) }];
  if (mode === 'tag' || mode === 'owner') {
    const map = new Map();
    games.forEach(g => {
      const key = mode === 'tag' ? (g.tag || 'Autre') : (g.addedBy || 'Inconnu');
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(g);
    });
    return Array.from(map.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([label, list]) => ({ label, games: list.sort(byName) }));
  }
  return [{ label: null, games: games.slice().sort(byName) }];
}

    '<div class="btn-row"><button class="btn btn-ghost" id="steamCancel">Annuler</button><button class="btn btn-primary" id="steamGo">Récupérer mes jeux</button></div>' +
    '<div class="hint" id="steamStatus"></div>';

  input.value = mySteam;
  f.querySelector('#steamCancel').onclick = () => { zone.innerHTML = ''; };
  const run = async () => {
    const val = input.value.trim();
    if (!val) { toast('Colle le lien de ton profil Steam.'); return; }
    go.disabled = true; status.textContent = 'Connexion à Steam…';

      showSteamPreview(zone, data.games);
    } catch (e) {
      status.textContent = steamErrorMessage(e && e.code);
      go.disabled = false;
    }
  };
  go.onclick = run;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
}

function hoursLabel(min) {
  if (!min) return '';
  if (min < 60) return min + ' min';
  return Math.round(min / 60) + ' h';
}
function showSteamPreview(zone, games) {
  zone.innerHTML = '';
  const box = document.createElement('div'); box.className = 'inline-form';
  const head = document.createElement('div'); head.className = 'hint';
  head.innerHTML = '<b>' + games.length + '</b> jeux trouvés sur ton compte, triés par temps de jeu. Les démos, playtests et outils sont décochés.';
  box.appendChild(head);

  const mpRow = document.createElement('div'); mpRow.className = 'mp-row';
  mpRow.innerHTML = '<label><input type="checkbox" id="mpOnly" checked> 🎮 Multijoueur uniquement</label><span class="ir-meta" id="mpProgress"></span>';
  box.appendChild(mpRow);
  const mpStatus = document.createElement('div'); mpStatus.className = 'hint'; mpStatus.id = 'mpStatus'; mpStatus.style.display = 'none';
  box.appendChild(mpStatus);

  const tools = document.createElement('div'); tools.className = 'import-tools';
  tools.innerHTML = '<button class="btn btn-ghost btn-sm" data-a="all">Tout</button><button class="btn btn-ghost btn-sm" data-a="none">Aucun</button><button class="btn btn-ghost btn-sm" data-a="top50">Top 50</button>';
  box.appendChild(tools);

  const preview = document.createElement('div'); preview.className = 'import-preview';
  games.forEach((g, i) => {
    const row = document.createElement('label'); row.className = 'import-row'; row.dataset.mp = g.appid ? 'pending' : 'unknown';
    const checked = !NOISE_GAME_RX.test(g.name);
    row.innerHTML = '<input type="checkbox" data-i="'+i+'"'+(checked ? ' checked' : '')+'><span class="ir-name">'+escapeHtml(g.name)+'</span><span class="ir-mp" title="Vérification du multijoueur">⋯</span><span class="ir-meta">'+hoursLabel(g.playtime)+'</span>';
    preview.appendChild(row);
  });
  box.appendChild(preview);

  const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary';
  box.appendChild(confirmBtn);
  zone.appendChild(box);

  const mpOnly = mpRow.querySelector('#mpOnly'), mpProgress = mpRow.querySelector('#mpProgress');
  const rowEls = Array.from(preview.querySelectorAll('.import-row'));
  const visible = row => row.style.display !== 'none';
  const boxes = () => rowEls.map(r => r.querySelector('input[type=checkbox]'));
  const refresh = () => {
    const n = rowEls.filter(r => visible(r) && r.querySelector('input').checked).length;
    confirmBtn.textContent = 'Ajouter la sélection (' + n + ')'; confirmBtn.disabled = !n;
  };
  // Filtre STRICT : seuls les jeux confirmés multijoueur restent visibles quand
  // la case est cochée. Un jeu qu'on n'a pas réussi à vérifier est masqué lui
  // aussi (mieux vaut en manquer un que de laisser passer un jeu solo) — mais
  // reste réessayable via le bouton dédié ci-dessous plutôt que perdu.
  function applyVisibility() {
    rowEls.forEach(row => { row.style.display = (mpOnly.checked && row.dataset.mp !== 'multi' && row.dataset.mp !== 'pending') ? 'none' : ''; });
    refresh();
  }
  preview.addEventListener('change', refresh);
  mpOnly.addEventListener('change', applyVisibility);
  tools.addEventListener('click', e => {
    const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    rowEls.forEach((row, i) => {
      const b = row.querySelector('input');
      b.checked = a === 'all' ? true : a === 'none' ? false : (i < 50 && !NOISE_GAME_RX.test(games[i].name));
    });
    refresh();
  });
  refresh();

  // Vérification progressive du multijoueur (et récupération de la description
  // au passage, pour ne pas la redemander plus tard une fois le jeu ajouté).
  // Concurrence volontairement basse : l'API boutique Steam limite le débit
  // assez fort, et il arrive qu'elle bloque carrément les appels venant d'un
  // serveur (comme Vercel) plutôt que d'un navigateur — voir le bouton
  // « Réessayer » et le message ci-dessous si beaucoup de jeux restent gris.
  const targets = rowEls.filter(r => games[+r.querySelector('input').dataset.i].appid);
  function checkOne(row) {
    const g = games[+row.querySelector('input').dataset.i];
    return fetchSteamInfo(g.appid).then(info => {
      if (info) {
        g._mp = typeof info.multiplayer === 'boolean' ? info.multiplayer : undefined;
        if (info.found) { g._desc = info.description; g._genres = info.genres; g._dev = info.developer; g._released = info.released; }
      } else g._mp = undefined;
      row.dataset.mp = g._mp === true ? 'multi' : g._mp === false ? 'solo' : 'unknown';
      const tag = row.querySelector('.ir-mp');
      tag.textContent = g._mp === true ? '🎮' : g._mp === false ? '🚫' : '❓';
      tag.title = g._mp === true ? 'Multijoueur confirmé' : g._mp === false ? 'Solo uniquement' : 'Non déterminé — masqué par précaution, réessayable';
    });
  }
  async function runCheck(rows) {
    let done = 0;
    mpProgress.textContent = 'Vérification multijoueur… 0/' + rows.length;
    await runPool(rows.map(row => async () => {
      await checkOne(row);
      done++;
      mpProgress.textContent = done < rows.length ? 'Vérification multijoueur… ' + done + '/' + rows.length : '';
      applyVisibility();
    }), 2);
    const unresolved = rows.filter(r => r.dataset.mp === 'unknown');
    if (unresolved.length) {
      const bad = unresolved.length / rows.length;
      mpStatus.style.display = '';
      mpStatus.innerHTML = (bad > 0.4
        ? '⚠️ Steam n\'a répondu pour presque aucun jeu (' + unresolved.length + '/' + rows.length + ') — il bloque peut-être les appels depuis ce serveur. '
        : (unresolved.length + ' jeu(x) n\'ont pas pu être vérifiés. ')) +
        'Ils restent masqués tant que le filtre est actif. <button class="link-btn" id="mpRetry" style="display:inline;padding:0;">Réessayer ces ' + unresolved.length + ' jeu(x)</button>';
      const retryBtn = mpStatus.querySelector('#mpRetry');
      if (retryBtn) retryBtn.onclick = () => { mpStatus.style.display = 'none'; runCheck(unresolved); };
    } else mpStatus.style.display = 'none';
  }
  if (targets.length) runCheck(targets); else mpProgress.textContent = '';

  confirmBtn.onclick = async () => {
    const chosen = rowEls.filter(r => visible(r) && r.querySelector('input').checked).map(r => games[+r.querySelector('input').dataset.i]);
    confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…';
    try {
      const r = await importGames(chosen.map(g => ({
        name: g.name, tag: 'Steam', appid: g.appid, image: g.image, fallbackImage: g.fallbackImage,
        desc: g._desc, genres: g._genres, dev: g._dev, released: g._released, multiplayer: g._mp,
      })));
      toast(summarizeImport(r));
      zone.innerHTML = '';
    } catch (e) { toast('L\'import a échoué. Réessaie.'); confirmBtn.disabled = false; refresh(); }
  };
}

  });
  box.appendChild(preview);
  const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary'; confirmBtn.textContent = 'Ajouter la sélection ('+candidates.length+')';
  confirmBtn.onclick = async () => {
    const checked = Array.from(preview.querySelectorAll('input:checked')).map(cb => ({ name: candidates[+cb.dataset.i], tag: 'Steam' }));
    if (!checked.length) { toast('Coche au moins un jeu.'); return; }
    confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…';
    const r = await importGames(checked);
    toast(summarizeImport(r)); zone.innerHTML = '';
  };
  box.appendChild(confirmBtn);
  zone.appendChild(box);
}

let matchesView = localStorage.getItem('gn_matches_view') || 'list';
function setMatchesView(v) { matchesView = v; localStorage.setItem('gn_matches_view', v); renderMain(true); }

function renderMatches(main) {
  main.innerHTML = '';
  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;';
  const title = document.createElement('div'); title.className = 'section-title ornate'; title.style.flex = '1'; title.textContent = 'Matchs de ce soir';
  titleRow.appendChild(title);
  const stats = matchStats();
  if (stats.length) {
    const toggle = document.createElement('div'); toggle.className = 'view-toggle';
    toggle.innerHTML = '<button data-v="list" title="Vue liste" aria-label="Vue liste">☰</button><button data-v="grid" title="Vue grille" aria-label="Vue grille">⊞</button>';
    toggle.querySelectorAll('button').forEach(b => { b.classList.toggle('active', b.dataset.v === matchesView); b.onclick = () => setMatchesView(b.dataset.v); });
    titleRow.appendChild(toggle);
  }

}
function buildMatchList(stats) {
  const list = document.createElement('div'); list.className = 'match-list';
  stats.forEach(m => {
    const row = document.createElement('div'); row.className = 'match-row' + (m.full ? ' full' : '') + (m.game.id === focusGameId ? ' focused' : ''); row.dataset.gid = m.game.id;
    row.addEventListener('click', () => openInfo(m.game.id));
    const names = m.likers.map(l => l.playerName).filter(Boolean).join(', ');
    row.innerHTML = '<div class="g-cover" style="width:44px;height:44px;">'+coverHtml(m.game,{small:true})+'</div>' +
      '<div class="m-body"><div class="m-name">'+escapeHtml(m.game.name)+'</div><div class="m-score">'+m.count+' sur '+m.denom+' — '+escapeHtml(names)+'</div></div>' +
      (m.full ? '<span class="m-badge">MATCH</span>' : '');
    list.appendChild(row);
  });
  return list;
}
function buildMatchGrid(stats) {
  const grid = document.createElement('div'); grid.className = 'game-grid';
  stats.forEach(m => {
    const names = m.likers.map(l => l.playerName).filter(Boolean).join(', ');
    const item = document.createElement('div'); item.className = 'grid-item' + (m.game.id === focusGameId ? ' focused' : ''); item.dataset.gid = m.game.id;
    item.addEventListener('click', () => openInfo(m.game.id));
    item.innerHTML = '<div class="grid-cover">' + coverHtml(m.game, { small: true }) + (m.full ? '<span class="m-badge" style="position:absolute;top:6px;left:6px;z-index:6;">MATCH</span>' : '') + '</div>' +
      '<div class="grid-name">' + escapeHtml(m.game.name) + '</div><div class="grid-by">' + m.count + '/' + m.denom + ' — ' + escapeHtml(names) + '</div>';
    grid.appendChild(item);
  });
  return grid;
}

// ---------------------------------------------------------------
// Roulette « Chef de soirée » — un 4e onglet qui tire au sort une
// personne présente, façon ouverture de caisse (défilement horizontal,
// résultat déterminé avant l'animation), avec un habillage propre à
// chaque thème. Le Chef peut ensuite valider un jeu parmi les matchs ;
// cette validation réutilise gameById/coverHtml/matchStats déjà en place.
// ---------------------------------------------------------------
let rouletteSpinning = false;
function isChief() { return !!(State.room && State.room.chief && State.room.chief.id === myId); }

function renderRoulette(main) {
  main.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'roulette-wrap';
  main.appendChild(wrap);

  const title = document.createElement('div'); title.className = 'section-title ornate'; title.textContent = 'Chef de soirée';
  wrap.appendChild(title);

  const stage = document.createElement('div'); stage.className = 'roul-stage';
  const trackOuter = document.createElement('div'); trackOuter.className = 'roul-track-outer';
  const track = document.createElement('div'); track.className = 'roul-track'; track.id = 'roulTrack';
  trackOuter.appendChild(track);
  const marker = document.createElement('div'); marker.className = 'roul-marker';
  trackOuter.appendChild(marker);
  stage.appendChild(trackOuter);
  wrap.appendChild(stage);
  layoutRouletteCards(track, State.players, false);

  const launchBtn = document.createElement('button');
  launchBtn.className = 'btn btn-primary roul-launch'; launchBtn.id = 'roulLaunch';
  const chief = State.room && State.room.chief;
  launchBtn.textContent = rouletteSpinning ? '🎲 Tirage en cours…' : chief ? '🎲 Relancer la roulette' : '🎲 Lancer la roulette';
  if (!State.players.length || rouletteSpinning) launchBtn.disabled = true;
  wrap.appendChild(launchBtn);

  if (!State.players.length) {
    wrap.appendChild(infoBox('Personne dans la salle', 'Reviens quand il y aura au moins une personne pour tirer un·e Chef·fe de soirée.'));
  }

  const resultBox = document.createElement('div'); resultBox.className = 'roul-result'; resultBox.id = 'roulResult';
  wrap.appendChild(resultBox);
  if (chief) renderChiefBanner(resultBox, chief);

  launchBtn.onclick = () => startRoulette(track, trackOuter, resultBox, launchBtn);

  const gamesSection = document.createElement('div'); gamesSection.id = 'roulGames';
  wrap.appendChild(gamesSection);
  renderChiefGamesSection(gamesSection, chief);

  if (authUser && State.room && !State.room.closed) {
    const inviteBtn = document.createElement('button'); inviteBtn.className = 'btn btn-ghost close-session-btn';
    inviteBtn.textContent = '👥 Inviter des amis';
    inviteBtn.onclick = showInviteFriendsModal;
    wrap.appendChild(inviteBtn);
  }
  if (isHost() && State.room && !State.room.closed) {
    const closeBtn = document.createElement('button'); closeBtn.className = 'btn btn-ghost close-session-btn';
    closeBtn.textContent = '🏁 Clôturer la soirée';
    closeBtn.onclick = closeSession;
    wrap.appendChild(closeBtn);
  }
}

function layoutRouletteCards(track, players, animate) {
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0px)';
  players.forEach(p => {
    const el = document.createElement('div'); el.className = 'roul-card'; el.dataset.pid = p.id;
    el.innerHTML = '<div class="roul-avatar">' + avatarFor(p, false) + '</div><div class="roul-name">' + escapeHtml(p.name) + '</div>';
    track.appendChild(el);
  });
}

function renderChiefBanner(box, chief) {
  box.innerHTML = '';
  const p = State.players.find(x => x.id === chief.id) || { id: chief.id, name: chief.name, color: colorFor(chief.id) };
  const banner = document.createElement('div'); banner.className = 'roul-chief-banner';
  banner.innerHTML = '<div class="roul-chief-avatar">' + avatarFor(p, false) + '</div>' +
    '<div><div class="roul-chief-kicker">Chef de soirée</div><div class="roul-chief-name">' + escapeHtml(chief.name) + '</div></div>';
  box.appendChild(banner);
}

// Tire le résultat AVANT de construire l'animation, puis construit une bande
// (mélange répété des joueurs) dans laquelle une carte précise — proche de la
// fin — est forcée à être ce résultat, et fait défiler la bande jusqu'à elle.
function startRoulette(track, trackOuter, resultBox, launchBtn) {
  const players = State.players.slice();
  if (!players.length || rouletteSpinning) return;
  rouletteSpinning = true;
  launchBtn.disabled = true;
  resultBox.innerHTML = '';

  const winner = players[Math.floor(Math.random() * players.length)];

  const REPEAT_MIN = Math.max(40, players.length * 6);
  const shuffled = () => players.slice().sort(() => Math.random() - 0.5);
  let strip = [];
  while (strip.length < REPEAT_MIN) strip = strip.concat(shuffled());
  strip = strip.slice(0, REPEAT_MIN);
  const targetIndex = Math.max(0, REPEAT_MIN - 1 - Math.min(5, players.length));
  strip[targetIndex] = winner;

  track.innerHTML = ''; track.style.transition = 'none'; track.style.transform = 'translateX(0px)';
  track.classList.add('blur');
  const itemEls = strip.map(p => {
    const el = document.createElement('div'); el.className = 'roul-card'; el.dataset.pid = p.id;
    el.innerHTML = '<div class="roul-avatar">' + avatarFor(p, false) + '</div><div class="roul-name">' + escapeHtml(p.name) + '</div>';
    track.appendChild(el);
    return el;
  });

  requestAnimationFrame(() => {
    const outerWidth = trackOuter.clientWidth;
    const targetEl = itemEls[targetIndex];
    const targetCenter = targetEl.offsetLeft + targetEl.offsetWidth / 2;
    const finalX = -(targetCenter - outerWidth / 2);
    void track.offsetWidth;
    track.style.transition = 'transform 4.4s cubic-bezier(.09,.72,.16,1)';
    track.style.transform = 'translateX(' + finalX + 'px)';
    setTimeout(() => track.classList.remove('blur'), 2600);
  });

  let done = false;
  const onEnd = e => {
    if (done || (e && e.propertyName && e.propertyName !== 'transform')) return;
    done = true;
    track.removeEventListener('transitionend', onEnd);
    finishRoulette(winner, itemEls[targetIndex], track, resultBox, launchBtn);
  };
  track.addEventListener('transitionend', onEnd);
  setTimeout(onEnd, 5200); // filet de sécurité si l'événement ne se déclenche pas
}

function finishRoulette(winner, winnerEl, track, resultBox, launchBtn) {
  winnerEl.classList.add('roul-winner');
  track.style.pointerEvents = 'none';
  playThemeRevealEffect(track, winnerEl);
  setTimeout(() => {
    rouletteSpinning = false;
    roomRef().set({ chief: { id: winner.id, name: winner.name, ts: Date.now() }, chosenGame: null }, { merge: true })
      .catch(() => { toast('Le résultat n\'a pas pu être enregistré.'); launchBtn.disabled = false; });
  }, 1500);
}

// Petite salve de particules (carrés ou ronds) qui jaillissent du centre d'un
// élément puis disparaissent — réutilisé par les thèmes Minecraft et Far Far West.
function burstParticles(el, opts) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const n = opts.count || 10;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'roul-particle ' + (opts.cls || '');
    const angle = (Math.PI * 2 * i) / n + Math.random() * 0.5;
    const dist = 40 + Math.random() * 50;
    p.style.cssText = 'position:fixed; left:' + cx + 'px; top:' + cy + 'px; z-index:90; pointer-events:none;' +
      '--dx:' + (Math.cos(angle) * dist).toFixed(0) + 'px; --dy:' + (Math.sin(angle) * dist).toFixed(0) + 'px;';
    if (opts.emoji) p.textContent = opts.emoji;
    document.body.appendChild(p);
    requestAnimationFrame(() => p.classList.add('go'));
    setTimeout(() => p.remove(), 900);
  }
}
function playThemeRevealEffect(track, winnerEl) {
  if (theme === 'repo') {
    Array.from(track.children).forEach(el => { if (el !== winnerEl) el.classList.add('roul-drop'); });
  } else if (theme === 'minecraft') {
    Array.from(track.children).forEach(el => { if (el !== winnerEl) el.classList.add('roul-mine'); });
    burstParticles(winnerEl, { count: 12, cls: 'roul-particle-block' });
  } else if (theme === 'western') {
    Array.from(track.children).forEach(el => { if (el !== winnerEl) el.classList.add('roul-fade'); });
    winnerEl.classList.add('roul-pin');
    burstParticles(winnerEl, { count: 8, cls: 'roul-particle-dust' });
  } else if (theme === 'medieval') {
    Array.from(track.children).forEach(el => { if (el !== winnerEl) el.classList.add('roul-fade'); });
    const rect = winnerEl.getBoundingClientRect();
    const seal = document.createElement('div'); seal.className = 'roul-seal';
    seal.style.cssText = 'position:fixed; left:' + (rect.left + rect.width / 2) + 'px; top:' + (rect.top + rect.height / 2) + 'px; z-index:90;';
    seal.textContent = '⚜️';
    document.body.appendChild(seal);
    requestAnimationFrame(() => seal.classList.add('go'));
    setTimeout(() => seal.remove(), 1000);
  } else {
    Array.from(track.children).forEach(el => { if (el !== winnerEl) el.classList.add('roul-fade'); });
  }
}

function renderChiefGamesSection(container, chief) {
  container.innerHTML = '';
  if (!chief) return;
  const chosen = State.room && State.room.chosenGame;
  if (chosen) {
    const g = gameById(chosen.id);
    const banner = document.createElement('div'); banner.className = 'roul-chosen-banner';
    banner.innerHTML = '<div class="roul-chosen-cover">' + (g ? coverHtml(g, { small: true }) : '') + '</div>' +
      '<div><div class="roul-chosen-kicker">🎮 Ce soir, on joue à</div><div class="roul-chosen-name">' + escapeHtml(g ? g.name : chosen.name) + '</div></div>';
    container.appendChild(banner);
    if (isChief()) {
      const changeBtn = document.createElement('button'); changeBtn.className = 'link-btn'; changeBtn.style.marginTop = '6px';
      changeBtn.textContent = 'Choisir un autre jeu';
      changeBtn.onclick = () => roomRef().update({ chosenGame: null }).catch(() => toast('Action impossible.'));
      container.appendChild(changeBtn);
    }
    return;
  }
  const sub = document.createElement('div'); sub.className = 'section-title'; sub.style.marginTop = '20px';
  sub.textContent = isChief() ? 'À toi de choisir le jeu de ce soir !' : 'En attente du choix de ' + chief.name + '…';
  container.appendChild(sub);
  const stats = matchStats();
  if (!stats.length) { container.appendChild(infoBox('Pas encore de match', 'Swipez encore un peu pour faire apparaître des matchs à proposer.')); return; }
  const grid = document.createElement('div'); grid.className = 'game-grid';
  stats.forEach(m => {
    const item = document.createElement('div'); item.className = 'grid-item';
    item.innerHTML = '<div class="grid-cover">' + coverHtml(m.game, { small: true }) + (m.full ? '<span class="m-badge" style="position:absolute;top:6px;left:6px;z-index:6;">MATCH</span>' : '') + '</div>' +
      '<div class="grid-name">' + escapeHtml(m.game.name) + '</div><div class="grid-by">' + m.count + '/' + m.denom + '</div>';
    if (isChief()) item.onclick = () => showChiefGameModal(m.game.id);
    grid.appendChild(item);
  });
  container.appendChild(grid);
}

function showChiefGameModal(gid) {
  const g = gameById(gid); if (!g) return;
  closeModal();
  const ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'modalOverlay';
  const box = document.createElement('div'); box.className = 'chief-modal';
  box.innerHTML =
    '<button class="chief-modal-close" type="button" aria-label="Fermer">✕</button>' +
    '<div class="chief-modal-cover">' + coverHtml(g) + '</div>' +
    '<div class="chief-modal-body"><h3>' + escapeHtml(g.name) + '</h3>' +
    (g.tag ? '<div class="info-genres"><span>' + escapeHtml(g.tag) + '</span></div>' : '') +
    (g.desc ? '<p class="info-desc">' + escapeHtml(g.desc) + '</p>' : '') +
    '<button class="btn btn-primary chief-validate" type="button">✅ Valider ce jeu</button></div>';
  ov.appendChild(box);
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  box.querySelector('.chief-modal-close').onclick = closeModal;
  box.querySelector('.chief-validate').onclick = () => {
    const FV = firebase.firestore.FieldValue;
    roomRef().set({
      chosenGame: { id: g.id, name: g.name, ts: Date.now(), by: myName },
      playedGames: FV.arrayUnion({ id: g.id, name: g.name, ts: Date.now(), chief: myName }),
    }, { merge: true }).catch(() => toast('Impossible de valider ce jeu.'));
    closeModal();
  };
}

const TAB_ORDER = ['deck', 'library', 'matches', 'roulette'];
function playPageIn(dir) {
  const main = document.getElementById('main');
  main.classList.remove('page-in-r', 'page-in-l'); void main.offsetWidth;
  main.classList.add('page-in-' + dir);
  const done = e => { if (e && e.target !== main) return; main.classList.remove('page-in-r', 'page-in-l'); main.removeEventListener('animationend', done); };
  main.addEventListener('animationend', done);
  setTimeout(() => done(null), 700);
}
document.querySelectorAll('nav.tabbar .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const next = tab.dataset.tab;
    if (next === currentTab) return;
    const dir = TAB_ORDER.indexOf(next) > TAB_ORDER.indexOf(currentTab) ? 'r' : 'l';
    currentTab = next;
    renderAll();
    playPageIn(dir);
  });
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const keys = Object.keys(THEMES);
  applyTheme(keys[(keys.indexOf(theme) + 1) % keys.length], true);
  renderHeader(); renderMain(true);
});
document.getElementById('roomPill').addEventListener('click', () => {
  if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(() => toast('Code copié : ' + roomCode));
});
document.getElementById('leaveBtn').addEventListener('click', leaveRoom);
document.getElementById('profileBtn').addEventListener('click', () => {
  if (authUser) showHub('home'); else showScreen('home');
});

// ---------------------------------------------------------------
// Porte d'entrée : rejoindre ou créer une salle
// ---------------------------------------------------------------
function showGate() {
  if (document.getElementById('gate')) return;
  const gate = document.createElement('div'); gate.className = 'gate'; gate.id = 'gate';
  gate.innerHTML =
    '<div class="box">' +
    '<div class="brand-sub">' + THEMES[theme].sub + '</div>' +
    '<h2>' + THEMES[theme].gate + '</h2>' +
    '<p>Entre le code de salle de tes amis pour les rejoindre, ou laisse vide pour ouvrir une nouvelle salle.</p>' +
    '<input type="text" id="gateCode" placeholder="Code de salle (ex : AB12C)" maxlength="8" style="text-transform:uppercase;" autocapitalize="characters">' +
    '<input type="text" id="gateName" placeholder="Ton prénom">' +
    '<button class="btn btn-primary" id="gateGo" style="width:100%;">Entrer</button>' +
    '<button class="link-btn" id="gateLogin" style="display:block;margin:14px auto 0;">Tu as un compte ? Se connecter</button>' +
    '</div>';
  document.body.appendChild(gate);
  document.getElementById('gateLogin').onclick = () => { gate.remove(); showScreen('login'); };
  document.getElementById('gateGo').onclick = () => {
    const name = document.getElementById('gateName').value.trim();
    let code = document.getElementById('gateCode').value.trim();
    if (!name) { toast('Donne ton prénom.'); return; }
    if (!code) code = randomRoomCode();
    joinRoom(code, name);
  };
}

applyTheme(theme);

// Le flux anonyme existant (roomCode+myName déjà en localStorage) est
// entièrement préservé : un utilisateur qui l'utilisait déjà retombe
// directement dans sa salle, sans jamais voir le nouvel écran d'accueil.
function boot() {
  if (roomCode && myName) {
    ensureHost().then(startListening);
    playersCol().doc(myId).set({ name: myName, color: colorFor(myId), playing: true, ts: Date.now() }, { merge: true });
  } else if (authUser) {
    showHub('home'); // session de compte déjà active (persistée par Firebase) -> tableau de bord direct
  } else {
    showScreen('home');
  }
}
function afterAuthResolved() {
  if (!authBooted) { authBooted = true; boot(); return; }
  if (currentScreen === 'login' || currentScreen === 'signup') { if (authUser) showHub('home'); else showScreen('home'); return; }
  if (currentScreen === 'hub') renderHubContent();
  else if (currentScreen === 'home') renderScreen();
}
auth.onAuthStateChanged(user => {
  authUser = user;
  document.getElementById('profileBtn').classList.toggle('profile-link', !!user);
  if (user) {
    usersCol().doc(user.uid).get().then(snap => {
      myProfile = snap.exists ? snap.data() : { username: 'Joueur·euse', createdAt: Date.now() };
      startPersonalListening();
      startFriendsListening();
      setPresence({ state: roomCode ? 'in-room' : 'online', roomCode: roomCode || null, roomName: (State.room && State.room.name) || roomCode || null });
      afterAuthResolved();
    }).catch(() => { myProfile = { username: 'Joueur·euse' }; afterAuthResolved(); });
  } else {
    myProfile = null; myPersonalGames = []; myFriendDocs = []; myInvitations = [];
    stopPersonalListening(); stopFriendsListening();
    afterAuthResolved();
  }
});
