<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>À quoi jouer ce soir ?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' shape-rendering='crispEdges'><rect width='36' height='36' fill='%230E1115'/><rect x='3' y='8' width='30' height='24' fill='%23000'/><rect x='5' y='10' width='26' height='20' fill='%23FF9A1F'/><rect x='7' y='12' width='22' height='11' fill='%2310141A'/><rect x='9' y='14' width='5' height='6' fill='%23FFE14D'/><rect x='22' y='14' width='5' height='6' fill='%23FFE14D'/><rect x='17' y='2' width='2' height='6' fill='%23000'/><rect x='15' y='0' width='6' height='4' fill='%23FF9A1F'/></svg>">

<style id="base">
  /* ===== Base commune : structure et animations partagées par tous les thèmes ===== */
  :root { --extra-off: 0px; --green: #2E9E6B; --red: #D64545; }
  .shell { display: flex; justify-content: center; gap: 28px; min-height: 100%; }
  .shell .app { flex: 0 1 520px; width: 100%; max-width: 520px; margin: 0; }
  .info-side { display: none; }
  .info-side:empty { visibility: hidden; }
  .card-caption .desc { display: none; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  @media (min-width: 1100px) {
    .info-side { display: block; flex: none; width: 340px; position: sticky; top: 20px; align-self: flex-start; margin-top: 20px; }
    .card-caption .desc, .card-caption .info-btn { display: none !important; }
  }
  @media (min-height: 780px) and (max-width: 1099px) {
    :root { --extra-off: 46px; }
    .card-caption .desc:not(:empty) { display: -webkit-box; }
  }

  /* Filtre « multijoueur uniquement » dans l'aperçu d'import Steam */
  .mp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -2px 0 2px; }
  .mp-row #libRemoveSolo { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 8px; }
  .player { position: relative; }
  .kick-btn { position: absolute; top: -6px; right: -4px; z-index: 2; width: 17px; height: 17px; border-radius: 50%; border: none; background: var(--red); color: #fff; font-size: 9px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .mp-row label { display: flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
  .mp-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent, var(--green)); flex: none; }
  .import-row .ir-mp { flex: none; font-size: 12px; opacity: 0.85; min-width: 1.4em; text-align: center; }

  /* Tri / regroupement de la bibliothèque */
  .sort-select { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line, var(--border, currentColor)); background: var(--surface, var(--bg-elevated, transparent)); color: inherit; cursor: pointer; }
  .lib-group { margin-top: 16px; opacity: 0.85; }
  .lib-group:first-child { margin-top: 4px; }
  .brand h1, .brand-sub { overflow: hidden; text-overflow: ellipsis; }

  /* Badge multijoueur / solo et bloc prix dans la fiche d'un jeu */
  .info-mp { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; }
  .info-mp.yes { color: #fff; background: var(--green); }
  .info-mp.no { color: #fff; background: var(--red); }
  .price-btn { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line, var(--border, currentColor)); background: transparent; color: inherit; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
  .price-loading, .price-none { font-size: 13px; opacity: 0.7; margin: 0 0 12px; }
  .price-result { display: flex; align-items: center; gap: 8px; margin: 2px 0 2px; padding: 9px 12px; border-radius: 8px; background: var(--green); color: #fff; text-decoration: none; font-weight: 700; font-size: 13.5px; }
  .price-result .price-off { font-weight: 700; opacity: 0.9; }
  .price-approx { font-size: 11.5px; opacity: 0.65; margin: 4px 0 12px; }

  /* Transition entre les pages : glissement + fondu, dans le sens de l'onglet visé */
  @keyframes pageInR { from { opacity: 0; transform: translateX(var(--page-shift, 16px)); } to { opacity: 1; transform: none; } }
  @keyframes pageInL { from { opacity: 0; transform: translateX(calc(var(--page-shift, 16px) * -1)); } to { opacity: 1; transform: none; } }
  main.page-in-r { animation: pageInR var(--page-dur, .24s) var(--page-ease, ease-out) both; }
  main.page-in-l { animation: pageInL var(--page-dur, .24s) var(--page-ease, ease-out) both; }
  @keyframes capSwap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card-caption.swap { animation: capSwap var(--swap-dur, .22s) var(--swap-ease, ease-out) both; }

  /* Cartes : le tampon suit le doigt, la carte qui part reste au-dessus */
  .swipe-card .stamp { transition: opacity .08s linear; }
  .swipe-card.leaving { will-change: transform; }

  /* Description : chargement, fenêtre d'infos */
  @keyframes skel { 50% { opacity: .26; } }
  .info-skel i { display: block; height: 10px; border-radius: 5px; background: currentColor; opacity: .12; margin: 9px 0; animation: skel 1.3s ease-in-out infinite; }
  .info-skel i:nth-child(2) { width: 90%; }
  .info-skel i:nth-child(3) { width: 64%; }
  .modal-box.modal-info { background: none !important; border: none !important; box-shadow: none !important; outline: none !important; padding: 0 !important; max-width: 360px; }
  .modal-box.modal-info::before { display: none !important; }
  .game-row, .grid-item, .match-row { cursor: pointer; }

  /* ===== Roulette « Chef de soirée » — structure commune aux 3 thèmes ===== */
  .roulette-wrap { display: flex; flex-direction: column; min-height: 0; }
  .roul-stage { position: relative; margin: 14px 0 18px; }
  .roul-track-outer { position: relative; overflow: hidden; height: 128px; border-radius: 14px; }
  .roul-track { position: absolute; top: 0; left: 0; height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 10px; will-change: transform; }
  .roul-track.blur { filter: blur(2.5px); }
  .roul-marker { position: absolute; left: 50%; top: -6px; bottom: -6px; width: 3px; margin-left: -1.5px; z-index: 5; pointer-events: none; }
  .roul-marker::before, .roul-marker::after { content: ''; position: absolute; left: 50%; width: 0; height: 0; border: 7px solid transparent; margin-left: -7px; }
  .roul-marker::before { top: -8px; border-top: none; border-bottom-width: 9px; }
  .roul-marker::after { bottom: -8px; border-bottom: none; border-top-width: 9px; }
  .roul-card { flex: none; width: 96px; height: 108px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; transition: opacity .5s ease, transform .5s ease, filter .5s ease; }
  .roul-card .roul-avatar { width: 52px; height: 52px; }
  .roul-card .roul-avatar svg { width: 100%; height: 100%; display: block; }
  .roul-card .roul-name { font-size: 12px; font-weight: 700; max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  .roul-card.roul-fade { opacity: 0.12; filter: blur(2px) grayscale(1); transform: scale(0.92); pointer-events: none; }
  .roul-card.roul-drop { transition: transform .65s cubic-bezier(.55,-0.3,.7,.1), opacity .6s ease .05s; transform: translateY(160px) rotate(30deg); opacity: 0; pointer-events: none; }
  .roul-half { pointer-events: none; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: transform .6s cubic-bezier(.33,0,.2,1), opacity .6s ease; }
  .roul-half .roul-avatar { width: 52px; height: 52px; } .roul-half .roul-avatar svg { width: 100%; height: 100%; }
  .roul-half .roul-name { font-size: 12px; font-weight: 700; }
  .roul-half-top { clip-path: polygon(0 0, 100% 0, 100% 55%, 0 45%); }
  .roul-half-bottom { clip-path: polygon(0 45%, 100% 55%, 100% 100%, 0 100%); }
  .roul-half.go.roul-half-top { transform: translate(-16px, -26px) rotate(-7deg); opacity: 0; }
  .roul-half.go.roul-half-bottom { transform: translate(16px, 26px) rotate(7deg); opacity: 0; }
  .roul-card.roul-mine { transition: transform .35s cubic-bezier(.55,-0.3,.7,.1), opacity .3s ease; transform: scale(0) rotate(25deg); opacity: 0; }
  .roul-card.roul-pin { animation: roulPin .6s cubic-bezier(.3,1.6,.4,1) both; }
  @keyframes roulPin { 0% { transform: scale(1) rotate(0); } 35% { transform: scale(1.1) rotate(-3deg); } 65% { transform: scale(0.97) rotate(2deg); } 100% { transform: scale(1.04) rotate(-1deg); } }
  .roul-particle { width: 8px; height: 8px; opacity: 1; transition: transform .8s cubic-bezier(.2,.7,.3,1), opacity .8s ease; transform: translate(0,0) scale(1); }
  .roul-particle.go { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  .roul-particle-block { background: #D9B23C; border: 1px solid rgba(0,0,0,.4); }
  .roul-particle-dust { width: 6px; height: 6px; border-radius: 50%; background: #C9A876; }
  .roul-seal { font-size: 40px; transform: translate(-50%,-50%) scale(2.4); opacity: 0; transition: transform .55s cubic-bezier(.2,.8,.3,1.1), opacity .3s ease; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .roul-seal.go { transform: translate(-50%,-50%) scale(1); opacity: 1; }

  /* ===== Tableau de bord (Hub) : menu latéral permanent + grande fenêtre ===== */
  .hub { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 0; }
  .hub-window { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 880px) {
    .hub { padding: clamp(10px, 3vh, 32px); }
    .hub-window { width: min(94vw, 1440px); height: min(92vh, 940px); border-radius: 18px; }
  }
  .hub-topbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 18px; }
  .hub-topbar .hub-burger { display: none; }
  .hub-topbar .hub-logo { font-family: var(--font-display, inherit); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hub-topbar .hub-spacer { flex: 1; }
  .hub-topbar .hub-user { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .hub-bell { position: relative; background: none; border: none; cursor: pointer; font-size: 17px; padding: 4px; }
  .hub-bell .dot { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--red, #d33); border: 2px solid; }
  .hub-body { flex: 1; display: flex; min-height: 0; }
  .hub-sidebar { flex: none; width: 210px; display: flex; flex-direction: column; padding: 10px; gap: 2px; overflow-y: auto; }
  .hub-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; background: none; border: none; text-align: left; width: 100%; position: relative; }
  .hub-nav-item .ic { width: 20px; text-align: center; flex: none; }
  .hub-nav-item .badge { margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--red, #d33); color: #fff; }
  .hub-content { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px 32px; }
  .hub-content h2 { margin: 0 0 4px; font-size: 20px; }
  .hub-search { width: 100%; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
  .hub-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
  .hub-card { border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
  .hub-card .hub-card-title { font-size: 12.5px; font-weight: 700; letter-spacing: .02em; opacity: .8; display: flex; align-items: center; gap: 6px; }
  .hub-card .hub-card-big { font-size: 26px; font-weight: 800; margin-top: 2px; }
  .hub-card .hub-card-sub { font-size: 12.5px; opacity: .75; }
  .hub-card .btn { margin-top: auto; align-self: flex-start; }
  .hub-overlay-bg { display: none; }
  @media (max-width: 879px) {
    .hub-topbar .hub-burger { display: block; background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 6px; }
    .hub-sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: 240px; z-index: 30; transform: translateX(-100%); transition: transform .22s ease; box-shadow: 8px 0 24px rgba(0,0,0,.25); }
    .hub-sidebar.open { transform: translateX(0); }
    .hub-overlay-bg.open { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.4); }
  }
  .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 12px; }
  .theme-swatch { border-radius: 14px; padding: 16px 14px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
  .theme-swatch .emoji { font-size: 30px; }
  .theme-swatch .active-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .roul-launch { width: 100%; }
  .roul-result { min-height: 4px; }
  .roul-chief-banner { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 16px; border-radius: 14px; opacity: 0; transform: translateY(8px) scale(.98); animation: roulBannerIn .5s cubic-bezier(.2,.9,.3,1.3) forwards; }
  @keyframes roulBannerIn { to { opacity: 1; transform: none; } }
  .roul-chief-banner .roul-chief-avatar { width: 56px; height: 56px; flex: none; } .roul-chief-banner .roul-chief-avatar svg { width: 100%; height: 100%; }
  .roul-chief-banner .roul-chief-kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .roul-chief-banner .roul-chief-name { font-size: 21px; font-weight: 800; }
  .roul-chosen-banner { display: flex; align-items: center; gap: 16px; margin-top: 18px; padding: 16px; border-radius: 14px; }
  .roul-chosen-cover { width: 84px; aspect-ratio: 3/4; flex: none; border-radius: 10px; overflow: hidden; position: relative; }
  .roul-chosen-kicker { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; opacity: .75; margin-bottom: 4px; }
  .roul-chosen-name { font-size: 20px; font-weight: 800; line-height: 1.15; }

  /* Grand pop-up du Chef pour valider un jeu */
  .chief-modal { position: relative; width: min(92vw, 480px); max-height: 88vh; overflow-y: auto; border-radius: 18px; padding: 0; }
  .chief-modal-close { position: absolute; top: 10px; right: 10px; z-index: 4; width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(0,0,0,0.45); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .chief-modal-cover { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; }
  .chief-modal-body { padding: 18px 20px 22px; }
  .chief-modal-body h3 { margin: 0 0 8px; font-size: 22px; line-height: 1.2; }
  .chief-modal-body .info-desc { margin: 10px 0 16px; }
  .chief-validate { width: 100%; font-size: 15px; padding: 14px; }

  /* ===== Comptes, profil, historique — réutilisent .gate/.box/.btn/.game-list déjà thémés ===== */
  .gate.wide .box { max-width: 460px; }
  .gate .box.scroll { max-height: 84vh; overflow-y: auto; }
  .home-logo { font-size: 44px; line-height: 1; margin-bottom: 6px; }
  .home-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .home-actions .btn { width: 100%; }
  .home-switch { text-align: center; margin-top: 14px; font-size: 13.5px; }
  .form-error { color: var(--red); font-size: 13px; line-height: 1.35; margin: -4px 0 10px; min-height: 0; }
  .form-error:empty { display: none; }
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .profile-avatar { width: 52px; height: 52px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; color: #fff; }
  .profile-name { font-size: 19px; font-weight: 800; }
  .profile-section-row { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 8px; }
  .history-item { cursor: pointer; }
  .history-item .m-name { font-size: 15.5px; }
  .history-empty { font-size: 13.5px; opacity: .7; }
  .close-session-btn { width: 100%; margin-top: 22px; }
  .close-modal-box ul { margin: 8px 0 14px; padding-left: 20px; font-size: 14px; line-height: 1.55; }
  .close-modal-box li { margin-bottom: 2px; }
  .summary-emoji { font-size: 40px; text-align: center; margin-bottom: 6px; }
  .summary-stats { display: flex; gap: 18px; justify-content: center; margin: 14px 0 18px; text-align: center; }
  .summary-stats b { display: block; font-size: 22px; }
  .summary-stats span { font-size: 11.5px; opacity: .7; text-transform: uppercase; letter-spacing: .06em; }
  .summary-games { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .summary-games li { padding: 9px 12px; border-radius: 8px; background: var(--surface-2, var(--bg-elevated-2, rgba(128,128,128,.12))); font-size: 14px; font-weight: 600; }
  #profileBtn.profile-link { position: relative; }
  #profileBtn.profile-link::after { content: ''; position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg); }

  @media (prefers-reduced-motion: reduce) {
    main.page-in-r, main.page-in-l, .card-caption.swap, .info-skel i { animation: none; }
    .roul-track { transition: none !important; }
  }
</style>
<style id="theme-flat">
  :root {
    --stack-off: 385px;
    color-scheme: light dark;
    --bg: #F5F5F2;
    --surface: #FFFFFF;
    --surface-2: #ECECE7;
    --line: #E1E1DB;
    --text: #1B1B1A;
    --dim: #6B6B65;
    --primary: #1B1B1A;
    --on-primary: #FFFFFF;
    --accent: #2B6CB0;
    --green: #2E9E6B;
    --red: #D64545;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --ic-deck: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'><rect x='6.5' y='4' width='11' height='16' rx='2.5'/><path d='M3 7.5v9M21 7.5v9'/></svg>");
    --ic-library: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><rect x='4' y='4' width='6.5' height='6.5' rx='1.5'/><rect x='13.5' y='4' width='6.5' height='6.5' rx='1.5'/><rect x='4' y='13.5' width='6.5' height='6.5' rx='1.5'/><rect x='13.5' y='13.5' width='6.5' height='6.5' rx='1.5'/></svg>");
    --ic-matches: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><path d='M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z'/></svg>");
    --ic-roulette: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><circle cx='12' cy='12' r='8.5'/><circle cx='12' cy='7.2' r='1.15' fill='black' stroke='none'/><circle cx='16.8' cy='12' r='1.15' fill='black' stroke='none'/><circle cx='12' cy='16.8' r='1.15' fill='black' stroke='none'/><circle cx='7.2' cy='12' r='1.15' fill='black' stroke='none'/></svg>");
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --surface: #1E1E1E; --surface-2: #2A2A2A; --line: #303030;
      --text: #EDEDEB; --dim: #9B9B95; --primary: #EDEDEB; --on-primary: #141414;
      --accent: #6EA8FE; --green: #3DBB84; --red: #F06B6B;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }

  .brand-sub { font-family: var(--font-mono); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--orange); line-height: 1; margin-bottom: 4px; white-space: nowrap; }
  .brand-sub::after { content: '_'; animation: blink 1s steps(2, start) infinite; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(19px, 5.8vw, 26px); margin: 0; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; white-space: nowrap;
    text-shadow: 2px 2px 0 #000, 4px 4px 0 var(--orange-dk); }
  .room-pill { font-family: var(--font-mono); font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim);
    display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--panel); border: 2px solid var(--line-hi); box-shadow: 3px 3px 0 #000; white-space: nowrap; cursor: pointer; flex: none; }
  .room-pill b { color: var(--yellow); font-weight: 400; letter-spacing: 0.12em; }
  .hazard { height: 8px; margin: 0 20px; background: var(--hazard); border: 2px solid #000; }
  @keyframes blink { to { visibility: hidden; } }

  .players-row { padding: 8px 20px 4px; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
  .player { display: flex; flex-direction: row; align-items: center; gap: 5px; flex: none; padding-right: 8px; }
  .player svg { width: 30px; height: 30px; display: block; }
  .player span { font-family: var(--font-mono); font-size: 17px; line-height: 1; color: var(--dim); max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player.off { opacity: 0.5; filter: grayscale(0.6); }
  .toggle-playing { margin-left: auto; font-family: var(--font-mono); font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; flex: none; cursor: pointer; user-select: none; align-self: center; }
  .switch { width: 42px; height: 22px; background: var(--panel); border: 2px solid var(--line-hi); position: relative; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--dim); }
  .switch.on { background: #0F3A1E; border-color: var(--green); }
  .switch.on::after { transform: translateX(20px); background: var(--green); }

  main { flex: 1; padding: 0 20px 8px; display: flex; flex-direction: column; min-height: 0; }

  .info-box { background: var(--panel); border: 2px solid var(--line-hi); border-left: 6px solid var(--orange); padding: 14px 16px; font-family: var(--font-mono); font-size: 20px; color: var(--dim); line-height: 1.2; box-shadow: 4px 4px 0 #000; }
  .info-box strong { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--orange); }
  .info-box em { color: var(--yellow); font-style: normal; }
  .hint { font-family: var(--font-mono); font-size: 19px; color: var(--dim); line-height: 1.15; }
  .hint b { color: var(--yellow); font-weight: 400; }

  /* ---------- Paquet de cartes ---------- */
  .deck-progress { width: 100%; max-width: 320px; align-self: center; margin-bottom: 8px; font-family: var(--font-mono); font-size: 18px; color: var(--dim); display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
  .deck-progress .bar { flex: 1; height: 14px; border: 2px solid var(--line-hi); background: var(--panel); position: relative; }
  .deck-progress .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, var(--orange) 0 6px, transparent 6px 8px); }
  .deck-progress span { flex: none; }

  .deck-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; position: relative; }
  .deck-stack { position: relative; width: min(100%, 320px, max(150px, calc((100vh - var(--stack-off) - var(--extra-off, 0px)) * 0.75))); width: min(100%, 320px, max(150px, calc((100dvh - var(--stack-off) - var(--extra-off, 0px)) * 0.75))); aspect-ratio: 3 / 4; }
  .swipe-card {
    position: absolute; inset: 0; background: #0A0C10; border: 3px solid var(--orange);
    box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.75);
    overflow: hidden; touch-action: none; will-change: transform; cursor: grab;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .swipe-card:active { cursor: grabbing; }
  @keyframes cardPopIn { from { transform: scale(.94) translateY(16px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .swipe-card.card-enter { animation: cardPopIn .4s steps(6, end) backwards; }

  .bk { position: absolute; width: 22px; height: 22px; z-index: 4; pointer-events: none; border: 0 solid var(--yellow); }
  .bk.tl { top: 12px; left: 12px; border-top-width: 3px; border-left-width: 3px; }
  .bk.tr { top: 12px; right: 12px; border-top-width: 3px; border-right-width: 3px; }
  .bk.bl { bottom: 12px; left: 12px; border-bottom-width: 3px; border-left-width: 3px; }
  .bk.br { bottom: 12px; right: 12px; border-bottom-width: 3px; border-right-width: 3px; }
  .hud { position: absolute; z-index: 4; font-family: var(--font-mono); font-size: 17px; line-height: 1.1; letter-spacing: 0.06em; color: #fff; background: rgba(8, 10, 14, 0.78); padding: 1px 7px; pointer-events: none; text-transform: uppercase; white-space: nowrap; }
  .hud.tl { top: 16px; left: 38px; }
  .hud.tr { top: 16px; right: 38px; }
  .hud.rec::before { content: '●'; color: var(--red); margin-right: 6px; animation: blink 1.2s steps(2, start) infinite; }

  .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cover::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px),
      radial-gradient(rgba(0,0,0,0.22) 1px, transparent 1.3px) 0 0 / 4px 4px,
      linear-gradient(to top, rgba(6, 8, 12, 0.6), transparent 30%),
      radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, 0.35)); }
  .cover-blob { position: absolute; width: 75%; padding-top: 75%; border-radius: 50%; background: rgba(255, 255, 255, 0.13); }
  .cover-emoji { font-size: 64px; text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55); }
  .cover-emoji.sm { font-size: 18px; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5); }
  .grid-cover .cover-emoji.sm { font-size: 32px; }
  .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0A0C10; pointer-events: none; -webkit-user-drag: none; user-select: none; }

  @keyframes stampPunchYes { 0% { transform: rotate(7deg) scale(.5); opacity: 0; } 55% { transform: rotate(7deg) scale(1.18); opacity: 1; } 100% { transform: rotate(7deg) scale(1); opacity: 1; } }
  @keyframes stampPunchNo { 0% { transform: rotate(-7deg) scale(.5); opacity: 0; } 55% { transform: rotate(-7deg) scale(1.18); opacity: 1; } 100% { transform: rotate(-7deg) scale(1); opacity: 1; } }
  .stamp.yes.punch { animation: stampPunchYes .45s steps(7, end) both; }
  .stamp.no.punch { animation: stampPunchNo .45s steps(7, end) both; }
  .swipe-card .stamp { position: absolute; top: 58px; z-index: 6; font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: 0.06em; padding: 2px 14px; border: 4px solid currentColor; background: rgba(6, 8, 12, 0.8); opacity: 0; pointer-events: none; }
  .swipe-card .stamp.yes { left: 22px; color: var(--green); transform: rotate(-8deg); }
  .swipe-card .stamp.no { right: 22px; color: var(--red); transform: rotate(8deg); }

  .card-caption { width: 100%; max-width: 320px; margin-top: 12px; text-align: left; background: var(--panel); border: 2px solid var(--line-hi); border-top: 4px solid var(--yellow); box-shadow: 4px 4px 0 #000; padding: 8px 12px 9px; }
  .card-caption .name { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.1; color: var(--text); }
  .card-caption .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; min-width: 0; }
  .card-caption .tag { flex: none; font-family: var(--font-mono); font-size: 17px; line-height: 1; letter-spacing: 0.05em; text-transform: uppercase; color: #1A1400; background: var(--yellow); padding: 2px 8px 1px; }
  .card-caption .added-by { font-family: var(--font-mono); font-size: 19px; color: var(--dim); line-height: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .deck-actions { display: flex; gap: 22px; align-items: center; justify-content: center; margin-top: 12px; padding-bottom: 4px; }
  .round-btn { width: 78px; height: 52px; border: 3px solid #000; background: var(--red); color: #fff; font-family: var(--font-display); font-size: 30px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--bevel), 4px 4px 0 #000; }
  .round-btn:active { transform: translate(3px, 3px); box-shadow: var(--bevel), 1px 1px 0 #000; }
  .round-btn.yes { width: 108px; background: var(--green); color: #06210F; }

  /* ---------- Boutons, titres, formulaires ---------- */
  .section-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0; color: var(--orange); }
  .section-title::before { content: '> '; color: var(--yellow); }
  .section-title.ornate { margin: 20px 0 10px; padding-bottom: 8px; border-bottom: 4px solid #000; box-shadow: 0 2px 0 var(--line-hi); }
  .btn { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; padding: 12px 12px; border: 3px solid #000; background: var(--panel-2); color: var(--text); cursor: pointer;
    box-shadow: var(--bevel), 4px 4px 0 #000; line-height: 1.1; }
  .btn:active { transform: translate(3px, 3px); box-shadow: var(--bevel), 1px 1px 0 #000; }
  .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
  .btn-primary { background: var(--orange); color: #1A1000; }
  .btn-ghost { background: var(--panel-2); color: var(--text); }
  .btn-row { display: flex; gap: 12px; }
  .btn-row .btn { flex: 1; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .link-btn { background: none; border: none; padding: 8px 0 2px; font-family: var(--font-mono); font-size: 19px; color: var(--dim); text-decoration: underline; text-decoration-color: var(--orange); text-underline-offset: 3px; cursor: pointer; text-align: left; }

  .view-toggle { display: flex; gap: 6px; flex: none; }
  .view-toggle button { background: var(--panel-2); border: 2px solid #000; color: var(--dim); padding: 3px 9px; font-size: 16px; line-height: 1.2; cursor: pointer; box-shadow: var(--bevel), 2px 2px 0 #000; }
  .view-toggle button.active { background: var(--orange); color: #1A1000; }
  .icon-btn { background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px; display: flex; align-items: center; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.danger { color: var(--red); }

  .inline-form { background: var(--panel); border: 2px solid var(--line-hi); box-shadow: 4px 4px 0 #000; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .inline-form input[type=text], .inline-form textarea { background: #0A0D11; border: 2px solid var(--line-hi); border-radius: 0; padding: 10px 12px; color: var(--text); font-family: var(--font-display); font-size: 16px; font-weight: 500; outline: none; width: 100%; caret-color: var(--orange); }
  .inline-form textarea { min-height: 110px; resize: vertical; }
  .inline-form input::placeholder, .inline-form textarea::placeholder { color: #566273; }
  .inline-form input:focus, .inline-form textarea:focus { border-color: var(--orange); }

  .import-preview { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
  .import-row { display: flex; align-items: center; gap: 10px; background: #0A0D11; border: 2px solid var(--line); padding: 7px 10px; font-size: 15px; }
  .import-row input[type=checkbox] { accent-color: var(--orange); width: 16px; height: 16px; flex: none; }
  .import-row .ir-name { flex: 1; line-height: 1.15; min-width: 0; }
  .import-row .ir-meta { font-family: var(--font-mono); font-size: 17px; color: var(--yellow); flex: none; }
  .import-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Bibliothèque ---------- */
  .game-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .game-row { background: var(--panel); border: 2px solid var(--line); box-shadow: 3px 3px 0 #000; padding: 8px 10px; display: flex; align-items: center; gap: 12px; }
  .g-cover { width: 42px; height: 42px; flex: none; position: relative; overflow: hidden; border: 2px solid #000; outline: 2px solid var(--line-hi); display: flex; align-items: center; justify-content: center; }
  .g-main { flex: 1; min-width: 0; }
  .g-name { font-weight: 600; font-size: 16px; line-height: 1.1; }
  .g-by { font-family: var(--font-mono); font-size: 17px; color: var(--dim); margin-top: 2px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-tag { font-family: var(--font-mono); font-size: 16px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #1A1400; background: var(--yellow); padding: 2px 6px 1px; flex: none; }

  .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; margin-top: 12px; }
  .grid-item { display: flex; flex-direction: column; gap: 6px; }
  .grid-cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border: 3px solid #000; outline: 2px solid var(--line-hi); box-shadow: 4px 4px 0 #000; display: flex; align-items: center; justify-content: center; }
  .grid-del { position: absolute; top: 4px; right: 4px; z-index: 6; width: 22px; height: 22px; background: rgba(8, 10, 14, 0.85); color: var(--text); border: 2px solid var(--line-hi); font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .grid-name { font-size: 14px; font-weight: 600; text-align: center; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .grid-by { font-family: var(--font-mono); font-size: 16px; color: var(--dim); text-align: center; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Matchs ---------- */
  .match-list { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .match-row { background: var(--panel); border: 2px solid var(--line); box-shadow: 3px 3px 0 #000; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
  .match-row.full { border-color: var(--orange); box-shadow: 4px 4px 0 #000, 0 0 0 2px #000; background: linear-gradient(90deg, rgba(255, 154, 31, 0.14), var(--panel) 60%); }
  .match-row .m-body { flex: 1; min-width: 0; }
  .match-row .m-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.12; }
  .match-row .m-score { font-family: var(--font-mono); font-size: 18px; color: var(--dim); margin-top: 3px; line-height: 1.05; }
  .match-row .m-badge { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #1A1400; background: var(--yellow); border: 2px solid #000; padding: 3px 7px; flex: none; transform: rotate(3deg); }

  /* ---------- Navigation ---------- */
  nav.tabbar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 78%, transparent); }
  nav.tabbar .tab { flex: 1; text-align: center; padding: 4px 4px 4px; color: var(--dim); cursor: pointer; background: var(--panel-2); border: 3px solid #000; box-shadow: inset 0 3px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(0,0,0,.35), 3px 3px 0 #000; }
  nav.tabbar .tab.active { background: var(--orange); color: #1A1000; box-shadow: var(--bevel), 3px 3px 0 #000; }
  nav.tabbar .tab .ic { font-size: 16px; display: block; line-height: 1.05; }
  nav.tabbar .tab .lb { font-family: var(--font-display); font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px; display: block; }

  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) translateY(-10px); background: var(--panel); border: 3px solid var(--orange); box-shadow: 4px 4px 0 #000; color: var(--text); padding: 7px 14px; font-family: var(--font-mono); font-size: 20px; line-height: 1.1; opacity: 0; transition: opacity .15s steps(3, end), transform .15s steps(3, end); pointer-events: none; z-index: 50; max-width: 90%; text-align: left; }
  .toast::before { content: '> '; color: var(--orange); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(90% 38% at 50% -8%, rgba(255, 154, 31, 0.2), transparent 70%), var(--bg); }
  .gate .box { max-width: 340px; width: 100%; text-align: left; background: var(--panel); border: 3px solid var(--line-hi); box-shadow: 6px 6px 0 #000; padding: 0 20px 22px; }
  .gate .box::before { content: ''; display: block; height: 10px; margin: 0 -20px 18px; background: var(--hazard); border-bottom: 2px solid #000; }
  .gate h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; text-transform: uppercase; margin: 0 0 10px; text-shadow: 2px 2px 0 #000, 4px 4px 0 var(--orange-dk); }
  .gate p { color: var(--dim); font-family: var(--font-mono); font-size: 20px; line-height: 1.1; margin: 0 0 16px; }
  .gate input { width: 100%; background: #0A0D11; border: 2px solid var(--line-hi); border-radius: 0; padding: 11px 12px; font-size: 16px; margin-bottom: 12px; color: var(--text); font-family: var(--font-display); font-weight: 500; outline: none; caret-color: var(--orange); }
  .gate input:focus { border-color: var(--orange); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(4, 6, 9, 0.75); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
  .modal-box { background: var(--panel); border: 3px solid var(--line-hi); box-shadow: 6px 6px 0 #000; padding: 0 20px 20px; max-width: 330px; width: 100%; }
  .modal-box::before { content: ''; display: block; height: 10px; margin: 0 -20px 16px; background: var(--hazard); border-bottom: 2px solid #000; }
  .modal-box p { font-family: var(--font-mono); font-size: 22px; line-height: 1.1; margin: 0 0 16px; }

  @media (prefers-reduced-motion: reduce) {
    .brand-sub::after, .hud.rec::before { animation: none; }
    .swipe-card.card-enter { animation: none; }
  }

  /* ---- éléments communs aux thèmes ---- */
  .rule { display: none; }
  .orn { display: none; }
  .head-right { display: flex; align-items: stretch; flex: none; }
  .theme-btn { width: 30px; background: var(--panel); border: 2px solid var(--line-hi); border-right: none; color: var(--orange); font-size: 15px; line-height: 1; cursor: pointer; padding: 0; }
  nav.tabbar .tab[data-tab=deck] .ic::before { content: '\25C8'; }
  nav.tabbar .tab[data-tab=library] .ic::before { content: '\25A4'; }
  nav.tabbar .tab[data-tab=matches] .ic::before { content: '\2605'; }
  nav.tabbar .tab[data-tab=roulette] .ic::before { content: '\29BE'; }

  /* ---- Description du jeu ---- */
  :root { --page-dur: .28s; --page-ease: steps(6, end); --page-shift: 18px; --swap-dur: .24s; --swap-ease: steps(5, end); }
  .info-card { background: var(--panel); border: 2px solid var(--line-hi); border-top: 4px solid var(--yellow); box-shadow: 4px 4px 0 #000; padding: 12px 16px 14px; }
  .info-kicker { font-family: var(--font-mono); font-size: 18px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--orange); line-height: 1; }
  .info-kicker::before { content: '> Fiche article'; }
  .info-title { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.12; margin: 8px 0 10px; }
  .info-desc { font-family: var(--font-mono); font-size: 20px; line-height: 1.1; color: var(--text); margin: 0 0 10px; }
  .info-desc.dim { color: var(--dim); }
  .info-genres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .info-genres span { font-family: var(--font-mono); font-size: 17px; line-height: 1; text-transform: uppercase; color: #1A1400; background: var(--yellow); padding: 2px 7px 1px; }
  .info-meta { font-family: var(--font-mono); font-size: 18px; color: var(--dim); line-height: 1.05; }
  .info-src { font-family: var(--font-mono); font-size: 17px; color: var(--dim); margin-top: 10px; padding-top: 8px; border-top: 2px solid var(--line); }
  .info-skel i { border-radius: 0; }
  .card-caption .desc { font-family: var(--font-mono); font-size: 18px; line-height: 1.05; color: var(--dim); margin-top: 6px; }
  .info-btn { margin-left: auto; flex: none; width: 24px; height: 24px; padding: 0; border: 2px solid #000; background: var(--yellow); color: #1A1400; font: 700 14px/1 var(--font-display); box-shadow: 2px 2px 0 #000; cursor: pointer; }
  .game-row.focused, .match-row.focused { border-color: var(--orange); }
  .grid-item.focused .grid-cover { outline-color: var(--orange); }

  /* ---- Roulette : habillage R.E.P.O. ---- */
  .roul-track-outer { background: var(--panel); border: 2px solid var(--line-hi); box-shadow: 4px 4px 0 #000; }
  .roul-marker { background: var(--orange); } .roul-marker::before { border-bottom-color: var(--orange); } .roul-marker::after { border-top-color: var(--orange); }

// Noms : comparaison tolérante (casse, accents, ™ ®, ponctuation)
// pour reconnaître le même jeu ajouté par deux personnes.
// ---------------------------------------------------------------
function normName(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[™®©'’`]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function addedOwnersOf(g) {
  const out = [];
  const add = n => { if (n && !out.some(o => normName(o) === normName(n))) out.push(n); };
  add(g.addedBy);
  (Array.isArray(g.addedByList) ? g.addedByList : []).forEach(add);
  return out;
}
function ownersOf(g) {
  const out = addedOwnersOf(g);
  // Possession réelle : joueurs ayant lié leur Steam et possédant cet appid,
  // même s'ils ne l'ont pas personnellement ajouté à la bibliothèque.
  if (g.appid) {
    State.players.forEach(p => {
      if (Array.isArray(p.ownedAppIds) && p.ownedAppIds.includes(g.appid) && !out.some(o => normName(o) === normName(p.name))) out.push(p.name);
    });
  }
  return out;
}
function findExisting(name, appid) {
  const n = normName(name);
  return State.games.find(g =>
    (appid && g.appid && String(g.appid) === String(appid)) || normName(g.name) === n
  );
}

  { match: /puzzle|r[ée]flexion/, emoji: '🧩', c1: '#22D3EE', c2: '#083344' },
];
const HASH_FAMILIES = [
  { emoji: '🎮', c1: '#5B8DEF', c2: '#16264F' },
  { emoji: '🎲', c1: '#E5484D', c2: '#4A1215' },
  { emoji: '🕹️', c1: '#A78BFA', c2: '#2A1B5B' },
  { emoji: '🎯', c1: '#35C48D', c2: '#0E3B2B' },
  { emoji: '⚔️', c1: '#F59E0B', c2: '#4A2A00' },
  { emoji: '🧭', c1: '#22D3EE', c2: '#083344' },
];
function hashNum(str) { let h=0; for (let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function coverFamilyFor(game) {
  const tag = (game.tag || '').toLowerCase();
  const found = COVER_FAMILIES.find(f => f.match.test(tag));
  if (found) return found;
  return HASH_FAMILIES[hashNum(game.name || 'x') % HASH_FAMILIES.length];
}
function coverHtml(game, opts) {
  opts = opts || {};
  const fam = coverFamilyFor(game);
  const seed = hashNum(game.name || 'x');
  const p1 = 15 + (seed % 55), p2 = 15 + ((seed >> 5) % 55);
  const base = '<div class="cover" style="background:linear-gradient(155deg,'+fam.c1+','+fam.c2+');">' +
    '<div class="cover-blob" style="left:'+p1+'%; top:-25%;"></div>' +
    '<div class="cover-blob" style="right:'+p2+'%; bottom:-30%;"></div>' +
    '<span class="cover-emoji'+(opts.small ? ' sm' : '')+'">'+fam.emoji+'</span>';
  if (game.coverUrl) {
    // Image par-dessus le visuel de secours ; si elle ne charge pas, on essaie
    // l'image de repli, puis on la retire pour laisser voir le dégradé + l'icône.
    const fallback = game.coverFallback || '';
    return base +
      '<img class="cover-img" src="'+escapeHtml(game.coverUrl)+'" alt="" loading="lazy" draggable="false" ' +
      'data-fallback="'+escapeHtml(fallback)+'" ' +
      'onerror="if(this.dataset.fallback && this.src!==this.dataset.fallback){this.src=this.dataset.fallback;}else{this.remove();}">' +
      '</div>';
  }
  return base + '</div>';
}
async function fetchSteamCover(name) {
  try {
    const r = await fetch('/api/steam-cover?name=' + encodeURIComponent(name));
    if (!r.ok) return null;
    const data = await r.json();
    if (data && data.found) return { image: data.image, fallbackImage: data.fallbackImage, appid: data.appid };
    return null;
  } catch (e) { return null; }
}
async function fetchSteamLibrary(profile) {
  let data = null, ok = false;
  try {
    const r = await fetch('/api/steam-library?profile=' + encodeURIComponent(profile));
    ok = r.ok;
    data = await r.json();
  } catch (e) { throw { code: 'network' }; }
  if (!ok || !data || data.error) throw { code: (data && data.error) || 'network' };
  return data;
}
async function fetchSteamInfo(appid) {
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const r = await fetch('/api/steam-info?appid=' + encodeURIComponent(appid));
      if (r.ok) {
        const d = await r.json();
        if (d && (d.found || typeof d.multiplayer === 'boolean')) return d;
        if (attempt < 2) { await new Promise(res => setTimeout(res, 400 * (attempt + 1))); continue; }
        return d;
      }
    } catch (e) {}
    if (attempt < 2) await new Promise(res => setTimeout(res, 400 * (attempt + 1)));
  }
  return null;
}
function steamErrorMessage(code) {
  switch (code) {
    case 'no_key': return 'Le site n\'a pas encore de clé Steam : ajoute la variable STEAM_API_KEY sur Vercel (voir le guide), puis redéploie.';
    case 'bad_key': return 'La clé Steam configurée sur le site est refusée. Vérifie-la sur Vercel.';
    case 'private': return 'Steam ne renvoie aucun jeu : ton profil (ou « Détails du jeu ») est probablement en privé. Passe-le en Public, puis réessaie.';
    case 'not_found': return 'Profil introuvable. Vérifie le lien, le pseudo ou l\'ID.';
    default: return 'Impossible de joindre Steam pour le moment. Réessaie dans un instant.';
  }
}
async function runPool(tasks, n) {
  let i = 0;
  const workers = Array.from({ length: Math.min(n, tasks.length) }, async () => {
    while (i < tasks.length) { const t = tasks[i++]; try { await t(); } catch (e) {} }
  });
  await Promise.all(workers);
}

const State = { games: [], swipes: [], players: [], room: {} };
const listeners = [];
function onChange(fn) { listeners.push(fn); }
function emit() { listeners.forEach(fn => fn()); }
function isHost() { return !!(State.room && State.room.hostId && State.room.hostId === myId); }

// Le premier arrivé dans une salle en devient l'hôte (seul à pouvoir exclure).
async function ensureHost() {
  try {
    const snap = await roomRef().get();
    if (!snap.exists) await roomRef().set({ hostId: myId, createdAt: Date.now() });
  } catch (e) {}
}

let unsubs = [];
function stopListening() { unsubs.forEach(u => { try { u && u(); } catch (e) {} }); unsubs = []; }

let myEverSeen = false;
function startListening() {
  stopListening();
  myEverSeen = false;
  unsubs.push(roomRef().onSnapshot(snap => { State.room = snap.exists ? snap.data() : {}; emit(); }));
  unsubs.push(gamesCol().orderBy('ts', 'asc').onSnapshot(snap => {
    State.games = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    emit();
  }));
  unsubs.push(swipesCol().onSnapshot(snap => {
    State.swipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    emit();
  }));
  unsubs.push(playersCol().onSnapshot(snap => {
    State.players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const stillHere = State.players.some(p => p.id === myId);
    if (stillHere) myEverSeen = true;
    else if (myEverSeen) { handleKicked(); return; }
    emit();
  }));
}

// les deux mêmes personnes. Comme Firestore (mode compat) ne sait pas faire

function friendshipsCol() { return db.collection('friendships'); }
function invitationsCol() { return db.collection('roomInvitations'); }
function friendshipId(u1, u2) { return [u1, u2].sort().join('_'); }

let myFriendDocs = [];      // toutes les amitiés (acceptées ou en attente) qui me concernent
let myInvitations = [];     // invitations de salle en attente reçues
let friendsUnsubs = [];
function stopFriendsListening() { friendsUnsubs.forEach(u => { try { u(); } catch (e) {} }); friendsUnsubs = []; }
function startFriendsListening() {
  stopFriendsListening();
  if (!authUser) return;
  const merge = (side, snap) => {
    myFriendDocs = myFriendDocs.filter(d => d._side !== side).concat(snap.docs.map(d => ({ id: d.id, _side: side, ...d.data() })));
    refreshReactiveScreens();
  };
  friendsUnsubs.push(friendshipsCol().where('a', '==', authUser.uid).onSnapshot(s => merge('a', s), () => {}));
  friendsUnsubs.push(friendshipsCol().where('b', '==', authUser.uid).onSnapshot(s => merge('b', s), () => {}));
  friendsUnsubs.push(invitationsCol().where('receiverId', '==', authUser.uid).onSnapshot(snap => {
    myInvitations = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(i => i.status === 'pending');

}
function acceptedFriends() {

    .map(f => ({ friendshipId: f.id, uid: f.a === authUser.uid ? f.b : f.a, name: f.a === authUser.uid ? f.bName : f.aName }));
}
function incomingRequests() {

function hasPendingOrAccepted(otherUid) {

// Présence « au mieux » : Firestore seul ne peut pas détecter une vraie
// déconnexion (pas de onDisconnect comme la Realtime Database) -- on écrit
// donc l'état à chaque action significative, et on considère « hors ligne »
// tout ce qui n'a pas bougé depuis plus de 10 minutes, côté affichage.
function setPresence(patch) {
  if (!authUser) return Promise.resolve();
  return usersCol().doc(authUser.uid).set({ presence: Object.assign({ updatedAt: Date.now() }, patch) }, { merge: true }).catch(() => {});
}
function presenceLabel(p) {
  if (!p || !p.updatedAt || Date.now() - p.updatedAt > 10 * 60 * 1000) return { dot: '⚪', text: 'Hors ligne' };
  if (p.state === 'in-room' && p.roomName) return { dot: '🟡', text: 'Dans « ' + p.roomName + ' »' };
  return { dot: '🟢', text: 'En ligne' };
}

function authErrorMessage(e) {
  switch (e && e.code) {
    case 'auth/email-already-in-use': return 'Ce pseudo est déjà pris — choisis-en un autre, ou connecte-toi.';
    case 'auth/invalid-email': return 'Ce pseudo contient des caractères non gérés — essaie avec des lettres/chiffres.';
    case 'auth/weak-password': return 'Mot de passe trop court (6 caractères minimum).';
    case 'auth/wrong-password': case 'auth/invalid-credential': case 'auth/invalid-login-credentials': return 'Pseudo ou mot de passe incorrect.';
    case 'auth/user-not-found': return 'Aucun compte ne correspond à ce pseudo.';
    case 'auth/too-many-requests': return 'Trop de tentatives — réessaie dans un instant.';
    case 'auth/network-request-failed': return 'Problème de connexion — réessaie.';
    default: return 'Une erreur est survenue. Réessaie.';
  }
}
// Un pseudo doit être valide pour Firebase Auth sans jamais être demandé/affiché
// comme un e-mail : on le transforme en une adresse interne stable et unique,
// ce qui donne aussi l'unicité du pseudo « gratuitement » (Firebase refuse les
// doublons d'e-mail). Le pseudo affiché, lui, garde sa casse d'origine.
function usernameToLoginEmail(name) {
  let slug = String(name || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '');
  if (!slug) { let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; slug = 'joueur-' + h.toString(36); }
  return slug + '@joueurs.gamenight.local';
}

function renderAuthScreen(el, mode) {
  const isSignup = mode === 'signup';
  const box = gateShell(el);
  box.innerHTML =
    '<div class="brand-sub">' + THEMES[theme].sub + '</div>' +
    '<h2>' + (isSignup ? 'Créer un compte' : 'Se connecter') + '</h2>' +
    '<div class="form-error" id="authErr"></div>' +
    '<input type="text" id="afName" placeholder="Pseudo" autocomplete="username" maxlength="24">' +
    '<input type="password" id="afPass" placeholder="Mot de passe' + (isSignup ? ' (6 caractères min.)' : '') + '" autocomplete="' + (isSignup ? 'new-password' : 'current-password') + '">' +
    '<button class="btn btn-primary" id="afGo" style="width:100%;">' + (isSignup ? 'Créer mon compte' : 'Se connecter') + '</button>' +
    '<button class="link-btn" id="afSwitch" style="display:block;margin:14px auto 0;">' + (isSignup ? 'Déjà un compte ? Se connecter' : 'Pas de compte ? En créer un') + '</button>' +
    '<button class="link-btn" id="afBack" style="display:block;margin:6px auto 0;">← Retour</button>';
  const err = box.querySelector('#authErr');
  box.querySelector('#afBack').onclick = () => showScreen('home');
  box.querySelector('#afSwitch').onclick = () => showScreen(isSignup ? 'login' : 'signup');
  const btn = box.querySelector('#afGo');
  const submit = () => {
    err.textContent = '';
    const name = box.querySelector('#afName').value.trim();
    const pass = box.querySelector('#afPass').value;
    if (!name) { err.textContent = 'Choisis un pseudo.'; return; }
    if (name.length < 2) { err.textContent = 'Pseudo trop court (2 caractères minimum).'; return; }
    if (!pass) { err.textContent = 'Entre ton mot de passe.'; return; }
    if (isSignup && pass.length < 6) { err.textContent = 'Mot de passe trop court (6 caractères minimum).'; return; }
    const loginEmail = usernameToLoginEmail(name);
    btn.disabled = true; btn.textContent = isSignup ? 'Création…' : 'Connexion…';
    const done = () => { btn.disabled = false; btn.textContent = isSignup ? 'Créer mon compte' : 'Se connecter'; };
    if (isSignup) {
      auth.createUserWithEmailAndPassword(loginEmail, pass).then(cred => {
        const profile = { username: name, createdAt: Date.now() };
        return usersCol().doc(cred.user.uid).set(profile)
          .then(() => db.collection('usernames').doc(name.toLowerCase()).set({ uid: cred.user.uid, username: name }))
          .then(() => { myProfile = profile; });
      }).then(() => {
        startPersonalListening();
        startFriendsListening();
        showHub('home');
      }).catch(e => { err.textContent = authErrorMessage(e); done(); });
    } else {
      auth.signInWithEmailAndPassword(loginEmail, pass).catch(e => { err.textContent = authErrorMessage(e); done(); });
      // succès : onAuthStateChanged prend le relais et ouvre le profil.
    }
  };
  btn.onclick = submit;
  box.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
}

  const content = document.getElementById('hubContent');
  if (!content) return;
  document.querySelectorAll('.hub-nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.section === hubSection);
    const old = b.querySelector('.badge'); if (old) old.remove();
    const n = b.dataset.section === 'friends' ? incomingRequests().length : 0;

  });
  const bell = document.getElementById('hubBell');
  if (bell) bell.innerHTML = '🔔' + (myInvitations.length ? '<span class="dot"></span>' : '');
  content.innerHTML = '';
  if (hubSection === 'home') buildHubHome(content);
  else if (hubSection === 'games') buildHubGames(content);
  else if (hubSection === 'friends') renderFriendsSection(content);
  else if (hubSection === 'rooms') buildHubRooms(content);
  else if (hubSection === 'themes') buildHubThemes(content);
  else if (hubSection === 'history') buildHubHistory(content);
  else if (hubSection === 'settings') buildHubSettings(content);
}

async function joinRoomAsAccount(code) {
  myId = authUser.uid;
  localStorage.setItem('gn_uid', myId);
  const gamesToImport = myPersonalGames.slice();
  await joinRoom(code, (myProfile && myProfile.username) || 'Joueur·euse');
  showScreen(null);
  if (gamesToImport.length) {
    // L'abonnement temps réel démarré par joinRoom() n'a pas forcément livré
    // son premier instantané : on va chercher l'état actuel une fois, pour
    // que la détection de doublon (findExisting) ne rate pas un jeu déjà
    // présent et n'en crée pas une copie.
    try {
      const snap = await gamesCol().get();
      State.games = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    } catch (e) {}
    importGames(gamesToImport.map(g => ({
      name: g.name, tag: g.tag, appid: g.appid, image: g.coverUrl, fallbackImage: g.coverFallback,
      desc: g.desc, genres: g.genres, dev: g.dev, released: g.released, multiplayer: g.multiplayer,
    }))).then(r => { if (r.added || r.merged) toast('Tes jeux personnels ont été ajoutés à la salle.'); }).catch(() => {});
  }
}

async function addPersonalGame(name, tag) {
  name = name.trim(); if (!name || !authUser) return;
  if (myPersonalGames.some(g => normName(g.name) === normName(name))) { toast('Déjà dans tes jeux.'); return; }
  const ref = await personalGamesCol().add({ name, tag: (tag || 'Autre').trim() || 'Autre', ts: Date.now(), coverUrl: null, source: 'manual' });
  const found = await fetchSteamCover(name);
  if (found) ref.update({ coverUrl: found.image, coverFallback: found.fallbackImage, appid: found.appid || null }).catch(() => {});
}
async function removePersonalGame(id) { try { await personalGamesCol().doc(id).delete(); } catch (e) {} }

// ---- Import / synchro Steam vers la bibliothèque personnelle ----
// Volontairement séparé de importGames() (utilisé par les salons) : la
// bibliothèque personnelle n'a ni « addedByList » ni fusion multi-joueurs,
// juste un jeu qui appartient à un seul compte, avec sa provenance (source).
async function importPersonalGames(items) {
  const existing = new Set(myPersonalGames.map(g => normName(g.name)));
  const toAdd = items.filter(it => it.name && !existing.has(normName(it.name)));
  for (const it of toAdd) {
    try {
      await personalGamesCol().add({
        name: it.name.trim(), tag: it.tag || 'Steam', ts: Date.now(),
        coverUrl: it.image || null, coverFallback: it.fallbackImage || null, appid: it.appid || null, source: 'steam',
      });
    } catch (e) {}
  }
  return toAdd.length;
}
function showPersonalSteamLink(zone) {
  zone.innerHTML = '';
  const f = document.createElement('div'); f.className = 'inline-form';
  f.innerHTML =
    '<div class="hint">Colle le lien de ton profil Steam (ou ton pseudo, ou ton ID à 17 chiffres). Ton profil doit avoir <b>« Détails du jeu »</b> réglé sur <b>Public</b>.</div>' +
    '<input type="text" id="psInput" placeholder="steamcommunity.com/id/ton-pseudo" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div class="btn-row"><button class="btn btn-ghost" id="psCancel">Annuler</button><button class="btn btn-primary" id="psGo">Voir mes jeux</button></div>' +
    '<div class="hint" id="psStatus"></div>';
  zone.appendChild(f);
  const input = f.querySelector('#psInput'), go = f.querySelector('#psGo'), status = f.querySelector('#psStatus');
  f.querySelector('#psCancel').onclick = () => { zone.innerHTML = ''; };
  const run = async () => {
    const val = input.value.trim();
    if (!val) { toast('Colle le lien de ton profil Steam.'); return; }
    go.disabled = true; status.textContent = 'Connexion à Steam…';
    try {
      const data = await fetchSteamLibrary(val);
      await usersCol().doc(authUser.uid).set({ steamProfile: val, steamId: data.steamid }, { merge: true });
      myProfile = Object.assign({}, myProfile, { steamProfile: val, steamId: data.steamid });
      showPersonalSteamPreview(zone, data.games);
    } catch (e) {
      status.textContent = steamErrorMessage(e && e.code);
      go.disabled = false;
    }
  };
  go.onclick = run;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
}
function showPersonalSteamPreview(zone, games, onlyNew) {
  zone.innerHTML = '';
  const already = new Set(myPersonalGames.map(g => normName(g.name)));
  const pool = onlyNew ? games.filter(g => !already.has(normName(g.name))) : games;
  const box = document.createElement('div'); box.className = 'inline-form';
  if (!pool.length) {
    box.innerHTML = '<p>' + (onlyNew ? 'Aucun nouveau jeu depuis la dernière synchro.' : 'Aucun jeu trouvé sur ce compte Steam.') + '</p>';
    zone.appendChild(box);
    return;

// Ajout de jeux (manuel, collé ou Steam) avec fusion des doublons :
// si le jeu existe déjà, on ajoute simplement la personne à ceux qui le présentent.
async function importGames(items) {
  const FV = firebase.firestore.FieldValue;
  const seen = new Set();
  const pendingCovers = [];
  let added = 0, merged = 0, already = 0;
  let batch = db.batch(), ops = 0;
  const flush = async () => { if (ops) { await batch.commit(); batch = db.batch(); ops = 0; } };

  for (const it of items) {
    const key = normName(it.name);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    const existing = findExisting(it.name, it.appid);
    if (existing) {
      if (addedOwnersOf(existing).some(o => normName(o) === normName(myName))) { already++; continue; }
      const upd = { addedByList: FV.arrayUnion(myName) };
      if (!existing.coverUrl && it.image) { upd.coverUrl = it.image; upd.coverFallback = it.fallbackImage || null; }
      if (!existing.appid && it.appid) upd.appid = it.appid;
      if (!existing.infoTs && it.desc !== undefined) {
        upd.desc = it.desc || ''; upd.genres = it.genres || []; upd.dev = it.dev || ''; upd.released = it.released || '';
        upd.infoTs = Date.now();
      }
      if (existing.multiplayer === undefined && it.multiplayer !== undefined) upd.multiplayer = it.multiplayer;
      batch.update(gamesCol().doc(existing.id), upd);
      merged++;
    } else {
      const ref = gamesCol().doc();
      const doc = {
        name: it.name.trim(), tag: (it.tag || 'Autre').trim() || 'Autre',
        addedBy: myName, addedByList: [myName],
        ts: Date.now() + added,
        coverUrl: it.image || null, coverFallback: it.fallbackImage || null, appid: it.appid || null,
      };
      if (it.desc !== undefined) { doc.desc = it.desc || ''; doc.genres = it.genres || []; doc.dev = it.dev || ''; doc.released = it.released || ''; doc.infoTs = Date.now(); }
      if (it.multiplayer !== undefined) doc.multiplayer = it.multiplayer;
      batch.set(ref, doc);
      if (!it.image) pendingCovers.push({ ref, name: it.name });
      added++;
    }
    ops++;
    if (ops >= 400) await flush();
  }
  await flush();

  // Jeux sans jaquette (ajout manuel / liste collée) : on la cherche en arrière-plan.
  if (pendingCovers.length) {
    runPool(pendingCovers.map(p => async () => {
      const found = await fetchSteamCover(p.name);
      if (found) await p.ref.update({ coverUrl: found.image, coverFallback: found.fallbackImage, appid: found.appid || null });
    }), 4);
  }
  return { added, merged, already };
}
function summarizeImport(r) {
  const parts = [];
  if (r.added) parts.push(r.added + ' nouveau' + (r.added > 1 ? 'x' : ''));
  if (r.merged) parts.push(r.merged + ' déjà présent' + (r.merged > 1 ? 's' : '') + ' (tu es ajouté·e comme co-présentateur·rice)');
  if (r.already) parts.push(r.already + ' déjà à ton nom');
  return parts.length ? 'Import terminé : ' + parts.join(', ') + '.' : 'Rien à ajouter.';
}

// ---------------------------------------------------------------
// Filtre « multijoueur uniquement », valable partout (deck, bibliothèque,
// matchs) et mémorisé sur l'appareil. Un jeu confirmé solo est masqué ; un
// jeu pas encore vérifié reste visible le temps qu'on le vérifie en fond.
// ---------------------------------------------------------------
let libraryMpFilter = localStorage.getItem('gn_mp_filter') === '1';
let mpCoverageStarted = false;
function passesMpFilter(g) { return !libraryMpFilter || g.multiplayer !== false; }
function filteredGames() { return State.games.filter(passesMpFilter); }
function setLibraryMpFilter(on) {
  libraryMpFilter = on;
  localStorage.setItem('gn_mp_filter', on ? '1' : '0');
  if (on) ensureMultiplayerCoverage();
  renderMain(true);
}
// Vérifie en arrière-plan (concurrence volontairement faible, Steam limite le
// débit) tous les jeux de la bibliothèque dont le statut multijoueur est
// encore inconnu, pour que le filtre devienne complet au fil du temps.
async function ensureMultiplayerCoverage() {
  if (mpCoverageStarted) return;
  mpCoverageStarted = true;
  const todo = () => State.games.filter(g => g.multiplayer === undefined || g.multiplayer === null);
  let batch = todo();
  while (batch.length) {
    batch.forEach(g => { delete infoCache[g.id]; }); // ignore un éventuel cache déjà résolu mais périmé
    await runPool(batch.map(g => () => ensureInfo(g)), 2);
    const next = todo();
    if (next.length >= batch.length) break; // plus de progrès possible (échecs persistants)
    batch = next;
  }
  mpCoverageStarted = false;
}

const locallySwiped = new Set();

function activePlayers() { return State.players.filter(p => p.playing !== false); }
function myUnswiped() {
  const mine = new Set(State.swipes.filter(s => s.playerId === myId).map(s => s.gameId));
  return filteredGames().filter(g => !mine.has(g.id) && !locallySwiped.has(g.id));
}
function matchStats() {
  const denom = Math.max(activePlayers().length, 1);
  return filteredGames().map(g => {
    const likers = State.swipes.filter(s => s.gameId === g.id && s.liked);
    return { game: g, likers, count: likers.length, denom, full: likers.length >= denom && denom >= 2 };
  }).filter(m => m.count > 0).sort((a,b) => (b.count/b.denom) - (a.count/a.denom) || b.count - a.count);
}

// Import par copier-coller (nettoyage par règles, sans IA)
// ---------------------------------------------------------------
const MONTHS = 'janv|f[ée]vr|mars|avr|mai|juin|juil|ao[uû]t|sept|oct|nov|d[ée]c|jan|feb|mar|apr|jun|jul|aug|sep|nov|dec';
const JUNK_PATTERNS = [
  /^\d[\d.,\s]*\s*(hrs?|heures?|h|min(ute)?s?)\s*(on record|de jeu)?$/i,
  /^(aujourd.?hui|hier|demain)$/i,
  /(jouer|play game|installer|install|acheter|buy|voir|view|d[ée]tails|details|statistiques|stats|community hub|dlc|dans la biblioth[èe]que|in library|wishlist|liste de souhaits)/i,
  /(succ[èe]s|achievements?|trophées?|trophies|d[ée]bloqu[ée]|unlocked|obtenu(e|s)?|progression|compl[ée]t[ée])/i,
  /^\d{1,4}\s*\/\s*\d{1,4}$/,
  /^\d{1,3}\s*%$/,
  /(derni[èe]re? (partie|session|fois|lancement)|last (played|launched|session)|lanc[ée] pour la derni[èe]re fois|temps de jeu|playtime|il y a\s+\d|jours?\s+ago|\bago\b)/i,
  new RegExp('\\b\\d{1,2}\\s*(' + MONTHS + ')[a-zéû.]*\\s*\\d{0,4}\\b', 'i'),
  new RegExp('\\b(' + MONTHS + ')[a-zéû.]*\\s+\\d{4}\\b', 'i'),
  /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/,

];
const STEAM_UI_EXACT = new Set(['jeux','nom','evaluation','evaluations','categorie','categories','recherche','filtrer','trier par','played','mes stats de jeu','mon contenu de jeu','succes','temps de jeu','temps de jeu total','dernier lancement']);
const STEAM_UI_SUBSTRINGS = ['trouver un jeu','jeux suivis','tous les jeux','termines a 100','lances recemment','recemment lances','jeux termines','followed games','recently played','all games','find a game','temps de jeu','mes stats de jeu','mon contenu de jeu','dernier lancement'];
function normalizeForMatch(str) { return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[()\[\]]/g,' ').replace(/\d+/g,' ').replace(/[▲▼△▽:▶►]/g,' ').replace(/\s+/g,' ').trim(); }
function isSteamUiNoise(t) { const n = normalizeForMatch(t); if (!n) return true; if (STEAM_UI_EXACT.has(n)) return true; return STEAM_UI_SUBSTRINGS.some(s => n.includes(s)); }
function cleanupPastedList(raw) {
  const seen = new Set(); const out = []; let skippedHeader = false;
  raw.split('\n').forEach(line => {
    let t = line.replace(/\s+/g, ' ').trim();
    if (!t) return;
    if (!skippedHeader) { skippedHeader = true; return; }
    if (t.length < 2 || t.length > 60) return;
    if (isSteamUiNoise(t)) return;
    if (JUNK_PATTERNS.some(rx => rx.test(t))) return;
    const key = t.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key); out.push(t);
  });
  return out;
}

// ---------------------------------------------------------------
// Paquet de cartes façon « swipe » : les cartes sont déplacées en place
// (jamais reconstruites pendant un geste) et la suivante remonte en douceur.
// ---------------------------------------------------------------
const Deck = { stack: null, els: [], dragging: false, leaving: 0, dirty: false };
const VISIBLE = 3, DEPTH_SCALE = 0.045, DEPTH_Y = 10;

function depthTransform(depth, p) {
  const d = Math.max(depth - (p || 0), 0);
  return 'translate3d(0px,' + (d * DEPTH_Y).toFixed(2) + 'px,0) scale(' + (1 - d * DEPTH_SCALE).toFixed(4) + ')';
}
function pad2(n) { return String(n).padStart(2, '0'); }
function gameById(id) { return State.games.find(g => g.id === id) || null; }
function flushDirty() {
  if (Deck.dirty && !Deck.dragging && !Deck.leaving) { Deck.dirty = false; if (currentTab === 'deck') renderMain(); }
}

function buildCardEl(g) {
  const card = document.createElement('div');
  card.className = 'swipe-card';
  card.dataset.gid = g.id;
  card.dataset.cover = g.coverUrl || '';
  card.innerHTML = coverHtml(g) +
    '<i class="bk tl"></i><i class="bk tr"></i><i class="bk bl"></i><i class="bk br"></i>' +
    '<i class="orn tl"></i><i class="orn tr"></i><i class="orn bl"></i><i class="orn br"></i>' +
    '<div class="hud tl"></div><div class="hud tr rec">Rec</div>' +
    '<div class="stamp yes">OUI</div><div class="stamp no">NON</div>';
  attachSwipeGestures(card);
  return card;
}

// Place chaque carte selon sa profondeur (0 = dessus).
function layoutDeck(animate) {
  const total = State.games.length, done = total - myUnswiped().length;
  Deck.els.forEach((el, depth) => {
    el.style.zIndex = String(10 - depth);
    el.style.transformOrigin = '';
    el.style.transition = animate ? 'transform .32s cubic-bezier(.2,.8,.3,1)' : 'none';
    el.style.transform = depthTransform(depth);
    el.style.pointerEvents = depth === 0 ? 'auto' : 'none';
    el.classList.toggle('is-top', depth === 0);
    const hud = el.querySelector('.hud.tl'); if (hud) hud.textContent = '#' + pad2(done + depth + 1) + '/' + total;
    if (depth > 0) el.querySelectorAll('.stamp').forEach(st => { st.style.opacity = '0'; });
  });
}

// Met le paquet en phase avec les données, en ne touchant qu'à ce qui a changé.
function syncDeck(animate) {
  const want = myUnswiped().slice(0, VISIBLE);
  const prefixOk = Deck.els.length <= want.length && Deck.els.every((el, i) => el.dataset.gid === want[i].id);
  if (!prefixOk) {
    Array.from(Deck.stack.querySelectorAll('.swipe-card:not(.leaving)')).forEach(el => el.remove());
    Deck.els = [];
  }
  Deck.els.forEach((el, i) => {   // jaquette arrivée entre-temps
    const g = want[i];
    if (g && (el.dataset.cover || '') !== (g.coverUrl || '')) {
      el.dataset.cover = g.coverUrl || '';
      const c = el.querySelector('.cover'); if (c) c.outerHTML = coverHtml(g);
    }
  });
  const fresh = [];
  for (let i = Deck.els.length; i < want.length; i++) {
    const el = buildCardEl(want[i]);
    Deck.els.push(el); Deck.stack.appendChild(el); fresh.push(el);
  }
  layoutDeck(animate && prefixOk);
  if (prefixOk) fresh.forEach(el => {
    el.style.opacity = '0';
    requestAnimationFrame(() => { el.style.transition = 'transform .32s cubic-bezier(.2,.8,.3,1), opacity .3s ease'; el.style.opacity = '1'; });
  });
  updateProgress(); refreshCaption(); refreshInfo();
}

function updateProgress() {
  const el = document.querySelector('.deck-progress'); if (!el) return;
  const total = State.games.length, done = total - myUnswiped().length;
  const bar = el.querySelector('.bar i'), txt = el.querySelector('span');
  if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  if (txt) txt.textContent = done + ' / ' + total + ' vus';
}
function refreshCaption() {
  const cap = document.querySelector('.card-caption'); if (!cap || !Deck.els[0]) return;
  const top = gameById(Deck.els[0].dataset.gid); if (!top) return;
  const changed = cap.dataset.gid !== top.id;
  cap.dataset.gid = top.id;
  cap.querySelector('.name').textContent = top.name;
  cap.querySelector('.tag').textContent = top.tag || 'Jeu';
  cap.querySelector('.added-by').textContent = 'Présenté par : ' + presentedBy(top);
  if (changed) { cap.classList.remove('swap'); void cap.offsetWidth; cap.classList.add('swap'); }
}

function renderDeck(main) {
  const cards = myUnswiped();
  const live = Deck.stack && main.contains(Deck.stack);
  if (live && cards.length) {                       // vue déjà affichée : mise à jour en place
    if (Deck.dragging || Deck.leaving) { Deck.dirty = true; refreshInfo(); return; }
    syncDeck(false); return;
  }
  Deck.stack = null; Deck.els = [];
  main.innerHTML = '';
  if (!State.games.length) { main.appendChild(infoBox('Bibliothèque vide', 'Ajoute vos jeux dans l\'onglet <em>Bibliothèque</em> pour commencer à swiper.')); return; }

  noBtn.onclick = () => commitSwipe(false, { fromButton: true });
  const yesBtn = document.createElement('button'); yesBtn.className = 'round-btn yes'; yesBtn.textContent = '♥'; yesBtn.setAttribute('aria-label', 'Oui');
  yesBtn.onclick = () => commitSwipe(true, { fromButton: true });
  actions.appendChild(noBtn); actions.appendChild(yesBtn);

  Deck.stack = stack;

// Valide un swipe : la carte s'envole dans le sens du geste, la suivante remonte tout de suite.
function commitSwipe(liked, info) {
  info = info || {};
  const card = Deck.els[0];
  if (!card || card._leaving) return;
  card._leaving = true;
  card.classList.add('leaving'); card.classList.remove('is-top');
  card.style.pointerEvents = 'none'; card.style.zIndex = '30';
  Deck.els.shift(); Deck.leaving++;
  swipeGame(card.dataset.gid, liked);

  const dir = liked ? 1 : -1;
  const width = card.getBoundingClientRect().width;
  const endX = dir * (window.innerWidth + width) * 1.1;
  const endY = Math.max(-180, Math.min(180, (info.dy || 0) + (info.vy || 0) * 260)) + (info.fromButton ? -28 : 0);
  const endRot = dir * (info.fromButton ? 24 : 32);
  const speed = Math.abs(info.vx || 0);
  const dur = info.fromButton ? 420 : speed > 1.4 ? 240 : speed > 0.7 ? 300 : 360;

  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  (liked ? yes : no).style.opacity = '1'; (liked ? no : yes).style.opacity = '0';
  if (info.fromButton) {            // départ propre, dans la même famille de transformations
    card.style.transition = 'none'; card.style.transformOrigin = '50% 90%';
    card.style.transform = 'translate3d(0px,0px,0) rotate(0deg)';
  }
  void card.offsetWidth;
  card.style.transition = 'transform ' + dur + 'ms cubic-bezier(.25,.7,.35,1)';
  card.style.transform = 'translate3d(' + endX.toFixed(1) + 'px,' + endY.toFixed(1) + 'px,0) rotate(' + endRot + 'deg)';
  setTimeout(() => { card.remove(); Deck.leaving--; flushDirty(); }, dur + 60);

  if (currentTab === 'deck' && Deck.stack) {
    if (!myUnswiped().length) { Deck.dirty = true; refreshInfo(); }   // dernier jeu : l'écran de fin s'affiche après l'envol
    else syncDeck(true);
  }
}

function applyDrag(card, dx, dy, w) {
  const rot = Math.max(-24, Math.min(24, dx / w * 24));
  card.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';
  const p = Math.min(Math.abs(dx) / Math.max(70, w * 0.28), 1);
  card.querySelector('.stamp.yes').style.opacity = dx > 0 ? p.toFixed(2) : '0';
  card.querySelector('.stamp.no').style.opacity = dx < 0 ? p.toFixed(2) : '0';
  Deck.els.slice(1).forEach((el, i) => { el.style.transition = 'none'; el.style.transform = depthTransform(i + 1, p); });
}
function snapBack(card) {
  card.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
  card.style.transform = depthTransform(0);
  card.querySelectorAll('.stamp').forEach(st => { st.style.opacity = '0'; });
  Deck.els.slice(1).forEach((el, i) => { el.style.transition = 'transform .3s ease'; el.style.transform = depthTransform(i + 1); });
}

function attachSwipeGestures(card) {
  let pid = null, sx = 0, sy = 0, dx = 0, dy = 0, w = 300, samples = [];
  card.addEventListener('pointerdown', e => {
    if (card !== Deck.els[0] || card._leaving || pid !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; dy = 0;
    samples = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
    w = card.getBoundingClientRect().width || 300;
    Deck.dragging = true;
    card.style.transition = 'none'; card.style.transformOrigin = '50% 90%';
    try { card.setPointerCapture(pid); } catch (err) {}
  });
  card.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    const now = performance.now();
    samples.push({ x: e.clientX, y: e.clientY, t: now });
    while (samples.length > 2 && now - samples[0].t > 90) samples.shift();
    applyDrag(card, dx, dy, w);
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    try { card.releasePointerCapture(pid); } catch (err) {}
    pid = null; Deck.dragging = false;
    const a = samples[0], b = samples[samples.length - 1], dt = Math.max(b.t - a.t, 1);
    const vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
    const thr = Math.max(70, w * 0.28);
    const far = Math.abs(dx) > thr, flick = Math.abs(vx) > 0.5 && Math.abs(dx) > 28;
    if (e.type !== 'pointercancel' && (far || flick)) commitSwipe(far ? dx > 0 : vx > 0, { dx, dy, vx, vy });
    else snapBack(card);
    flushDirty();
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  card.addEventListener('dragstart', e => e.preventDefault());
}

document.addEventListener('keydown', e => {
  if (currentTab !== 'deck' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || document.getElementById('modalOverlay') || document.getElementById('gate')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); commitSwipe(true, { fromButton: true }); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); commitSwipe(false, { fromButton: true }); }
});

// Description des jeux (tirée de la page Steam, mémorisée dans la salle)
