<style id="base">
  /* ===== Base commune : structure et animations partagées par tous les thèmes ===== */
  :root { --extra-off: 0px; --green: #2E9E6B; --red: #D64545; }
  .shell { display: flex; justify-content: center; gap: 28px; min-height: 100%; }
  .shell .app { flex: 0 1 520px; width: 100%; max-width: 520px; margin: 0; }
  .info-side { display: none; }
  .info-side:empty { visibility: hidden; }
  .card-caption .desc { display: none; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  @media (min-width: 1100px) {
    .info-side { display: block; flex: none; width: 340px; position: sticky; top: 20px; align-self: flex-start; margin-top: 20px; }
    .card-caption .desc, .card-caption .info-btn { display: none !important; }
  }
  @media (min-height: 780px) and (max-width: 1099px) {
    :root { --extra-off: 46px; }
    .card-caption .desc:not(:empty) { display: -webkit-box; }
  }

  /* Filtre « multijoueur uniquement » dans l'aperçu d'import Steam */
  .mp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -2px 0 2px; }
  .mp-row #libRemoveSolo { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 8px; }
  .player { position: relative; }
  .kick-btn { position: absolute; top: -6px; right: -4px; z-index: 2; width: 17px; height: 17px; border-radius: 50%; border: none; background: var(--red); color: #fff; font-size: 9px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .mp-row label { display: flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
  .mp-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent, var(--green)); flex: none; }
  .import-row .ir-mp { flex: none; font-size: 12px; opacity: 0.85; min-width: 1.4em; text-align: center; }

  /* Tri / regroupement de la bibliothèque */
  .sort-select { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line, var(--border, currentColor)); background: var(--surface, var(--bg-elevated, transparent)); color: inherit; cursor: pointer; }
  .lib-group { margin-top: 16px; opacity: 0.85; }
  .lib-group:first-child { margin-top: 4px; }
  .brand h1, .brand-sub { overflow: hidden; text-overflow: ellipsis; }

  /* Badge multijoueur / solo et bloc prix dans la fiche d'un jeu */
  .info-mp { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; }
  .info-mp.yes { color: #fff; background: var(--green); }
  .info-mp.no { color: #fff; background: var(--red); }
  .price-btn { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line, var(--border, currentColor)); background: transparent; color: inherit; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
  .price-loading, .price-none { font-size: 13px; opacity: 0.7; margin: 0 0 12px; }
  .price-result { display: flex; align-items: center; gap: 8px; margin: 2px 0 2px; padding: 9px 12px; border-radius: 8px; background: var(--green); color: #fff; text-decoration: none; font-weight: 700; font-size: 13.5px; }
  .price-result .price-off { font-weight: 700; opacity: 0.9; }
  .price-approx { font-size: 11.5px; opacity: 0.65; margin: 4px 0 12px; }

  /* Transition entre les pages : glissement + fondu, dans le sens de l'onglet visé */
  @keyframes pageInR { from { opacity: 0; transform: translateX(var(--page-shift, 16px)); } to { opacity: 1; transform: none; } }
  @keyframes pageInL { from { opacity: 0; transform: translateX(calc(var(--page-shift, 16px) * -1)); } to { opacity: 1; transform: none; } }
  main.page-in-r { animation: pageInR var(--page-dur, .24s) var(--page-ease, ease-out) both; }
  main.page-in-l { animation: pageInL var(--page-dur, .24s) var(--page-ease, ease-out) both; }
  @keyframes capSwap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card-caption.swap { animation: capSwap var(--swap-dur, .22s) var(--swap-ease, ease-out) both; }

  /* Cartes : le tampon suit le doigt, la carte qui part reste au-dessus */
  .swipe-card .stamp { transition: opacity .08s linear; }
  .swipe-card.leaving { will-change: transform; }

  /* Description : chargement, fenêtre d'infos */
  @keyframes skel { 50% { opacity: .26; } }
  .info-skel i { display: block; height: 10px; border-radius: 5px; background: currentColor; opacity: .12; margin: 9px 0; animation: skel 1.3s ease-in-out infinite; }
  .info-skel i:nth-child(2) { width: 90%; }
  .info-skel i:nth-child(3) { width: 64%; }
  .modal-box.modal-info { background: none !important; border: none !important; box-shadow: none !important; outline: none !important; padding: 0 !important; max-width: 360px; }
  .modal-box.modal-info::before { display: none !important; }
  .game-row, .grid-item, .match-row { cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    main.page-in-r, main.page-in-l, .card-caption.swap, .info-skel i { animation: none; }
  }
</style>
<style id="theme-flat">
  :root {
    --stack-off: 385px;
    color-scheme: light dark;
    --bg: #F5F5F2;
    --surface: #FFFFFF;
    --surface-2: #ECECE7;
    --line: #E1E1DB;
    --text: #1B1B1A;
    --dim: #6B6B65;
    --primary: #1B1B1A;
    --on-primary: #FFFFFF;
    --accent: #2B6CB0;
    --green: #2E9E6B;
    --red: #D64545;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --ic-deck: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'><rect x='6.5' y='4' width='11' height='16' rx='2.5'/><path d='M3 7.5v9M21 7.5v9'/></svg>");
    --ic-library: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><rect x='4' y='4' width='6.5' height='6.5' rx='1.5'/><rect x='13.5' y='4' width='6.5' height='6.5' rx='1.5'/><rect x='4' y='13.5' width='6.5' height='6.5' rx='1.5'/><rect x='13.5' y='13.5' width='6.5' height='6.5' rx='1.5'/></svg>");
    --ic-matches: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linejoin='round'><path d='M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z'/></svg>");
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --surface: #1E1E1E; --surface-2: #2A2A2A; --line: #303030;
      --text: #EDEDEB; --dim: #9B9B95; --primary: #EDEDEB; --on-primary: #141414;
      --accent: #6EA8FE; --green: #3DBB84; --red: #F06B6B;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15.5px; font-weight: 400; line-height: 1.35; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- En-tête ---------- */
  header.top { padding: 18px 20px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { min-width: 0; }
  .brand-sub { font-size: 12.5px; color: var(--dim); line-height: 1.2; margin-bottom: 2px; white-space: nowrap; }
  .brand h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.015em; margin: 0; line-height: 1.15; white-space: nowrap; color: var(--text); }
  .head-right { display: flex; align-items: center; gap: 8px; flex: none; }
  .theme-btn { width: 34px; height: 34px; padding: 0; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--dim); font-size: 15px; line-height: 1; cursor: pointer; }
  .room-pill { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--dim); font-size: 13px; white-space: nowrap; cursor: pointer; }
  .room-pill b { color: var(--text); font-weight: 650; letter-spacing: 0.08em; }
  .rule, .hazard { display: none; }

  .players-row { padding: 6px 20px 8px; display: flex; align-items: center; gap: 6px; overflow-x: auto; }
  .player { display: flex; align-items: center; gap: 6px; flex: none; padding: 3px 11px 3px 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .player svg { width: 24px; height: 24px; display: block; }
  .player span { font-size: 13px; font-weight: 500; color: var(--text); max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player.off { opacity: 0.45; }
  .toggle-playing { margin-left: auto; font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px; flex: none; cursor: pointer; user-select: none; align-self: center; padding-left: 8px; }
  .switch { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-2); position: relative; transition: background .15s ease; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); transition: transform .15s ease; }
  .switch.on { background: var(--green); }
  .switch.on::after { transform: translateX(14px); }

  main { flex: 1; padding: 0 20px 8px; display: flex; flex-direction: column; min-height: 0; }

  .info-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 14.5px; color: var(--dim); line-height: 1.45; }
  .info-box strong { font-weight: 650; font-size: 15px; color: var(--text); }
  .info-box em { font-style: normal; font-weight: 600; color: var(--text); }
  .hint { font-size: 13.5px; color: var(--dim); line-height: 1.45; }
  .hint b { color: var(--text); font-weight: 600; }

  /* ---------- Paquet de cartes ---------- */
  .deck-progress { width: 100%; max-width: 320px; align-self: center; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--dim); }
  .deck-progress .bar { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
  .deck-progress .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); border-radius: 99px; }
  .deck-progress span { flex: none; }

  .deck-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; position: relative; }
  .deck-stack { position: relative; width: min(100%, 320px, max(150px, calc((100vh - var(--stack-off) - var(--extra-off, 0px)) * 0.75))); width: min(100%, 320px, max(150px, calc((100dvh - var(--stack-off) - var(--extra-off, 0px)) * 0.75))); aspect-ratio: 3 / 4; }
  .swipe-card { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: none; will-change: transform; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .swipe-card:active { cursor: grabbing; }
  @keyframes cardPopIn { from { transform: scale(.96) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .swipe-card.card-enter { animation: cardPopIn .28s ease-out backwards; }
  .bk, .orn, .hud { display: none; }

  .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--surface-2) !important; }
  .cover-blob { display: none; }
  .cover-emoji { font-size: 56px; filter: grayscale(1); opacity: 0.5; }
  .cover-emoji.sm { font-size: 18px; }
  .grid-cover .cover-emoji.sm { font-size: 28px; }
  .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface-2); pointer-events: none; -webkit-user-drag: none; user-select: none; }

  @keyframes stampPunchYes { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes stampPunchNo { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .stamp.yes.punch { animation: stampPunchYes .3s ease-out both; }
  .stamp.no.punch { animation: stampPunchNo .3s ease-out both; }
  .swipe-card .stamp { position: absolute; top: 16px; z-index: 6; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; padding: 6px 14px; border-radius: 999px; color: #fff; opacity: 0; pointer-events: none; }
  .swipe-card .stamp.yes { left: 16px; background: var(--green); transform: rotate(-10deg); }
  .swipe-card .stamp.no { right: 16px; background: var(--red); transform: rotate(10deg); }

  .card-caption { width: 100%; max-width: 320px; margin-top: 18px; text-align: left; }
  .card-caption .name { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; color: var(--text); }
  .card-caption .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; min-width: 0; }
  .card-caption .tag { flex: none; font-size: 11.5px; font-weight: 600; color: var(--dim); background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }
  .card-caption .added-by { font-size: 13.5px; color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .deck-actions { display: flex; gap: 20px; align-items: center; justify-content: center; margin-top: 16px; padding-bottom: 6px; }
  .round-btn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--red); font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .1s ease; }
  .round-btn:active { transform: scale(0.93); }
  .round-btn.yes { width: 64px; height: 64px; border-color: transparent; background: var(--green); color: #fff; font-size: 26px; }

  /* ---------- Boutons, titres, formulaires ---------- */
  .section-title { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin: 0; color: var(--dim); }
  .section-title.ornate { margin: 20px 0 10px; }
  .btn { font-family: var(--font); font-weight: 600; font-size: 14px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; line-height: 1.15; }
  .btn:active { opacity: 0.8; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
  .link-btn { background: none; border: none; padding: 8px 0 2px; font-family: var(--font); font-size: 13.5px; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }

  .view-toggle { display: flex; gap: 4px; flex: none; padding: 3px; background: var(--surface-2); border-radius: 9px; }
  .view-toggle button { background: transparent; border: none; color: var(--dim); border-radius: 7px; padding: 3px 9px; font-size: 15px; line-height: 1.3; cursor: pointer; }
  .view-toggle button.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .icon-btn { background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px; display: flex; align-items: center; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.danger { color: var(--red); }

  .inline-form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .inline-form input[type=text], .inline-form textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: var(--font); font-size: 15px; outline: none; width: 100%; }
  .inline-form textarea { min-height: 110px; resize: vertical; }
  .inline-form input::placeholder, .inline-form textarea::placeholder { color: var(--dim); opacity: 0.7; }
  .inline-form input:focus, .inline-form textarea:focus { border-color: var(--accent); }

  .import-preview { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  .import-row { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14.5px; }
  .import-row input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .import-row .ir-name { flex: 1; line-height: 1.25; min-width: 0; }
  .import-row .ir-meta { font-size: 12px; color: var(--dim); flex: none; }
  .import-tools { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Bibliothèque ---------- */
  .game-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .game-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 12px; }
  .g-cover { width: 40px; height: 40px; flex: none; position: relative; overflow: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .g-main { flex: 1; min-width: 0; }
  .g-name { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .g-by { font-size: 13px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-tag { font-size: 11.5px; font-weight: 600; color: var(--dim); background: var(--surface-2); padding: 2px 8px; border-radius: 6px; flex: none; }

  .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; margin-top: 12px; }
  .grid-item { display: flex; flex-direction: column; gap: 5px; }
  .grid-cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); }
  .grid-del { position: absolute; top: 5px; right: 5px; z-index: 6; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .grid-name { font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .grid-by { font-size: 12.5px; color: var(--dim); text-align: center; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Matchs ---------- */
  .match-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .match-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
  .match-row.full { border-color: var(--green); background: color-mix(in srgb, var(--green) 9%, var(--surface)); }
  .match-row .m-body { flex: 1; min-width: 0; }
  .match-row .m-name { font-weight: 650; font-size: 15px; line-height: 1.2; }
  .match-row .m-score { font-size: 13.5px; color: var(--dim); margin-top: 2px; line-height: 1.25; }
  .match-row .m-badge { flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: #fff; background: var(--green); padding: 3px 8px; border-radius: 6px; }

  /* ---------- Navigation ---------- */
  nav.tabbar { position: sticky; bottom: 0; display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }

// Noms : comparaison tolérante (casse, accents, ™ ®, ponctuation)

function normName(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[™®©'’`]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function addedOwnersOf(g) {
  const out = [];
  const add = n => { if (n && !out.some(o => normName(o) === normName(n))) out.push(n); };
  add(g.addedBy);
  (Array.isArray(g.addedByList) ? g.addedByList : []).forEach(add);
  return out;
}
function ownersOf(g) {
  const out = addedOwnersOf(g);
  // Possession réelle : joueurs ayant lié leur Steam et possédant cet appid,
  // même s'ils ne l'ont pas personnellement ajouté à la bibliothèque.
  if (g.appid) {
    State.players.forEach(p => {
      if (Array.isArray(p.ownedAppIds) && p.ownedAppIds.includes(g.appid) && !out.some(o => normName(o) === normName(p.name))) out.push(p.name);
    });
  }
  return out;
}
function findExisting(name, appid) {
  const n = normName(name);
  return State.games.find(g =>
    (appid && g.appid && String(g.appid) === String(appid)) || normName(g.name) === n
  );
}

const HASH_FAMILIES = [
  { emoji: '🎮', c1: '#5B8DEF', c2: '#16264F' },
  { emoji: '🎲', c1: '#E5484D', c2: '#4A1215' },
  { emoji: '🕹️', c1: '#A78BFA', c2: '#2A1B5B' },
  { emoji: '🎯', c1: '#35C48D', c2: '#0E3B2B' },

  { emoji: '🧭', c1: '#22D3EE', c2: '#083344' },
];
function hashNum(str) { let h=0; for (let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function coverFamilyFor(game) {
  const tag = (game.tag || '').toLowerCase();
  const found = COVER_FAMILIES.find(f => f.match.test(tag));
  if (found) return found;
  return HASH_FAMILIES[hashNum(game.name || 'x') % HASH_FAMILIES.length];
}
function coverHtml(game, opts) {
  opts = opts || {};
  const fam = coverFamilyFor(game);
  const seed = hashNum(game.name || 'x');
  const p1 = 15 + (seed % 55), p2 = 15 + ((seed >> 5) % 55);
  const base = '<div class="cover" style="background:linear-gradient(155deg,'+fam.c1+','+fam.c2+');">' +
    '<div class="cover-blob" style="left:'+p1+'%; top:-25%;"></div>' +
    '<div class="cover-blob" style="right:'+p2+'%; bottom:-30%;"></div>' +
    '<span class="cover-emoji'+(opts.small ? ' sm' : '')+'">'+fam.emoji+'</span>';
  if (game.coverUrl) {
    // Image par-dessus le visuel de secours ; si elle ne charge pas, on essaie
    // l'image de repli, puis on la retire pour laisser voir le dégradé + l'icône.
    const fallback = game.coverFallback || '';
    return base +
      '<img class="cover-img" src="'+escapeHtml(game.coverUrl)+'" alt="" loading="lazy" draggable="false" ' +
      'data-fallback="'+escapeHtml(fallback)+'" ' +
      'onerror="if(this.dataset.fallback && this.src!==this.dataset.fallback){this.src=this.dataset.fallback;}else{this.remove();}">' +
      '</div>';
  }
  return base + '</div>';
}
async function fetchSteamCover(name) {
  try {
    const r = await fetch('/api/steam-cover?name=' + encodeURIComponent(name));
    if (!r.ok) return null;
    const data = await r.json();
    if (data && data.found) return { image: data.image, fallbackImage: data.fallbackImage, appid: data.appid };
    return null;
  } catch (e) { return null; }
}
async function fetchSteamLibrary(profile) {
  let data = null, ok = false;
  try {
    const r = await fetch('/api/steam-library?profile=' + encodeURIComponent(profile));
    ok = r.ok;
    data = await r.json();
  } catch (e) { throw { code: 'network' }; }
  if (!ok || !data || data.error) throw { code: (data && data.error) || 'network' };
  return data;
}
async function fetchSteamInfo(appid) {
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const r = await fetch('/api/steam-info?appid=' + encodeURIComponent(appid));
      if (r.ok) {
        const d = await r.json();
        if (d && (d.found || typeof d.multiplayer === 'boolean')) return d;
        if (attempt < 2) { await new Promise(res => setTimeout(res, 400 * (attempt + 1))); continue; }
        return d;
      }
    } catch (e) {}
    if (attempt < 2) await new Promise(res => setTimeout(res, 400 * (attempt + 1)));
  }
  return null;
}
function steamErrorMessage(code) {
  switch (code) {
    case 'no_key': return 'Le site n\'a pas encore de clé Steam : ajoute la variable STEAM_API_KEY sur Vercel (voir le guide), puis redéploie.';
    case 'bad_key': return 'La clé Steam configurée sur le site est refusée. Vérifie-la sur Vercel.';
    case 'private': return 'Steam ne renvoie aucun jeu : ton profil (ou « Détails du jeu ») est probablement en privé. Passe-le en Public, puis réessaie.';
    case 'not_found': return 'Profil introuvable. Vérifie le lien, le pseudo ou l\'ID.';
    default: return 'Impossible de joindre Steam pour le moment. Réessaie dans un instant.';
  }
}
async function runPool(tasks, n) {
  let i = 0;
  const workers = Array.from({ length: Math.min(n, tasks.length) }, async () => {
    while (i < tasks.length) { const t = tasks[i++]; try { await t(); } catch (e) {} }
  });
  await Promise.all(workers);
}

  unsubs.push(swipesCol().onSnapshot(snap => {

    emit();
  }));
  unsubs.push(playersCol().onSnapshot(snap => {
    State.players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const stillHere = State.players.some(p => p.id === myId);

// Ajout de jeux (manuel, collé ou Steam) avec fusion des doublons :
// si le jeu existe déjà, on ajoute simplement la personne à ceux qui le présentent.
async function importGames(items) {
  const FV = firebase.firestore.FieldValue;
  const seen = new Set();
  const pendingCovers = [];
  let added = 0, merged = 0, already = 0;
  let batch = db.batch(), ops = 0;
  const flush = async () => { if (ops) { await batch.commit(); batch = db.batch(); ops = 0; } };

  for (const it of items) {
    const key = normName(it.name);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    const existing = findExisting(it.name, it.appid);
    if (existing) {
      if (addedOwnersOf(existing).some(o => normName(o) === normName(myName))) { already++; continue; }
      const upd = { addedByList: FV.arrayUnion(myName) };
      if (!existing.coverUrl && it.image) { upd.coverUrl = it.image; upd.coverFallback = it.fallbackImage || null; }
      if (!existing.appid && it.appid) upd.appid = it.appid;
      if (!existing.infoTs && it.desc !== undefined) {
        upd.desc = it.desc || ''; upd.genres = it.genres || []; upd.dev = it.dev || ''; upd.released = it.released || '';
        upd.infoTs = Date.now();
      }
      if (existing.multiplayer === undefined && it.multiplayer !== undefined) upd.multiplayer = it.multiplayer;
      batch.update(gamesCol().doc(existing.id), upd);
      merged++;
    } else {
      const ref = gamesCol().doc();
      const doc = {
        name: it.name.trim(), tag: (it.tag || 'Autre').trim() || 'Autre',
        addedBy: myName, addedByList: [myName],
        ts: Date.now() + added,
        coverUrl: it.image || null, coverFallback: it.fallbackImage || null, appid: it.appid || null,
      };
      if (it.desc !== undefined) { doc.desc = it.desc || ''; doc.genres = it.genres || []; doc.dev = it.dev || ''; doc.released = it.released || ''; doc.infoTs = Date.now(); }
      if (it.multiplayer !== undefined) doc.multiplayer = it.multiplayer;
      batch.set(ref, doc);
      if (!it.image) pendingCovers.push({ ref, name: it.name });
      added++;
    }
    ops++;
    if (ops >= 400) await flush();
  }
  await flush();

  // Jeux sans jaquette (ajout manuel / liste collée) : on la cherche en arrière-plan.
  if (pendingCovers.length) {
    runPool(pendingCovers.map(p => async () => {
      const found = await fetchSteamCover(p.name);
      if (found) await p.ref.update({ coverUrl: found.image, coverFallback: found.fallbackImage, appid: found.appid || null });
    }), 4);
  }
  return { added, merged, already };
}
function summarizeImport(r) {
  const parts = [];
  if (r.added) parts.push(r.added + ' nouveau' + (r.added > 1 ? 'x' : ''));
  if (r.merged) parts.push(r.merged + ' déjà présent' + (r.merged > 1 ? 's' : '') + ' (tu es ajouté·e comme co-présentateur·rice)');
  if (r.already) parts.push(r.already + ' déjà à ton nom');
  return parts.length ? 'Import terminé : ' + parts.join(', ') + '.' : 'Rien à ajouter.';
}

async function addGame(name, tag) {

  const r = await importGames([{ name, tag }]);
  if (r.added) toast('« ' + name.trim() + ' » ajouté.');
  else if (r.merged) toast('« ' + name.trim() + ' » existait déjà : tu apparais maintenant parmi ceux qui le présentent.');

}

// matchs) et mémorisé sur l'appareil. Un jeu confirmé solo est masqué ; un

// ---------------------------------------------------------------
let libraryMpFilter = localStorage.getItem('gn_mp_filter') === '1';
let mpCoverageStarted = false;
function passesMpFilter(g) { return !libraryMpFilter || g.multiplayer !== false; }
function filteredGames() { return State.games.filter(passesMpFilter); }
function setLibraryMpFilter(on) {
  libraryMpFilter = on;
  localStorage.setItem('gn_mp_filter', on ? '1' : '0');
  if (on) ensureMultiplayerCoverage();
  renderMain(true);
}
// Vérifie en arrière-plan (concurrence volontairement faible, Steam limite le
// débit) tous les jeux de la bibliothèque dont le statut multijoueur est
// encore inconnu, pour que le filtre devienne complet au fil du temps.
async function ensureMultiplayerCoverage() {
  if (mpCoverageStarted) return;
  mpCoverageStarted = true;
  const todo = () => State.games.filter(g => g.multiplayer === undefined || g.multiplayer === null);
  let batch = todo();
  while (batch.length) {
    batch.forEach(g => { delete infoCache[g.id]; }); // ignore un éventuel cache déjà résolu mais périmé
    await runPool(batch.map(g => () => ensureInfo(g)), 2);
    const next = todo();
    if (next.length >= batch.length) break; // plus de progrès possible (échecs persistants)
    batch = next;
  }
  mpCoverageStarted = false;
}

  }).filter(m => m.count > 0).sort((a,b) => (b.count/b.denom) - (a.count/a.denom) || b.count - a.count);
}

const MONTHS = 'janv|f[ée]vr|mars|avr|mai|juin|juil|ao[uû]t|sept|oct|nov|d[ée]c|jan|feb|mar|apr|jun|jul|aug|sep|nov|dec';
const JUNK_PATTERNS = [
  /^\d[\d.,\s]*\s*(hrs?|heures?|h|min(ute)?s?)\s*(on record|de jeu)?$/i,
  /^(aujourd.?hui|hier|demain)$/i,
  /(jouer|play game|installer|install|acheter|buy|voir|view|d[ée]tails|details|statistiques|stats|community hub|dlc|dans la biblioth[èe]que|in library|wishlist|liste de souhaits)/i,
  /(succ[èe]s|achievements?|trophées?|trophies|d[ée]bloqu[ée]|unlocked|obtenu(e|s)?|progression|compl[ée]t[ée])/i,
  /^\d{1,4}\s*\/\s*\d{1,4}$/,
  /^\d{1,3}\s*%$/,
  /(derni[èe]re? (partie|session|fois|lancement)|last (played|launched|session)|lanc[ée] pour la derni[èe]re fois|temps de jeu|playtime|il y a\s+\d|jours?\s+ago|\bago\b)/i,
  new RegExp('\\b\\d{1,2}\\s*(' + MONTHS + ')[a-zéû.]*\\s*\\d{0,4}\\b', 'i'),
  new RegExp('\\b(' + MONTHS + ')[a-zéû.]*\\s+\\d{4}\\b', 'i'),
  /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/,
  /^\d+$/, /^[-–—•·]+$/,
];
const STEAM_UI_EXACT = new Set(['jeux','nom','evaluation','evaluations','categorie','categories','recherche','filtrer','trier par','played','mes stats de jeu','mon contenu de jeu','succes','temps de jeu','temps de jeu total','dernier lancement']);
const STEAM_UI_SUBSTRINGS = ['trouver un jeu','jeux suivis','tous les jeux','termines a 100','lances recemment','recemment lances','jeux termines','followed games','recently played','all games','find a game','temps de jeu','mes stats de jeu','mon contenu de jeu','dernier lancement'];
function normalizeForMatch(str) { return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[()\[\]]/g,' ').replace(/\d+/g,' ').replace(/[▲▼△▽:▶►]/g,' ').replace(/\s+/g,' ').trim(); }
function isSteamUiNoise(t) { const n = normalizeForMatch(t); if (!n) return true; if (STEAM_UI_EXACT.has(n)) return true; return STEAM_UI_SUBSTRINGS.some(s => n.includes(s)); }
function cleanupPastedList(raw) {
  const seen = new Set(); const out = []; let skippedHeader = false;
  raw.split('\n').forEach(line => {
    let t = line.replace(/\s+/g, ' ').trim();
    if (!t) return;
    if (!skippedHeader) { skippedHeader = true; return; }
    if (t.length < 2 || t.length > 60) return;
    if (isSteamUiNoise(t)) return;
    if (JUNK_PATTERNS.some(rx => rx.test(t))) return;
    const key = t.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key); out.push(t);
  });
  return out;
}

function infoBox(title, body) {
  const d = document.createElement('div'); d.className = 'info-box';
  d.innerHTML = '<strong>' + title + '</strong><br>' + body; return d;
}
function presentedBy(g) { const o = ownersOf(g); return o.length ? o.join(', ') : 'quelqu\'un'; }

// ---------------------------------------------------------------
// Paquet de cartes façon « swipe » : les cartes sont déplacées en place
// (jamais reconstruites pendant un geste) et la suivante remonte en douceur.
// ---------------------------------------------------------------
const Deck = { stack: null, els: [], dragging: false, leaving: 0, dirty: false };
const VISIBLE = 3, DEPTH_SCALE = 0.045, DEPTH_Y = 10;

function depthTransform(depth, p) {
  const d = Math.max(depth - (p || 0), 0);
  return 'translate3d(0px,' + (d * DEPTH_Y).toFixed(2) + 'px,0) scale(' + (1 - d * DEPTH_SCALE).toFixed(4) + ')';
}
function pad2(n) { return String(n).padStart(2, '0'); }
function gameById(id) { return State.games.find(g => g.id === id) || null; }
function flushDirty() {
  if (Deck.dirty && !Deck.dragging && !Deck.leaving) { Deck.dirty = false; if (currentTab === 'deck') renderMain(); }
}

function buildCardEl(g) {
  const card = document.createElement('div');
  card.className = 'swipe-card';
  card.dataset.gid = g.id;
  card.dataset.cover = g.coverUrl || '';
  card.innerHTML = coverHtml(g) +
    '<i class="bk tl"></i><i class="bk tr"></i><i class="bk bl"></i><i class="bk br"></i>' +
    '<i class="orn tl"></i><i class="orn tr"></i><i class="orn bl"></i><i class="orn br"></i>' +
    '<div class="hud tl"></div><div class="hud tr rec">Rec</div>' +
    '<div class="stamp yes">OUI</div><div class="stamp no">NON</div>';
  attachSwipeGestures(card);
  return card;
}

// Place chaque carte selon sa profondeur (0 = dessus).
function layoutDeck(animate) {
  const total = State.games.length, done = total - myUnswiped().length;
  Deck.els.forEach((el, depth) => {
    el.style.zIndex = String(10 - depth);
    el.style.transformOrigin = '';
    el.style.transition = animate ? 'transform .32s cubic-bezier(.2,.8,.3,1)' : 'none';
    el.style.transform = depthTransform(depth);
    el.style.pointerEvents = depth === 0 ? 'auto' : 'none';
    el.classList.toggle('is-top', depth === 0);
    const hud = el.querySelector('.hud.tl'); if (hud) hud.textContent = '#' + pad2(done + depth + 1) + '/' + total;
    if (depth > 0) el.querySelectorAll('.stamp').forEach(st => { st.style.opacity = '0'; });
  });
}

// Met le paquet en phase avec les données, en ne touchant qu'à ce qui a changé.
function syncDeck(animate) {
  const want = myUnswiped().slice(0, VISIBLE);
  const prefixOk = Deck.els.length <= want.length && Deck.els.every((el, i) => el.dataset.gid === want[i].id);
  if (!prefixOk) {
    Array.from(Deck.stack.querySelectorAll('.swipe-card:not(.leaving)')).forEach(el => el.remove());
    Deck.els = [];
  }
  Deck.els.forEach((el, i) => {   // jaquette arrivée entre-temps
    const g = want[i];
    if (g && (el.dataset.cover || '') !== (g.coverUrl || '')) {
      el.dataset.cover = g.coverUrl || '';
      const c = el.querySelector('.cover'); if (c) c.outerHTML = coverHtml(g);
    }
  });
  const fresh = [];
  for (let i = Deck.els.length; i < want.length; i++) {
    const el = buildCardEl(want[i]);
    Deck.els.push(el); Deck.stack.appendChild(el); fresh.push(el);
  }
  layoutDeck(animate && prefixOk);
  if (prefixOk) fresh.forEach(el => {
    el.style.opacity = '0';
    requestAnimationFrame(() => { el.style.transition = 'transform .32s cubic-bezier(.2,.8,.3,1), opacity .3s ease'; el.style.opacity = '1'; });
  });
  updateProgress(); refreshCaption(); refreshInfo();
}

function updateProgress() {
  const el = document.querySelector('.deck-progress'); if (!el) return;
  const total = State.games.length, done = total - myUnswiped().length;
  const bar = el.querySelector('.bar i'), txt = el.querySelector('span');
  if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  if (txt) txt.textContent = done + ' / ' + total + ' vus';
}
function refreshCaption() {
  const cap = document.querySelector('.card-caption'); if (!cap || !Deck.els[0]) return;
  const top = gameById(Deck.els[0].dataset.gid); if (!top) return;
  const changed = cap.dataset.gid !== top.id;
  cap.dataset.gid = top.id;
  cap.querySelector('.name').textContent = top.name;
  cap.querySelector('.tag').textContent = top.tag || 'Jeu';
  cap.querySelector('.added-by').textContent = 'Présenté par : ' + presentedBy(top);
  if (changed) { cap.classList.remove('swap'); void cap.offsetWidth; cap.classList.add('swap'); }
}

function renderDeck(main) {
  const cards = myUnswiped();
  const live = Deck.stack && main.contains(Deck.stack);
  if (live && cards.length) {                       // vue déjà affichée : mise à jour en place
    if (Deck.dragging || Deck.leaving) { Deck.dirty = true; refreshInfo(); return; }
    syncDeck(false); return;
  }
  Deck.stack = null; Deck.els = [];
  main.innerHTML = '';
  if (!State.games.length) { main.appendChild(infoBox('Bibliothèque vide', 'Ajoute vos jeux dans l\'onglet <em>Bibliothèque</em> pour commencer à swiper.')); return; }
  if (!cards.length) { main.appendChild(infoBox('Tout est swipé', (myName ? myName + ', t' : 'T') + 'u as donné ton avis sur tous les jeux. Va voir l\'onglet <em>Matchs</em>, ou ajoute d\'autres jeux.')); return; }

  const progress = document.createElement('div'); progress.className = 'deck-progress';
  progress.innerHTML = '<div class="bar"><i></i></div><span></span>';
  main.appendChild(progress);

  const wrap = document.createElement('div'); wrap.className = 'deck-wrap';
  const stack = document.createElement('div'); stack.className = 'deck-stack';
  wrap.appendChild(stack);
  const caption = document.createElement('div'); caption.className = 'card-caption'; caption.dataset.gid = cards[0].id;
  caption.innerHTML = '<div class="name"></div><div class="meta"><span class="tag"></span><span class="added-by"></span>' +
    '<button class="info-btn" type="button" aria-label="Description du jeu" title="Description du jeu">i</button></div><div class="desc"></div>';
  const openTop = () => { if (Deck.els[0]) showInfoModal(Deck.els[0].dataset.gid); };
  caption.querySelector('.info-btn').onclick = openTop;
  caption.querySelector('.desc').onclick = openTop;
  wrap.appendChild(caption);

  const actions = document.createElement('div'); actions.className = 'deck-actions';
  const noBtn = document.createElement('button'); noBtn.className = 'round-btn no'; noBtn.textContent = '✕'; noBtn.setAttribute('aria-label', 'Non');
  noBtn.onclick = () => commitSwipe(false, { fromButton: true });
  const yesBtn = document.createElement('button'); yesBtn.className = 'round-btn yes'; yesBtn.textContent = '♥'; yesBtn.setAttribute('aria-label', 'Oui');
  yesBtn.onclick = () => commitSwipe(true, { fromButton: true });
  actions.appendChild(noBtn); actions.appendChild(yesBtn);
  main.appendChild(wrap); main.appendChild(actions);

  Deck.stack = stack;
  syncDeck(false);
}

// Valide un swipe : la carte s'envole dans le sens du geste, la suivante remonte tout de suite.
function commitSwipe(liked, info) {
  info = info || {};
  const card = Deck.els[0];
  if (!card || card._leaving) return;
  card._leaving = true;
  card.classList.add('leaving'); card.classList.remove('is-top');
  card.style.pointerEvents = 'none'; card.style.zIndex = '30';
  Deck.els.shift(); Deck.leaving++;
  swipeGame(card.dataset.gid, liked);

  const dir = liked ? 1 : -1;
  const width = card.getBoundingClientRect().width;
  const endX = dir * (window.innerWidth + width) * 1.1;
  const endY = Math.max(-180, Math.min(180, (info.dy || 0) + (info.vy || 0) * 260)) + (info.fromButton ? -28 : 0);
  const endRot = dir * (info.fromButton ? 24 : 32);
  const speed = Math.abs(info.vx || 0);
  const dur = info.fromButton ? 420 : speed > 1.4 ? 240 : speed > 0.7 ? 300 : 360;

  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  (liked ? yes : no).style.opacity = '1'; (liked ? no : yes).style.opacity = '0';
  if (info.fromButton) {            // départ propre, dans la même famille de transformations
    card.style.transition = 'none'; card.style.transformOrigin = '50% 90%';
    card.style.transform = 'translate3d(0px,0px,0) rotate(0deg)';
  }
  void card.offsetWidth;
  card.style.transition = 'transform ' + dur + 'ms cubic-bezier(.25,.7,.35,1)';
  card.style.transform = 'translate3d(' + endX.toFixed(1) + 'px,' + endY.toFixed(1) + 'px,0) rotate(' + endRot + 'deg)';
  setTimeout(() => { card.remove(); Deck.leaving--; flushDirty(); }, dur + 60);

  if (currentTab === 'deck' && Deck.stack) {
    if (!myUnswiped().length) { Deck.dirty = true; refreshInfo(); }   // dernier jeu : l'écran de fin s'affiche après l'envol
    else syncDeck(true);
  }
}

function applyDrag(card, dx, dy, w) {
  const rot = Math.max(-24, Math.min(24, dx / w * 24));
  card.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';
  const p = Math.min(Math.abs(dx) / Math.max(70, w * 0.28), 1);
  card.querySelector('.stamp.yes').style.opacity = dx > 0 ? p.toFixed(2) : '0';
  card.querySelector('.stamp.no').style.opacity = dx < 0 ? p.toFixed(2) : '0';
  Deck.els.slice(1).forEach((el, i) => { el.style.transition = 'none'; el.style.transform = depthTransform(i + 1, p); });
}
function snapBack(card) {
  card.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
  card.style.transform = depthTransform(0);
  card.querySelectorAll('.stamp').forEach(st => { st.style.opacity = '0'; });
  Deck.els.slice(1).forEach((el, i) => { el.style.transition = 'transform .3s ease'; el.style.transform = depthTransform(i + 1); });
}

function attachSwipeGestures(card) {
  let pid = null, sx = 0, sy = 0, dx = 0, dy = 0, w = 300, samples = [];
  card.addEventListener('pointerdown', e => {
    if (card !== Deck.els[0] || card._leaving || pid !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; dy = 0;
    samples = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
    w = card.getBoundingClientRect().width || 300;
    Deck.dragging = true;
    card.style.transition = 'none'; card.style.transformOrigin = '50% 90%';
    try { card.setPointerCapture(pid); } catch (err) {}
  });
  card.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    const now = performance.now();
    samples.push({ x: e.clientX, y: e.clientY, t: now });
    while (samples.length > 2 && now - samples[0].t > 90) samples.shift();
    applyDrag(card, dx, dy, w);
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    try { card.releasePointerCapture(pid); } catch (err) {}
    pid = null; Deck.dragging = false;
    const a = samples[0], b = samples[samples.length - 1], dt = Math.max(b.t - a.t, 1);
    const vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
    const thr = Math.max(70, w * 0.28);
    const far = Math.abs(dx) > thr, flick = Math.abs(vx) > 0.5 && Math.abs(dx) > 28;
    if (e.type !== 'pointercancel' && (far || flick)) commitSwipe(far ? dx > 0 : vx > 0, { dx, dy, vx, vy });
    else snapBack(card);
    flushDirty();
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  card.addEventListener('dragstart', e => e.preventDefault());
}

document.addEventListener('keydown', e => {
  if (currentTab !== 'deck' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || document.getElementById('modalOverlay') || document.getElementById('gate')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); commitSwipe(true, { fromButton: true }); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); commitSwipe(false, { fromButton: true }); }
});

// ---------------------------------------------------------------
// Description des jeux (tirée de la page Steam, mémorisée dans la salle)
// ---------------------------------------------------------------
const infoCache = {};
const priceCache = {};
let focusGameId = null;
let infoModalGid = null;
const isWide = () => window.matchMedia && matchMedia('(min-width: 1100px)').matches;

function priceHtml(g) {
  const p = priceCache[g.id] || { state: 'idle' };
  if (p.state === 'idle') return '<button class="price-btn" type="button" data-gid="' + g.id + '">💰 Voir le prix le plus bas</button>';
  if (p.state === 'loading') return '<div class="price-loading">Recherche du meilleur prix…</div>';
  if (p.state === 'none') return '<div class="price-none">Aucun prix trouvé pour ce jeu.</div>';
  const off = p.savings ? ' <span class="price-off">-' + p.savings + '%</span>' : '';
  return '<a class="price-result" href="' + p.url + '" target="_blank" rel="noopener noreferrer">💰 ' + p.price.toFixed(2) + ' € chez ' + escapeHtml(p.store) + off + '</a>' +
    (p.approx ? '<div class="price-approx">Correspondance approximative — vérifie le titre avant d\'acheter.</div>' : '');
}
async function ensurePrice(gid) {
  const g = gameById(gid);
  if (!g || (priceCache[gid] && priceCache[gid].state !== 'idle')) return;
  priceCache[gid] = { state: 'loading' };
  refreshInfo();
  let result = { state: 'none' };
  try {
    const r = await fetch('/api/game-price?name=' + encodeURIComponent(g.name));
    if (r.ok) {
      const d = await r.json();
      if (d && d.found) result = { state: 'ok', price: d.price, store: d.store, url: d.url, savings: d.savings, approx: d.approx };
    }
  } catch (e) {}
  priceCache[gid] = result;
  refreshInfo();
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.price-btn');
  if (btn) ensurePrice(btn.dataset.gid);
});

function infoOf(g) {
  if (g.desc) return { state: 'ok', desc: g.desc, genres: g.genres || [], dev: g.dev || '', released: g.released || '', mp: g.multiplayer };
  if (g.infoTs) return { state: 'none', mp: g.multiplayer };
  return infoCache[g.id] || { state: 'loading' };
}
function mpBadge(mp) {
  if (mp === true) return '<div class="info-mp yes">🎮 Multijoueur</div>';
  if (mp === false) return '<div class="info-mp no">🚫 Solo uniquement</div>';
  return '';
}
function infoHtml(g) {
  const i = infoOf(g);
  const head = '<div class="info-kicker"></div><h3 class="info-title">' + escapeHtml(g.name) + '</h3>';
  if (i.state === 'loading') return head + '<div class="info-skel"><i></i><i></i><i></i></div>';
  if (i.state === 'none') return head + mpBadge(i.mp) + '<p class="info-desc dim">Pas de description disponible pour ce jeu.</p>' + priceHtml(g);
  const genres = i.genres.length ? '<div class="info-genres">' + i.genres.map(x => '<span>' + escapeHtml(x) + '</span>').join('') + '</div>' : '';
  const meta = [i.dev, i.released ? 'Sortie : ' + i.released : ''].filter(Boolean).join(' · ');
  return head + mpBadge(i.mp) + '<p class="info-desc">' + escapeHtml(i.desc) + '</p>' + genres +
    (meta ? '<div class="info-meta">' + escapeHtml(meta) + '</div>' : '') + priceHtml(g) + '<div class="info-src">Source : page Steam</div>';
}
async function ensureInfo(g) {
  if (!g || infoCache[g.id]) return;
  const mpKnown = g.multiplayer === true || g.multiplayer === false;
  if (g.desc && mpKnown) return; // description ET statut multijoueur déjà acquis : rien à refaire
  if (!g.desc && g.infoTs && mpKnown) return; // "pas de description" déjà constaté, et multijoueur connu
  infoCache[g.id] = { state: 'loading' };
  let appid = g.appid || null, found = null, mp, failed = false;
  try {
    if (!appid) {
      const r0 = await fetch('/api/steam-cover?name=' + encodeURIComponent(g.name));
      if (!r0.ok) failed = true;
      else { const c = await r0.json(); if (c && c.found && c.appid) appid = c.appid; }
    }
    if (appid && !failed) {
      const d = await fetchSteamInfo(appid);
      if (d) { mp = d.multiplayer; if (d.found && d.description) found = d; else if (d.error) failed = true; }
      else failed = true;
    }
  } catch (e) { failed = true; }
  if (found) {
    infoCache[g.id] = { state: 'ok', desc: found.description, genres: found.genres || [], dev: found.developer || '', released: found.released || '', mp };
    gamesCol().doc(g.id).update({ desc: found.description, genres: found.genres || [], dev: found.developer || '', released: found.released || '', appid: appid || null, multiplayer: mp === undefined ? null : mp, infoTs: Date.now() }).catch(() => {});
  } else if (!failed) {
    infoCache[g.id] = { state: 'none', mp };
    gamesCol().doc(g.id).update({ desc: '', multiplayer: mp === undefined ? null : mp, infoTs: Date.now() }).catch(() => {});
  } else {
    // Échec (réseau, Steam indisponible…) : on ne mémorise rien de définitif,
    // pour qu'un prochain passage (import, filtre, ouverture de la fiche) réessaie.
    infoCache[g.id] = g.desc ? { state: 'ok', desc: g.desc, genres: g.genres || [], dev: g.dev || '', released: g.released || '', mp: g.multiplayer }
      : { state: g.infoTs ? 'none' : 'loading', mp: g.multiplayer };
  }
  refreshInfo();
}
function infoTargetGame() {
  if (currentTab === 'deck') return Deck.els[0] ? gameById(Deck.els[0].dataset.gid) : null;
  return gameById(focusGameId);
}
// Met à jour les trois endroits où la description peut s'afficher :
// panneau latéral (grand écran), aperçu sous le nom (téléphone) et fenêtre d'infos.
function refreshInfo() {
  const g = infoTargetGame();
  const side = document.getElementById('infoSide');
  if (side) {
    const html = g ? '<div class="info-card">' + infoHtml(g) + '</div>'
      : (currentTab === 'deck' ? '' : '<div class="info-card"><div class="info-kicker"></div><p class="info-desc dim">Touche un jeu pour voir sa description.</p></div>');
    if (side._html !== html) { side.innerHTML = html; side._html = html; }
  }
  const desc = document.querySelector('.card-caption .desc');
  if (desc) { const i = g && infoOf(g); const t = i && i.state === 'ok' ? i.desc : ''; if (desc.textContent !== t) desc.textContent = t; }
  const mc = document.getElementById('infoModalCard');
  if (mc) { const mg = gameById(infoModalGid); if (mg) { const html = infoHtml(mg); if (mc._html !== html) { mc.innerHTML = html; mc._html = html; } ensureInfo(mg); } }
  else infoModalGid = null;
  if (g) ensureInfo(g);
  if (currentTab === 'deck' && Deck.els[1]) ensureInfo(gameById(Deck.els[1].dataset.gid));
}
function showInfoModal(gid) {
  if (!gameById(gid)) return;
  closeModal();
  infoModalGid = gid;
  const ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'modalOverlay';

  ov.appendChild(box);

// Bibliothèque / matchs : un jeu touché s'affiche dans le panneau latéral (grand écran) ou dans la fenêtre d'infos.
function openInfo(gid) {

  else showInfoModal(gid);
}
function markFocused() {
  document.querySelectorAll('[data-gid]').forEach(el => { if (!el.classList.contains('swipe-card')) el.classList.toggle('focused', el.dataset.gid === focusGameId); });
}

// Le formulaire (ajout, lien Steam, collage) vit dans un élément persistant : il survit
// aux mises à jour Firestore, donc ce qu'on est en train de saisir n'est jamais effacé.
const libraryFormZone = document.createElement('div');
libraryFormZone.style.marginTop = '8px';

function setLibraryView(v) { libraryView = v; localStorage.setItem('gn_library_view', v); renderMain(true); }
let librarySort = localStorage.getItem('gn_library_sort') || 'name';
const SORT_LABELS = { name: 'Nom (A→Z)', recent: 'Ajout récent', tag: 'Genre', owner: 'Provenance' };
function setLibrarySort(v) { librarySort = v; localStorage.setItem('gn_library_sort', v); renderMain(true); }

// Trie et, pour « genre » et « provenance », regroupe les jeux sous des en-têtes.
// La provenance retenue pour le regroupement est la personne qui a présenté le
// jeu en premier ; la ligne du jeu continue d'afficher tous ses possesseurs.
function groupGames(games, mode) {
  const byName = (a, b) => a.name.localeCompare(b.name);
  if (mode === 'recent') return [{ label: null, games: games.slice().sort((a, b) => b.ts - a.ts) }];
  if (mode === 'tag' || mode === 'owner') {
    const map = new Map();
    games.forEach(g => {
      const key = mode === 'tag' ? (g.tag || 'Autre') : (g.addedBy || 'Inconnu');
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(g);
    });
    return Array.from(map.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([label, list]) => ({ label, games: list.sort(byName) }));
  }
  return [{ label: null, games: games.slice().sort(byName) }];
}

function renderLibrary(main) {

  const btnRow = document.createElement('div'); btnRow.className = 'btn-row';
  const addBtn = document.createElement('button'); addBtn.className = 'btn btn-ghost'; addBtn.textContent = '+ Ajouter un jeu';
  const steamBtn = document.createElement('button'); steamBtn.className = 'btn btn-primary'; steamBtn.textContent = 'Lier mon compte Steam';
  btnRow.appendChild(addBtn); btnRow.appendChild(steamBtn); main.appendChild(btnRow);

  const pasteLink = document.createElement('button'); pasteLink.className = 'link-btn'; pasteLink.textContent = 'ou coller une liste copiée depuis Steam';
  pasteLink.style.marginTop = '4px';
  main.appendChild(pasteLink);

  const mpRow = document.createElement('div'); mpRow.className = 'mp-row'; mpRow.style.marginTop = '10px';
  mpRow.innerHTML = '<label><input type="checkbox" id="libMpOnly"' + (libraryMpFilter ? ' checked' : '') + '> 🎮 Multijoueur uniquement</label><button class="icon-btn danger" id="libRemoveSolo" style="display:none;" title="Retirer les jeux solo">' + ICON_TRASH + ' Solo</button>';
  main.appendChild(mpRow);
  mpRow.querySelector('#libMpOnly').onchange = e => setLibraryMpFilter(e.target.checked);
  mpRow.querySelector('#libRemoveSolo').onclick = () => {
    const n = State.games.filter(g => g.multiplayer === false).length;
    showConfirm('Retirer les ' + n + ' jeu(x) confirmé(s) solo de la bibliothèque ?', 'Retirer', removeSoloGames);
  };

  const formZone = libraryFormZone;
  main.appendChild(formZone);

  addBtn.onclick = () => {
    formZone.innerHTML = '';
    const f = document.createElement('div'); f.className = 'inline-form';
    f.innerHTML = '<input type="text" id="gnName" placeholder="Nom du jeu"><input type="text" id="gnTag" placeholder="Genre (FPS, Coop, Party game…)"><div class="btn-row"><button class="btn btn-ghost" id="gnCancel">Annuler</button><button class="btn btn-primary" id="gnSave">Ajouter</button></div>';
    formZone.appendChild(f);
    document.getElementById('gnCancel').onclick = () => { formZone.innerHTML = ''; };
    document.getElementById('gnSave').onclick = () => {
      const name = document.getElementById('gnName').value, tag = document.getElementById('gnTag').value;
      if (!name.trim()) { toast('Donne un nom au jeu.'); return; }
      addGame(name, tag); formZone.innerHTML = '';
    };
  };
  steamBtn.onclick = () => showSteamLink(formZone);
  pasteLink.onclick = () => showPasteImport(formZone);

  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:10px;flex-wrap:wrap;';
  const title = document.createElement('div'); title.className = 'section-title'; title.id = 'libTitle';
  titleRow.appendChild(title);
  const rightSide = document.createElement('div'); rightSide.style.cssText = 'display:flex;align-items:center;gap:10px;';
  const sortSel = document.createElement('select'); sortSel.className = 'sort-select'; sortSel.title = 'Trier par';
  sortSel.innerHTML = Object.entries(SORT_LABELS).map(([v, l]) => '<option value="' + v + '"' + (v === librarySort ? ' selected' : '') + '>' + l + '</option>').join('');
  sortSel.onchange = () => setLibrarySort(sortSel.value);
  rightSide.appendChild(sortSel);
  const toggle = document.createElement('div'); toggle.className = 'view-toggle';
  toggle.innerHTML = '<button data-v="list" title="Vue liste" aria-label="Vue liste">☰</button><button data-v="grid" title="Vue grille" aria-label="Vue grille">⊞</button>';
  toggle.querySelectorAll('button').forEach(b => { b.classList.toggle('active', b.dataset.v === libraryView); b.onclick = () => setLibraryView(b.dataset.v); });
  rightSide.appendChild(toggle);
  const clearAllBtn = document.createElement('button'); clearAllBtn.className = 'icon-btn danger'; clearAllBtn.id = 'libClear'; clearAllBtn.innerHTML = ICON_TRASH; clearAllBtn.title = 'Tout supprimer'; clearAllBtn.setAttribute('aria-label', 'Tout supprimer');
  clearAllBtn.onclick = () => showConfirm('Supprimer les ' + State.games.length + ' jeux de la bibliothèque ? Action irréversible.', 'Tout supprimer', clearAllGames);
  rightSide.appendChild(clearAllBtn);
  titleRow.appendChild(rightSide); main.appendChild(titleRow);

  const listHolder = document.createElement('div'); listHolder.id = 'libList'; main.appendChild(listHolder);
  refreshLibraryList(main);
}

function refreshLibraryList(main) {
  const shown = filteredGames();
  main.querySelector('#libTitle').textContent = 'Bibliothèque · ' + shown.length + (libraryMpFilter && shown.length !== State.games.length ? ' / ' + State.games.length : '');
  main.querySelector('#libClear').style.display = State.games.length ? '' : 'none';
  const soloCount = State.games.filter(g => g.multiplayer === false).length;
  const removeSoloBtn = main.querySelector('#libRemoveSolo');
  removeSoloBtn.style.display = soloCount ? '' : 'none';
  removeSoloBtn.title = 'Retirer les ' + soloCount + ' jeu(x) solo';
  const sel = main.querySelector('.sort-select'); if (sel && sel.value !== librarySort) sel.value = librarySort;
  if (libraryMpFilter) ensureMultiplayerCoverage();
  const holder = main.querySelector('#libList');
  holder.innerHTML = '';
  if (!shown.length) {
    const msg = State.games.length
      ? 'Aucun jeu confirmé multijoueur pour l\'instant — la vérification continue en arrière-plan.'
      : 'Ajoute-en un, lie ton compte Steam ou colle une liste.';
    const b = infoBox(State.games.length ? 'Rien à afficher avec ce filtre' : 'Aucun jeu pour l\'instant', msg);
    b.style.marginTop = '12px'; holder.appendChild(b); return;
  }
  const groups = groupGames(shown, librarySort);
  groups.forEach(grp => {
    if (grp.label !== null) {
      const h = document.createElement('div'); h.className = 'section-title lib-group'; h.textContent = grp.label + ' · ' + grp.games.length;
      holder.appendChild(h);
    }
    holder.appendChild(libraryView === 'grid' ? buildGameGrid(grp.games) : buildGameList(grp.games));
  });
}

function buildGameList(games) {
  const list = document.createElement('div'); list.className = 'game-list';
  games.forEach(g => {
    const row = document.createElement('div'); row.className = 'game-row' + (g.id === focusGameId ? ' focused' : ''); row.dataset.gid = g.id;
    row.innerHTML = '<div class="g-cover">'+coverHtml(g,{small:true})+'</div>' +
      '<div class="g-main"><div class="g-name">'+escapeHtml(g.name)+'</div><div class="g-by">Par '+escapeHtml(presentedBy(g))+'</div></div>' +
      '<span class="g-tag">'+escapeHtml(g.tag||'Autre')+'</span>' +
      '<button class="icon-btn" title="Retirer" aria-label="Retirer">'+ICON_TRASH+'</button>';
    row.addEventListener('click', e => { if (!e.target.closest('.icon-btn')) openInfo(g.id); });
    row.querySelector('.icon-btn').onclick = () => showConfirm('Retirer « '+g.name+' » de la bibliothèque ?', 'Retirer', () => removeGame(g.id));
    list.appendChild(row);
  });
  return list;
}
function buildGameGrid(games) {
  const grid = document.createElement('div'); grid.className = 'game-grid';
  games.forEach(g => {
    const item = document.createElement('div'); item.className = 'grid-item' + (g.id === focusGameId ? ' focused' : ''); item.dataset.gid = g.id;
    item.addEventListener('click', e => { if (!e.target.closest('.grid-del')) openInfo(g.id); });
    item.innerHTML = '<div class="grid-cover">'+coverHtml(g,{small:true})+'<button class="grid-del" title="Retirer" aria-label="Retirer">✕</button></div>' +
      '<div class="grid-name">'+escapeHtml(g.name)+'</div><div class="grid-by">'+escapeHtml(presentedBy(g))+'</div>';
    item.querySelector('.grid-del').onclick = e => { e.stopPropagation(); showConfirm('Retirer « '+g.name+' » de la bibliothèque ?', 'Retirer', () => removeGame(g.id)); };
    grid.appendChild(item);
  });
  return grid;
}

// --- Lien direct avec Steam ---
function showSteamLink(zone) {
  zone.innerHTML = '';
  const f = document.createElement('div'); f.className = 'inline-form';
  f.innerHTML =
    '<div class="hint">Colle le lien de ton profil Steam (ou ton pseudo, ou ton ID à 17 chiffres). Ton profil doit avoir <b>« Détails du jeu »</b> réglé sur <b>Public</b> : Steam › Profil › Modifier le profil › Paramètres de confidentialité.</div>' +
    '<input type="text" id="steamInput" placeholder="steamcommunity.com/id/ton-pseudo" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div class="btn-row"><button class="btn btn-ghost" id="steamCancel">Annuler</button><button class="btn btn-primary" id="steamGo">Récupérer mes jeux</button></div>' +
    '<div class="hint" id="steamStatus"></div>';
  zone.appendChild(f);
  const input = f.querySelector('#steamInput'), go = f.querySelector('#steamGo'), status = f.querySelector('#steamStatus');
  input.value = mySteam;
  f.querySelector('#steamCancel').onclick = () => { zone.innerHTML = ''; };
  const run = async () => {
    const val = input.value.trim();
    if (!val) { toast('Colle le lien de ton profil Steam.'); return; }
    go.disabled = true; status.textContent = 'Connexion à Steam…';
    try {
      const data = await fetchSteamLibrary(val);
      mySteam = val; localStorage.setItem('gn_steam', val);
      const ownedAppIds = data.games.map(g => g.appid).filter(Boolean);
      playersCol().doc(myId).set({ steamId: data.steamid, ownedAppIds }, { merge: true }).catch(() => {});
      showSteamPreview(zone, data.games);
    } catch (e) {
      status.textContent = steamErrorMessage(e && e.code);
      go.disabled = false;
    }
  };
  go.onclick = run;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
}

function hoursLabel(min) {
  if (!min) return '';
  if (min < 60) return min + ' min';
  return Math.round(min / 60) + ' h';
}
function showSteamPreview(zone, games) {
  zone.innerHTML = '';
  const box = document.createElement('div'); box.className = 'inline-form';
  const head = document.createElement('div'); head.className = 'hint';
  head.innerHTML = '<b>' + games.length + '</b> jeux trouvés sur ton compte, triés par temps de jeu. Les démos, playtests et outils sont décochés.';
  box.appendChild(head);

  const mpRow = document.createElement('div'); mpRow.className = 'mp-row';
  mpRow.innerHTML = '<label><input type="checkbox" id="mpOnly" checked> 🎮 Multijoueur uniquement</label><span class="ir-meta" id="mpProgress"></span>';
  box.appendChild(mpRow);
  const mpStatus = document.createElement('div'); mpStatus.className = 'hint'; mpStatus.id = 'mpStatus'; mpStatus.style.display = 'none';
  box.appendChild(mpStatus);

  const tools = document.createElement('div'); tools.className = 'import-tools';
  tools.innerHTML = '<button class="btn btn-ghost btn-sm" data-a="all">Tout</button><button class="btn btn-ghost btn-sm" data-a="none">Aucun</button><button class="btn btn-ghost btn-sm" data-a="top50">Top 50</button>';
  box.appendChild(tools);

  const preview = document.createElement('div'); preview.className = 'import-preview';
  games.forEach((g, i) => {
    const row = document.createElement('label'); row.className = 'import-row'; row.dataset.mp = g.appid ? 'pending' : 'unknown';
    const checked = !NOISE_GAME_RX.test(g.name);
    row.innerHTML = '<input type="checkbox" data-i="'+i+'"'+(checked ? ' checked' : '')+'><span class="ir-name">'+escapeHtml(g.name)+'</span><span class="ir-mp" title="Vérification du multijoueur">⋯</span><span class="ir-meta">'+hoursLabel(g.playtime)+'</span>';
    preview.appendChild(row);
  });
  box.appendChild(preview);

  const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary';
  box.appendChild(confirmBtn);
  zone.appendChild(box);

  const mpOnly = mpRow.querySelector('#mpOnly'), mpProgress = mpRow.querySelector('#mpProgress');
  const rowEls = Array.from(preview.querySelectorAll('.import-row'));
  const visible = row => row.style.display !== 'none';
  const boxes = () => rowEls.map(r => r.querySelector('input[type=checkbox]'));
  const refresh = () => {
    const n = rowEls.filter(r => visible(r) && r.querySelector('input').checked).length;
    confirmBtn.textContent = 'Ajouter la sélection (' + n + ')'; confirmBtn.disabled = !n;
  };
  // Filtre STRICT : seuls les jeux confirmés multijoueur restent visibles quand
  // la case est cochée. Un jeu qu'on n'a pas réussi à vérifier est masqué lui
  // aussi (mieux vaut en manquer un que de laisser passer un jeu solo) — mais
  // reste réessayable via le bouton dédié ci-dessous plutôt que perdu.
  function applyVisibility() {
    rowEls.forEach(row => { row.style.display = (mpOnly.checked && row.dataset.mp !== 'multi' && row.dataset.mp !== 'pending') ? 'none' : ''; });
    refresh();
  }
  preview.addEventListener('change', refresh);
  mpOnly.addEventListener('change', applyVisibility);
  tools.addEventListener('click', e => {
    const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    rowEls.forEach((row, i) => {
      const b = row.querySelector('input');
      b.checked = a === 'all' ? true : a === 'none' ? false : (i < 50 && !NOISE_GAME_RX.test(games[i].name));
    });
    refresh();
  });
  refresh();

  // Vérification progressive du multijoueur (et récupération de la description
  // au passage, pour ne pas la redemander plus tard une fois le jeu ajouté).
  // Concurrence volontairement basse : l'API boutique Steam limite le débit
  // assez fort, et il arrive qu'elle bloque carrément les appels venant d'un
  // serveur (comme Vercel) plutôt que d'un navigateur — voir le bouton
  // « Réessayer » et le message ci-dessous si beaucoup de jeux restent gris.
  const targets = rowEls.filter(r => games[+r.querySelector('input').dataset.i].appid);
  function checkOne(row) {
    const g = games[+row.querySelector('input').dataset.i];
    return fetchSteamInfo(g.appid).then(info => {
      if (info) {
        g._mp = typeof info.multiplayer === 'boolean' ? info.multiplayer : undefined;
        if (info.found) { g._desc = info.description; g._genres = info.genres; g._dev = info.developer; g._released = info.released; }
      } else g._mp = undefined;
      row.dataset.mp = g._mp === true ? 'multi' : g._mp === false ? 'solo' : 'unknown';
      const tag = row.querySelector('.ir-mp');
      tag.textContent = g._mp === true ? '🎮' : g._mp === false ? '🚫' : '❓';
      tag.title = g._mp === true ? 'Multijoueur confirmé' : g._mp === false ? 'Solo uniquement' : 'Non déterminé — masqué par précaution, réessayable';
    });
  }
  async function runCheck(rows) {
    let done = 0;
    mpProgress.textContent = 'Vérification multijoueur… 0/' + rows.length;
    await runPool(rows.map(row => async () => {
      await checkOne(row);
      done++;
      mpProgress.textContent = done < rows.length ? 'Vérification multijoueur… ' + done + '/' + rows.length : '';
      applyVisibility();
    }), 2);
    const unresolved = rows.filter(r => r.dataset.mp === 'unknown');
    if (unresolved.length) {
      const bad = unresolved.length / rows.length;
      mpStatus.style.display = '';
      mpStatus.innerHTML = (bad > 0.4
        ? '⚠️ Steam n\'a répondu pour presque aucun jeu (' + unresolved.length + '/' + rows.length + ') — il bloque peut-être les appels depuis ce serveur. '
        : (unresolved.length + ' jeu(x) n\'ont pas pu être vérifiés. ')) +
        'Ils restent masqués tant que le filtre est actif. <button class="link-btn" id="mpRetry" style="display:inline;padding:0;">Réessayer ces ' + unresolved.length + ' jeu(x)</button>';
      const retryBtn = mpStatus.querySelector('#mpRetry');
      if (retryBtn) retryBtn.onclick = () => { mpStatus.style.display = 'none'; runCheck(unresolved); };
    } else mpStatus.style.display = 'none';
  }
  if (targets.length) runCheck(targets); else mpProgress.textContent = '';

  confirmBtn.onclick = async () => {
    const chosen = rowEls.filter(r => visible(r) && r.querySelector('input').checked).map(r => games[+r.querySelector('input').dataset.i]);
    confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…';
    try {
      const r = await importGames(chosen.map(g => ({
        name: g.name, tag: 'Steam', appid: g.appid, image: g.image, fallbackImage: g.fallbackImage,
        desc: g._desc, genres: g._genres, dev: g._dev, released: g._released, multiplayer: g._mp,
      })));
      toast(summarizeImport(r));
      zone.innerHTML = '';
    } catch (e) { toast('L\'import a échoué. Réessaie.'); confirmBtn.disabled = false; refresh(); }
  };
}

// --- Import par copier-coller (solution de secours) ---
function showPasteImport(zone) {
  zone.innerHTML = '';
  const f = document.createElement('div'); f.className = 'inline-form';
  f.innerHTML = '<textarea id="pasteBox" placeholder="Colle ici la liste copiée depuis ta page Steam."></textarea><div class="btn-row"><button class="btn btn-ghost" id="pasteCancel">Annuler</button><button class="btn btn-primary" id="pasteGo">Analyser</button></div>';
  zone.appendChild(f);
  document.getElementById('pasteCancel').onclick = () => { zone.innerHTML = ''; };
  document.getElementById('pasteGo').onclick = () => showImportPreview(zone, document.getElementById('pasteBox').value);
}
function showImportPreview(zone, raw) {
  const candidates = cleanupPastedList(raw);
  zone.innerHTML = '';
  if (!candidates.length) { zone.appendChild(infoBox('Rien trouvé', 'Essaie de coller un bloc plus large de la page Steam.')); return; }
  const box = document.createElement('div'); box.className = 'inline-form';
  const preview = document.createElement('div'); preview.className = 'import-preview';
  candidates.forEach((name, i) => {
    const row = document.createElement('label'); row.className = 'import-row';
    row.innerHTML = '<input type="checkbox" checked data-i="'+i+'"><span class="ir-name">'+escapeHtml(name)+'</span>';
    preview.appendChild(row);
  });
  box.appendChild(preview);
  const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn btn-primary'; confirmBtn.textContent = 'Ajouter la sélection ('+candidates.length+')';
  confirmBtn.onclick = async () => {
    const checked = Array.from(preview.querySelectorAll('input:checked')).map(cb => ({ name: candidates[+cb.dataset.i], tag: 'Steam' }));
    if (!checked.length) { toast('Coche au moins un jeu.'); return; }
    confirmBtn.disabled = true; confirmBtn.textContent = 'Import en cours…';
    const r = await importGames(checked);
    toast(summarizeImport(r)); zone.innerHTML = '';
  };
  box.appendChild(confirmBtn);
  zone.appendChild(box);
}

let matchesView = localStorage.getItem('gn_matches_view') || 'list';
function setMatchesView(v) { matchesView = v; localStorage.setItem('gn_matches_view', v); renderMain(true); }

function renderMatches(main) {
  main.innerHTML = '';
  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;';
  const title = document.createElement('div'); title.className = 'section-title ornate'; title.style.flex = '1'; title.textContent = 'Matchs de ce soir';
  titleRow.appendChild(title);
  const stats = matchStats();
  if (stats.length) {
    const toggle = document.createElement('div'); toggle.className = 'view-toggle';
    toggle.innerHTML = '<button data-v="list" title="Vue liste" aria-label="Vue liste">☰</button><button data-v="grid" title="Vue grille" aria-label="Vue grille">⊞</button>';
    toggle.querySelectorAll('button').forEach(b => { b.classList.toggle('active', b.dataset.v === matchesView); b.onclick = () => setMatchesView(b.dataset.v); });
    titleRow.appendChild(toggle);
  }
  main.appendChild(titleRow);
  if (!stats.length) { main.appendChild(infoBox('Pas encore de match', 'Dès que plusieurs d\'entre vous auront aimé le même jeu, il apparaîtra ici.')); return; }
  main.appendChild(matchesView === 'grid' ? buildMatchGrid(stats) : buildMatchList(stats));
}
function buildMatchList(stats) {
  const list = document.createElement('div'); list.className = 'match-list';
  stats.forEach(m => {
    const row = document.createElement('div'); row.className = 'match-row' + (m.full ? ' full' : '') + (m.game.id === focusGameId ? ' focused' : ''); row.dataset.gid = m.game.id;
    row.addEventListener('click', () => openInfo(m.game.id));
    const names = m.likers.map(l => l.playerName).filter(Boolean).join(', ');
    row.innerHTML = '<div class="g-cover" style="width:44px;height:44px;">'+coverHtml(m.game,{small:true})+'</div>' +
      '<div class="m-body"><div class="m-name">'+escapeHtml(m.game.name)+'</div><div class="m-score">'+m.count+' sur '+m.denom+' — '+escapeHtml(names)+'</div></div>' +
      (m.full ? '<span class="m-badge">MATCH</span>' : '');
    list.appendChild(row);
  });
  return list;
}
function buildMatchGrid(stats) {
  const grid = document.createElement('div'); grid.className = 'game-grid';
  stats.forEach(m => {
    const names = m.likers.map(l => l.playerName).filter(Boolean).join(', ');
    const item = document.createElement('div'); item.className = 'grid-item' + (m.game.id === focusGameId ? ' focused' : ''); item.dataset.gid = m.game.id;
    item.addEventListener('click', () => openInfo(m.game.id));
    item.innerHTML = '<div class="grid-cover">' + coverHtml(m.game, { small: true }) + (m.full ? '<span class="m-badge" style="position:absolute;top:6px;left:6px;z-index:6;">MATCH</span>' : '') + '</div>' +
      '<div class="grid-name">' + escapeHtml(m.game.name) + '</div><div class="grid-by">' + m.count + '/' + m.denom + ' — ' + escapeHtml(names) + '</div>';
    grid.appendChild(item);
  });
  return grid;
}

const TAB_ORDER = ['deck', 'library', 'matches'];
function playPageIn(dir) {
  const main = document.getElementById('main');
  main.classList.remove('page-in-r', 'page-in-l'); void main.offsetWidth;
  main.classList.add('page-in-' + dir);
  const done = e => { if (e && e.target !== main) return; main.classList.remove('page-in-r', 'page-in-l'); main.removeEventListener('animationend', done); };
  main.addEventListener('animationend', done);
  setTimeout(() => done(null), 700);
}
document.querySelectorAll('nav.tabbar .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const next = tab.dataset.tab;
    if (next === currentTab) return;
    const dir = TAB_ORDER.indexOf(next) > TAB_ORDER.indexOf(currentTab) ? 'r' : 'l';
    currentTab = next;
    renderAll();
    playPageIn(dir);
  });
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const keys = Object.keys(THEMES);
  applyTheme(keys[(keys.indexOf(theme) + 1) % keys.length], true);
  renderHeader(); renderMain(true);
});
document.getElementById('roomPill').addEventListener('click', () => {
  if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(() => toast('Code copié : ' + roomCode));
});
document.getElementById('leaveBtn').addEventListener('click', leaveRoom);

// ---------------------------------------------------------------
// Porte d'entrée : rejoindre ou créer une salle
// ---------------------------------------------------------------
function showGate() {
  if (document.getElementById('gate')) return;
  const gate = document.createElement('div'); gate.className = 'gate'; gate.id = 'gate';
  gate.innerHTML =
    '<div class="box">' +
    '<div class="brand-sub">' + THEMES[theme].sub + '</div>' +
    '<h2>' + THEMES[theme].gate + '</h2>' +
    '<p>Entre le code de salle de tes amis pour les rejoindre, ou laisse vide pour ouvrir une nouvelle salle.</p>' +
    '<input type="text" id="gateCode" placeholder="Code de salle (ex : AB12C)" maxlength="8" style="text-transform:uppercase;" autocapitalize="characters">' +
    '<input type="text" id="gateName" placeholder="Ton prénom">' +
    '<button class="btn btn-primary" id="gateGo" style="width:100%;">Entrer</button>' +
    '</div>';
  document.body.appendChild(gate);
  document.getElementById('gateGo').onclick = () => {
    const name = document.getElementById('gateName').value.trim();
    let code = document.getElementById('gateCode').value.trim();
    if (!name) { toast('Donne ton prénom.'); return; }
    if (!code) code = randomRoomCode();
    joinRoom(code, name);
  };
}

applyTheme(theme);
if (roomCode && myName) {
  ensureHost().then(startListening);
  playersCol().doc(myId).set({ name: myName, color: colorFor(myId), playing: true, ts: Date.now() }, { merge: true });
} else {
  showGate();
}
